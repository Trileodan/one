    '<span class="swipe-hint u" id="hint-u">'+esc(lab("u","Done"))+'</span>'+
    '<span class="swipe-hint l" id="hint-l">'+esc(lab("l","Not now"))+'</span>'+
    '<span class="swipe-hint r" id="hint-r">'+esc(lab("r","Add"))+'</span>'+
    '<span class="swipe-hint d" id="hint-d">'+esc(lab("d","Leave"))+'</span>'+
    '<span class="pull-note">Let go to launch</span>'+
  '</div>';
}
function faceTask(t, sub){
  return '<div class="orb-task">'+esc(t.name)+'</div><div class="orb-sub">'+esc(sub || (t.duration+" min · "+t.type))+'</div>';
}
function orbMount(){
  var stage = document.getElementById("orbStage");
  Orb.stage = stage;
  if(!stage) return;
  Orb.twoFinger = false;
  /* the whole stage takes the gesture; which way you move decides what moves */
  var wrap = document.getElementById("orbWrap");
  if(wrap) wrap.addEventListener("pointerdown", swipeDown);
}
function cyc(x, n){
  var y = ((x % n) + n) % n;
  if(y > n/2) y -= n;
  return y;
}
function revealFace(){
  var face = document.getElementById("orbFace");
  if(!face) return;
  face.classList.remove("surfacing");
  void face.offsetWidth;
  face.classList.add("surfacing");
}

/* ============================================================
   THE SOLAR SYSTEM
   Your life, drawn as separate worlds. The Sun is today. The
   planets are the parts of life that own your tasks. Nothing
   here counts your backlog at you.
   ============================================================ */
/* Fixed angles on one slowly turning field: 120 degrees apart on the inner ring
   means Work and Home can never eclipse each other, and the whole sky still
   turns once a day. */
var SYS_LAYOUT = [
  { id:"work",     a:-62,  r:32, size:25, tex:"gas" },
  { id:"home",     a:58,   r:32, size:23, tex:"world" },
  { id:"projects", a:196,  r:41, size:16, tex:"belt" },
  { id:"errands",  a:122,  r:41, size:13, tex:"comet" }
];
/* Seconds since midnight -> where the whole system sits. One revolution a day,
   so the sky at nine in the morning is not the sky at four in the afternoon. */
function dayPhase(){
  var d = new Date();
  return d.getHours()*3600 + d.getMinutes()*60 + d.getSeconds();
}
function orbitAngle(){ return dayPhase() / 86400 * 360; }
function paintOrbits(){
  var field = document.getElementById("orbitField");
  if(!field) return;
  var a = orbitAngle();
  field.style.transform = "rotate("+a.toFixed(3)+"deg)";
  field.parentNode.querySelectorAll(".upright").forEach(function(u){
    u.style.transform = "rotate("+(-a).toFixed(3)+"deg)";
  });
}
function sysBodyHTML(b){
  var p = planetById(b.id);
  if(!p) return "";
  var inner = "";
  if(b.tex === "belt") inner = '<span class="belt-rock r1"></span><span class="belt-rock r2"></span><span class="belt-rock r3"></span>';
  else if(b.tex === "comet") inner = "";
  else if(b.tex === "world") inner = '<span class="tex"></span><span class="clouds"></span><span class="lights"></span>';
  else inner = '<span class="tex"></span><span class="spot"></span>';
  return '<div class="slot" style="--a:'+b.a+'deg">'+
    '<button class="body '+b.tex+'" type="button" data-planet="'+esc(p.id)+'" '+
      'style="--r:'+b.r+'%;--sz:'+b.size+'%;--orb-h:'+p.hue+';--a:'+b.a+'deg">'+
      (b.tex === "comet" ? '<span class="tail-wrap"><span class="comet-tail"></span><span class="comet-tail t2"></span></span>' : '')+
      '<span class="upright">'+
        '<span class="body-orb">'+inner+'</span>'+
        '<span class="body-name">'+esc(p.label)+'</span>'+
      '</span>'+
    '</button>'+
  '</div>';
}
/* A sky worth looking at: fixed stars that breathe, and the odd visitor that
   crosses once every half-minute or so and is gone. */
function skyHTML(){
  if(reduceMotion()) return '<div class="sky" id="sky"></div>';
  var out = "", i, seed = 0;
  var rnd = function(){ seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  seed = 12345;
  for(i=0;i<74;i++){
    var sz = (rnd()*1.7 + 0.7).toFixed(2);
    out += '<span class="star" style="left:'+(rnd()*100).toFixed(1)+'%;top:'+(rnd()*100).toFixed(1)+'%;'+
           'width:'+sz+'px;height:'+sz+'px;--o:'+(0.25 + rnd()*0.6).toFixed(2)+';'+
           '--tw:'+(2.6 + rnd()*5).toFixed(1)+'s;--td:-'+(rnd()*8).toFixed(1)+'s"></span>';
  }
  var comets = [
    { x:112, y:8,  sx:-124, sy:52, dur:29, d:3 },
    { x:96,  y:-6, sx:-108, sy:78, dur:43, d:19 },
    { x:118, y:44, sx:-130, sy:26, dur:37, d:31 }
  ];
  var vw = window.innerWidth/100, vh = window.innerHeight/100;
  comets.forEach(function(c){
    /* the tail points back the way it came, in real pixels, not in viewport units */
    var ang = Math.atan2(-c.sy * vh, -c.sx * vw) * 180 / Math.PI;
    var len = Math.min(190, Math.sqrt(Math.pow(c.sx*vw,2) + Math.pow(c.sy*vh,2)) * 0.16);
    out += '<span class="shooter" style="left:'+c.x+'vw;top:'+c.y+'vh;'+
           '--sx:'+c.sx+'vw;--sy:'+c.sy+'vh;--dur:'+c.dur+'s;--sd:-'+c.d+'s;'+
           '--ang:'+ang.toFixed(1)+'deg;--tail:'+len.toFixed(0)+'px"></span>';
  });
  return '<div class="sky" id="sky">'+out+'</div>';
}
function sysHTML(){
  var p = dayProgress();
  var sun = '<button class="body sun" type="button" data-planet="__sun" style="--r:0%;--sz:27%;--a:0deg">'+
      '<span class="upright"><span class="body-orb">'+
        '<span class="sun-flare"></span><span class="sun-tex"></span>'+
        '<span class="sun-num">'+p.count+'</span>'+
        '<span class="sun-sub">'+(p.done ? fmtDur(p.done) : "today")+'</span>'+
      '</span></span></button>';
  return '<div class="sys" id="sysStage">'+
      '<span class="orbit o1" aria-hidden="true"></span>'+
      '<span class="orbit o2" aria-hidden="true"></span>'+
      '<div class="orbit-field" id="orbitField">'+
        '<div class="slot" style="--a:0deg">'+sun+'</div>'+
        SYS_LAYOUT.map(sysBodyHTML).join("")+
      '</div>'+
    '</div>';
}
/* the sky is hung on the document, not inside the app column, or it gets
   clipped to a neat little rectangle and stops being a sky */
function mountSky(){
  /* rebuilding the sky restarts 74 twinkles at once, which reads as a jolt */
  if(document.getElementById("sky")){ document.body.classList.add("in-space"); return; }
  var d = document.createElement("div");
  d.innerHTML = skyHTML();
  document.body.insertBefore(d.firstChild, document.body.firstChild);
  document.body.classList.add("in-space");
}
function unmountSky(){
  var old = document.getElementById("sky");
  if(old) old.remove();
  document.body.classList.remove("in-space");
}
function sysMount(){
  var stage = document.getElementById("sysStage");
  if(!stage) return;
  mountSky();
  paintOrbits();
  stage.querySelectorAll("[data-planet]").forEach(function(b){
    b.addEventListener("click", function(){
      var id = b.dataset.planet;
      if(id === "__sun"){ go("done"); return; }
      enterPlanet(id, b);
    });
  });
}

/* ============================================================
   TRAVELLING BETWEEN WORLDS

   The trick to making this feel like one continuous move rather
   than two animations bolted together: the world you tapped and
   the sphere you land on are treated as the same object. We
   measure where the little planet is, render the big sphere,
   then start it exactly on top of the planet and let it grow
   into place. Nothing cuts, because nothing is ever swapped —
   it is one thing, getting closer.
   ============================================================ */
var Flight = null;
function reduceMotion(){
  return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
}
function centreOf(el){
  var r = el.getBoundingClientRect();
  return { x:r.left + r.width/2, y:r.top + r.height/2, d:r.width };
}
/* the transform that would drop element `now` exactly onto rect `then` */
function flipTo(nowC, thenC){
  return "translate("+(thenC.x - nowC.x).toFixed(1)+"px,"+(thenC.y - nowC.y).toFixed(1)+"px) "+
         "scale("+(thenC.d / Math.max(1, nowC.d)).toFixed(4)+")";
}
function streakStars(out, fromX, fromY){
  var sky = document.getElementById("sky");
  if(!sky) return;
  sky.classList.add("warp");
  sky.querySelectorAll(".star").forEach(function(st){
    var r = st.getBoundingClientRect();
    var dx = (r.left - fromX) * 7, dy = (r.top - fromY) * 7;
    if(out){
      st.style.transform = "translate("+dx.toFixed(0)+"px,"+dy.toFixed(0)+"px)";
      st.style.opacity = "0";
    } else {
      st.style.transition = "none";
      st.style.transform = "translate("+dx.toFixed(0)+"px,"+dy.toFixed(0)+"px)";
      st.style.opacity = "0";
      void st.offsetWidth;
      st.style.transition = "";
      st.style.transform = "";
      st.style.opacity = "";
    }
  });
}
/* freeze what's on screen so the new view can be built underneath it */
function liftOverlay(el, cls){
  var r = el.getBoundingClientRect();
  var wrap = document.createElement("div");
  wrap.className = "lift "+(cls||"");
  wrap.style.cssText = "position:fixed;left:"+r.left+"px;top:"+r.top+"px;width:"+r.width+"px;height:"+r.height+"px;";
  var clone = el.cloneNode(true);
  clone.removeAttribute("id");
  clone.querySelectorAll("[id]").forEach(function(n){ n.removeAttribute("id"); });
  clone.style.cssText += ";position:absolute;inset:0;margin:0;width:100%;height:100%";
  wrap.appendChild(clone);
  document.body.appendChild(wrap);
  return wrap;
}

/* ---------- outward: three seconds of getting closer ----------
   The planet you tapped is lifted out of the system as its own object and grows
   until it *is* the world you're standing on — same gradients, same texture, so
   the hand-over at the end is invisible. The rest of the system flies past you
   separately. Nothing arrives from behind anything. */
var FLY_MS = 2400;
function enterPlanet(id, el){
  if(!planetById(id) || Flight) return;
  var stage = document.getElementById("sysStage");
  var target = el && el.querySelector(".body-orb");
  if(!stage || !target || reduceMotion()){ landOn(id); return; }

  var from = centreOf(target);
  /* The world travels with you; everything else is scenery you leave behind.
     What matters is that the thing in your hand is drawn the same way at both
     ends of the journey — a little planet's surface lives on the button around
     it, so the lift has to carry that class or the stripes vanish and reappear
     at the last second. Where the sky's version and the close-up disagree
     (a comet, a belt), the traveller wears the close-up from the start: any
     change is better spent at forty pixels than at four hundred. */
  var skin = planetSkin(id);
  var sysTex = (String(el.className).match(/\b(gas|world|belt|comet)\b/) || [""])[0];
  var traveller;
  if(sysTex === skin.cls){
    traveller = liftOverlay(target, "lift-planet " + sysTex);
  } else {
    traveller = liftOverlay(target, "lift-planet " + skin.cls);
    var face = traveller.firstChild;
    face.innerHTML = skin.inner;
  }
  traveller.style.setProperty("--orb-h", String(planetHue(id)));
  el.style.visibility = "hidden";
  var ghost = liftOverlay(stage, "lift-sys");
  var sr = stage.getBoundingClientRect();
  ghost.style.setProperty("--ox", ((from.x - sr.left) / stage.offsetWidth * 100).toFixed(1)+"%");
  ghost.style.setProperty("--oy", ((from.y - sr.top) / stage.offsetHeight * 100).toFixed(1)+"%");
  streakStars(true, from.x, from.y);

  landOn(id, true);

  var orb = document.getElementById("orb");
  var root = document.getElementById("nowRoot");
  if(!orb){ ghost.remove(); traveller.remove(); return; }
  /* Hide and still the destination first, then measure it: the rect has to be
     the one the traveller will actually land on. */
  root.classList.add("approaching");
  var to = centreOf(orb);

  traveller.style.transformOrigin = "50% 50%";
  traveller.style.transition = "none";
  traveller.style.transform = "translate(0,0) scale(1)";
  void traveller.offsetWidth;

  requestAnimationFrame(function(){
    ghost.classList.add("gone");
    /* Moving towards something at a steady speed makes it swell faster the
       closer you get. Ease in, but not from a standstill — a full second of
       nothing reads as a hang, not as distance. */
    traveller.style.transition = "transform "+FLY_MS+"ms cubic-bezier(.45,0,.15,1)";
    traveller.style.transform = flipTo(from, to);
  });

  var arrive = function(){
    if(!Flight) return;
    clearTimeout(Flight.t);
    document.removeEventListener("pointerdown", Flight.skip, true);
    Flight = null;
    if(ghost.parentNode) ghost.remove();
    /* Hand over in a single frame: reveal the real world and take the traveller
       away together. Any overlap at all shows up as a flicker, because the two
       spheres are alike but not identical. */
    var rt = document.getElementById("nowRoot");
    var fl = document.getElementById("orbFloat");
    if(fl){ fl.style.transition = "none"; fl.style.opacity = "1"; }
    if(rt) rt.classList.remove("approaching");
    if(traveller.parentNode) traveller.remove();
    if(fl) requestAnimationFrame(function(){ fl.style.transition = ""; fl.style.opacity = ""; });
    revealFace();
    moonArrive();
    var open = planetOpen(id).filter(function(t){ return !isResting(t); });
  };
  Flight = { skip:function(e){
    e.preventDefault(); e.stopPropagation();
    traveller.style.transition = "transform .45s cubic-bezier(.2,.9,.3,1)";
    traveller.style.transform = flipTo(from, to);
    setTimeout(arrive, 440);
  } };
  /* Land on the frame the transition actually finishes, not on a guess — a
     handover even one frame early shows the last of the growth snap. */
  traveller.addEventListener("transitionend", function(ev){
    if(ev.propertyName === "transform") arrive();
  });
  Flight.t = setTimeout(arrive, FLY_MS + 260);
  setTimeout(function(){ if(Flight) document.addEventListener("pointerdown", Flight.skip, true); }, 500);
}
function landOn(id, quiet){
  S.session.planet = id;
  S.session.enteredAt = Date.now();
  S.session.sessionDone = false;
  S.session.keepGoing = false;
  S.ui.arrival = null;
  unpin(); save();
  applyHue(); renderNow(true); renderChips(); renderList();
  if(quiet) return;
  var open = planetOpen(id).filter(function(t){ return !isResting(t); });
  if(open.length) toast(planetLabel(id)+". Nothing else exists for a bit.");
}

/* ---------- inward: sling it away, then fall back into the system ---------- */
function leavePlanet(){
  if(S.focus && !S.focus.paused){ toast("Clock's running. Finish it or park it first."); return; }
  var wrap = document.getElementById("orbWrap");
  var orb = document.getElementById("orb");
  var leaving = S.session.planet;

  var settle = function(){
    S.session.planet = null;
    S.focus = null; stopTicker();
    S.ui.arrival = null;
    unpin(); save();
    applyHue(); renderNow(true); renderChips(); renderList();
  };
  if(!wrap || !orb || reduceMotion()){ settle(); return; }

  var from = centreOf(orb);
  /* Leaving starts where arriving finished: right up against the world. The
     camera then falls all the way back while the sphere sails off. */
  var camera = { x:from.x, y:from.y, d:from.d * 2.05 };
  var thrown = liftOverlay(wrap, "lift-orb");     /* planet and moon leave together */
  wrap.style.visibility = "hidden";
  thrown.classList.add("thrown");

  settle();

  var stage = document.getElementById("sysStage");
  var body = stage && stage.querySelector('[data-planet="'+leaving+'"] .body-orb');
  if(stage && body){
    var to = centreOf(body);
    var sr = stage.getBoundingClientRect();
    stage.style.transformOrigin = ((to.x - sr.left) / stage.offsetWidth * 100).toFixed(1)+"% "+
                                  ((to.y - sr.top) / stage.offsetHeight * 100).toFixed(1)+"%";
    stage.style.transition = "none";
    stage.style.transform = flipTo(to, camera);
    stage.style.opacity = "0";
    stage.classList.add("zooming");
    void stage.offsetWidth;
    requestAnimationFrame(function(){
      stage.style.transition = "transform 1650ms cubic-bezier(.34,.42,.28,1) 120ms, opacity 460ms ease 120ms";
      stage.style.transform = "translate(0,0) scale(1)";
      stage.style.opacity = "1";
    });
    setTimeout(function(){ stage.classList.remove("zooming"); }, 780);
    /* clear the inline transform only once the browser says the move is over,
       otherwise the last frame snaps */
    var done = function(e){
      if(e && e.propertyName !== "transform") return;
      stage.removeEventListener("transitionend", done);
      stage.style.transition = ""; stage.style.transform = ""; stage.style.opacity = ""; stage.style.transformOrigin = "";
    };
    stage.addEventListener("transitionend", done);
    setTimeout(done, 2100);
    streakStars(false, from.x, from.y);
  }
  setTimeout(function(){ if(thrown.parentNode) thrown.remove(); }, 720);
}

/* where your body is — separate from which world you're working in */
function setPlace(id){
  if(!locById(id)) return;
  var prevPlace = S.session.lastPlace;
  S.session.location = id;
  if(isTransit(id)) S.session.briefed = true;
  else {
    var outstanding = transitTasks();
    S.session.lastPlace = id;
    S.session.briefed = false;
    if(prevPlace && prevPlace !== id && outstanding.length && isTransit(prevPlace)){
      toast(outstanding.length+" thing"+(outstanding.length===1?"":"s")+" still on the errand run.");
    }
  }
  unpin(); save(); renderNow(true); renderChips();
}

/* ============================================================
   THE PICKER — press and hold to flick through what's here
   ============================================================ */
var Pick = { on:false, list:[], els:[], pos:0, vel:0, raf:null, drag:null, step:54 };

/* Only this world's tasks, ever. Manual selection is useful; browsing the rest
   of your life while you are trying to work is not. */
function pickerList(){
  var pool = planetPool().filter(function(t){ return !t.fixedStart && !isResting(t); }).filter(locationOK);
  var recent = recentDone(3);
  var ctx = {
    recent:recent, lunch:lunchInfo(), transit:isErrandPlanet(S.session.planet),
    heavy: recent.filter(function(r){ return r.effort==="deep" || r.duration>=45; }).length,
    workingHours: workingHours(),
    workEasyWin: pool.some(function(t){ return t.category === "Work" && (t.effort === "easy" || t.duration <= 15); }),
    runway: isErrandPlanet(S.session.planet) ? { mins:600, what:"", kind:"none" } : runway(),
    minsLeftOfDay: Math.max(0, hhmmToMins(S.settings.workUntil) - minsOfDay())
  };
  return pool.map(function(t){ return { t:t, s:scoreTask(t, ctx).score }; })
             .sort(function(a,b){ return b.s - a.s; })
             .map(function(r){ return r.t; });
}
function canPick(){
  if(S.session.dayClosed || !S.session.started || !S.session.planet) return false;
  if(committedTask()) return false;      /* you committed — no browsing for something nicer */
  if(currentFixed()) return false;
  if(S.focus && !S.focus.paused) return false;      /* not while the clock is running */
  if(!isErrandPlanet(S.session.planet) && S.session.lunchState === "active") return false;
  return true;
}
function openPicker(at){
  if(!canPick()) return;
  var list = pickerList();
  if(list.length < 2){ toast(list.length ? "That's the only thing here." : "Nothing here to choose from."); return; }
  Pick.on = true; Pick.list = list; Pick.vel = 0;
  Pick.armed = false;      /* the release that opened this must not also choose */
  var cur = S.ui.pinnedId, idx = 0;
  for(var i=0;i<list.length;i++) if(list[i].id === cur) idx = i;
  Pick.pos = idx;
  var orb = document.getElementById("orb");
  if(orb) orb.classList.add("picking");
  if(Orb.stage) Orb.stage.classList.add("picking");
  var host = document.getElementById("orbWrap") || orb;
  var el = document.getElementById("orbPick");
  if(!el){ el = document.createElement("div"); el.id = "orbPick"; el.className = "orb-pick"; host.appendChild(el); }
  el.innerHTML = list.map(function(t,i){
    var note = t.duration+" min";
    if(S.focus && S.focus.taskId === t.id) note += " · paused";
    else if(!isRecurring(t) && t.actualMinutes > 0) note += " · "+fmtDur(t.actualMinutes)+" in";
    else if(t.postponedToday >= 3) note += " · dodged "+t.postponedToday+"×";
    else if(isRecurring(t)) note += " · "+repeatLabel(t.repeatEvery);
    var fl = flagFor(t);
    return '<button class="pick-item" type="button" data-pi="'+i+'">'+
      (fl ? '<span class="moon-flag sm '+fl.kind+'" aria-label="'+esc(fl.label)+'"><span class="pennant"></span></span>' : '')+
      '<b>'+esc(t.name)+'</b><small>'+esc(note)+'</small></button>';
  }).join("");
  Pick.els = [].slice.call(el.querySelectorAll(".pick-item"));
  Pick.els.forEach(function(b){
    b.addEventListener("click", function(ev){
      ev.stopPropagation();
      if(!Pick.armed) return;
      if(Pick.moved && performance.now() - Pick.movedAt < 320) return;
      var i = +b.dataset.pi, off = cyc(i - Pick.pos, Pick.list.length);
      /* You tapped a task by name — take it. Only the still-moving list gets the
         old behaviour of scrolling your choice to the middle first, because a tap
         landing mid-flick isn't really a choice. */
      if(Math.abs(off) > 1.45) return;
      if(!Pick.raf || Math.abs(off) < 0.5) choosePicked(i);
      else { Pick.settleTo = Pick.pos + off; Pick.vel = 0; Pick.snapping = true; pickRun(); }
    });
  });
  layoutPicker();
  var rl = document.querySelector("#nowRoot .runway");
  if(rl){ rl.dataset.was = rl.textContent; rl.textContent = "Scroll · tap to pick"; }
  el.addEventListener("pointerdown", pickDown);
  /* The press that opened this wheel is still on the glass. Hand it straight to
     the wheel so the same finger can carry on and spin it — otherwise you have
     to lift off and touch down again before anything moves. */
  if(at) pickDown({ clientY: at.y }, true);
}
function layoutPicker(){
  var orb = document.getElementById("orb");
  if(!orb) return;
  var R = orb.offsetWidth/2, n = Pick.list.length;
  Pick.step = Math.max(66, R*0.66);
  Pick.els.forEach(function(el,i){
    var off = cyc(i - Pick.pos, n), ad = Math.abs(off);
    /* Position everything, even what's out of sight - a hidden item that kept an
       old transform comes back in the wrong place and, worse, in the wrong place
       to tap. */
    el.style.transform = "translate(-50%,-50%) translateY("+(off*Pick.step).toFixed(1)+"px) scale(0.84)";
    if(ad > 1.55){ el.style.opacity = "0"; el.style.visibility = "hidden"; return; }
    el.style.visibility = "visible";
    var op = Math.max(0, 1 - ad/1.45);
    el.style.transform = "translate(-50%,-50%) translateY("+(off*Pick.step).toFixed(1)+"px) scale("+(0.84+0.16*op).toFixed(3)+")";
    el.style.opacity = (0.06 + 0.94*op*op).toFixed(3);
    el.classList.toggle("on", ad < 0.04);
  });
}
function pickDown(e, carryOn){
  /* carryOn means the wheel opened under a finger that is already down: it can
     spin straight away, but the release that opened it must not pick anything */
  if(!carryOn) Pick.armed = true;
  Pick.drag = { y:e.clientY, t:performance.now() };
  Pick.moved = false; Pick.snapping = false; Pick.vel = 0;
  window.addEventListener("pointermove", pickMove);
  window.addEventListener("pointerup", pickUp);
  window.addEventListener("pointercancel", pickUp);
}
function pickMove(e){
  if(!Pick.drag) return;
  var dy = e.clientY - Pick.drag.y, t = performance.now(), dt = Math.max(8, t - Pick.drag.t);
  if(Math.abs(dy) > 3){ Pick.moved = true; Pick.movedAt = t; }
  var d = -dy / Pick.step;
  Pick.pos += d;
  Pick.vel = Math.max(-0.12, Math.min(0.12, d / dt * 16));
  Pick.drag.y = e.clientY; Pick.drag.t = t;
  layoutPicker();
  e.preventDefault();
}
function pickUp(){
  if(!Pick.drag) return;
  Pick.drag = null;
  window.removeEventListener("pointermove", pickMove);
  window.removeEventListener("pointerup", pickUp);
  window.removeEventListener("pointercancel", pickUp);
  if(Pick.moved) pickRun();
}
function pickRun(){
  if(Pick.raf) return;
  var tick = function(){
    Pick.raf = null;
    if(Pick.drag) return;
    if(!Pick.snapping){
      Pick.pos += Pick.vel; Pick.vel *= 0.86;
      if(Math.abs(Pick.vel) < 0.005){ Pick.snapping = true; Pick.settleTo = Math.round(Pick.pos); }
    } else {
      var diff = Pick.settleTo - Pick.pos;
      Pick.pos += diff * 0.28;
      if(Math.abs(diff) < 0.002){ Pick.pos = Pick.settleTo; layoutPicker(); return; }
    }
    layoutPicker();
    Pick.raf = requestAnimationFrame(tick);
  };
  Pick.raf = requestAnimationFrame(tick);
}
function choosePicked(i){
  var n = Pick.list.length;
  var idx = ((Math.round(i) % n) + n) % n;
  var t = Pick.list[idx];
  closePicker();
  if(!t) return;
  /* The picker is offered while a timer is paused, so nine times out of ten
     there's a half-finished task still holding the screen. Park it properly —
     minutes banked against it, no black mark for switching — or your choice
     changes the pin and nothing else, and the orb carries on showing the task
     you just walked away from. */
  var parked = null;
  if(S.focus && S.focus.taskId !== t.id){
    var old = byId(S.focus.taskId), mins = endFocus();
    if(old){
      old.actualMinutes = (old.actualMinutes||0) + mins;
      parked = { name:old.name, mins:mins };
    }
  }
  S.ui.pinnedId = t.id;
  if(t.lastPostponedAt) t.lastPostponedAt = null;      /* you chose it, so it isn't resting any more */
  save(); renderNow(true);
  say("picked", { task:t, parked:parked, skipped:byId(S.ui.lastServedId) });
}
function closePicker(){
  if(!Pick.on) return;
  Pick.on = false;
  if(Pick.raf){ cancelAnimationFrame(Pick.raf); Pick.raf = null; }
  var el = document.getElementById("orbPick");
  if(el) el.remove();
  var orb = document.getElementById("orb"); if(orb) orb.classList.remove("picking");
  if(Orb.stage) Orb.stage.classList.remove("picking");
  var rl = document.querySelector("#nowRoot .runway");
  if(rl && rl.dataset.was){ rl.textContent = rl.dataset.was; delete rl.dataset.was; }
}

/* ---------- swipes on the sphere ---------- */
function swipeDown(e){
  if(Orb.twoFinger || Pick.on) return;
  Orb.swipe = { x:e.clientX, y:e.clientY, t:performance.now(), dir:null };
  clearTimeout(Orb.holdT);
  Orb.holdT = setTimeout(function(){
    if(Orb.swipe && !Orb.swipe.dir){ var at = { y:Orb.swipe.y }; cancelSwipe(); openPicker(at); }
  }, 480);
  var mn = document.getElementById("moon");
  if(mn) mn.classList.add("held");
  window.addEventListener("pointermove", swipeMove);
  window.addEventListener("pointerup", swipeUp);
  window.addEventListener("pointercancel", cancelSwipe);
}
function swipeDir(dx, dy){
  if(Math.abs(dx) > Math.abs(dy)) return dx < 0 ? "l" : "r";
  return dy < 0 ? "u" : "d";
}
function swipeMove(e){
  var s = Orb.swipe; if(!s) return;
  if(Orb.twoFinger){ cancelSwipe(); return; }
  var dx = e.clientX - s.x, dy = e.clientY - s.y, dist = Math.sqrt(dx*dx + dy*dy);
  var moon = document.getElementById("moon"), wrap = document.getElementById("orbWrap"), stage = Orb.stage;
  var down = dy > 0 && Math.abs(dy) > Math.abs(dx) * 1.2;

  if(down && S.session.planet){
    /* Pulling a whole world out of orbit takes effort: the further it comes the
       harder it pulls back. Planet and moon travel together. */
    if(moon) moon.style.transform = "";
    var pull = PULL_MAX * (1 - Math.exp(-dy / 120));
    if(wrap){
      wrap.style.transition = "none";
      wrap.style.transform = "translateY("+(pull - 16).toFixed(1)+"px) scale("+(1 - pull/1500).toFixed(4)+")";
    }
    if(stage){
      stage.classList.add("pulling");
      stage.classList.toggle("armed", pull > PULL_ARM);
    }
  } else if(moon){
    /* the moon is the part you handle; the world behind it stays put */
    if(wrap){ wrap.style.transition = ""; wrap.style.transform = ""; }
    if(stage) stage.classList.remove("pulling", "armed");
    moon.style.animation = "none";
    var mx = dx * 0.86, my = Math.min(0, dy) * 0.86;
    moon.style.transform = "translate(-50%,-50%) translate("+mx.toFixed(1)+"px,"+my.toFixed(1)+"px) rotate("+(mx*0.03).toFixed(2)+"deg)";
  }
  if(dist > 10) clearTimeout(Orb.holdT);
  var dir = dist > 18 ? swipeDir(dx, dy) : null;
  if(dir !== s.dir){
    ["l","r","u","d"].forEach(function(k){
      var h = document.getElementById("hint-"+k);
      if(h) h.classList.toggle("on", k === dir);
    });
    s.dir = dir;
  }
}
var PULL_MAX = 150, PULL_ARM = 74;
function clearSwipeVisuals(){
  var w = document.getElementById("orbWrap");
  if(w){ w.style.transition = "transform .42s cubic-bezier(.2,1.3,.4,1)"; w.style.transform = ""; }
  var m = document.getElementById("moon");
  if(m){
    m.classList.remove("held");
    if(!/go-/.test(m.className)){
      m.style.transition = "transform .38s cubic-bezier(.2,1.25,.4,1)";
      m.style.transform = "";
      setTimeout(function(){ m.style.transition = ""; m.style.animation = ""; }, 400);
    }
  }
  if(Orb.stage) Orb.stage.classList.remove("pulling", "armed");
  ["l","r","u","d"].forEach(function(k){ var h = document.getElementById("hint-"+k); if(h) h.classList.remove("on"); });
  var o = document.getElementById("orb"); if(o) o.classList.remove("grabbing");
}
function cancelSwipe(){
  clearTimeout(Orb.holdT);
  Orb.swipe = null;
  clearSwipeVisuals();
  window.removeEventListener("pointermove", swipeMove);
  window.removeEventListener("pointerup", swipeUp);
  window.removeEventListener("pointercancel", cancelSwipe);
}
function swipeUp(e){
  var s = Orb.swipe; if(!s) return;
  var dx = e.clientX - s.x, dy = e.clientY - s.y;
  var dist = Math.sqrt(dx*dx + dy*dy), dt = performance.now() - s.t;
  var dir = swipeDir(dx, dy);
  var pulled = dy > 0 && dir === "d" ? PULL_MAX * (1 - Math.exp(-dy / 120)) : 0;
  cancelSwipe();
  if(dist < 14 && dt < 500){ orbTap(); return; }
  if(dir === "d"){ if(pulled > PULL_ARM) orbSwipe("d"); return; }   /* let go short and it springs back */
  if(dist < 44) return;
  orbSwipe(dir);
}

/* ============================================================
   11. DASHBOARD
   ============================================================ */
/* What the dashboard should be showing, worked out before anything is drawn.
   If it matches what's already on screen the ink is left alone and only the
   time-sensitive lines are refreshed. */
function nowView(){
  var s = S.session;
  if(s.dayClosed) return { kind:"closed" };
  if(!s.started) return { kind:"start" };
  if(S.focus) return { kind:"focus", id:S.focus.taskId, paused:!!S.focus.paused, mins:S.focus.plannedMin + S.focus.addedMin };
  /* No planet chosen means you're out in the system, looking at your life from
     a distance. That is a legitimate place to be — it's where you stop. */
  if(!s.planet) return { kind:"system" };
  var over = s.sessionDone ? "cleared" : sessionShouldEnd();
  if(over) return { kind:"sessionDone", why:over };
  if(!isErrandPlanet(s.planet) && s.lunchState === "active") return { kind:"lunchOn" };
  if(!planetOpen(s.planet).length) return { kind:"empty" };
  var choice = chooseTask();
  if(choice.lunch) return { kind:"lunchDue", early:!!choice.early, choice:choice };
  if(!choice.task) return { kind:"nothing", choice:choice };
  return { kind: isErrandPlanet(s.planet) ? "transit" : "one", choice:choice, id:choice.task.id };
}
function viewSig(v){
  return [v.kind, v.id||"", v.why||"", v.paused?1:0, v.mins||"", S.session.planet||"-", S.session.location,
          v.choice && v.choice.rest ? v.choice.rest.length : 0].join("|");
}
var lastNowSig = null;
function refreshNowLines(){
  var rl = document.querySelector("#nowRoot .runway"), dl = document.querySelector("#nowRoot .dayline");
  if(rl && !S.focus && S.session.planet && !isErrandPlanet(S.session.planet) && !S.session.dayClosed){
    var w = runway();
    if(w.kind !== "none") rl.textContent = fmtDur(w.mins)+" until "+w.what;
  }
  if(dl){
    var p = dayProgress();
    if(/done/.test(dl.textContent)) dl.textContent = p.count+" done · "+fmtDur(p.done)+" on the clock";
  }
  paintDayRing();
}
function renderNow(force){
  var root = document.getElementById("nowRoot");
  applyHue();
  var v = nowView(), sig = viewSig(v);
  if(!force && sig === lastNowSig && (document.getElementById("orbStage") || document.getElementById("sysStage"))){
    refreshNowLines();
    return;
  }
  lastNowSig = sig;
  if(v.kind !== "system") unmountSky();
  if(v.kind === "closed"){ root.innerHTML = viewDayClosed(); orbMount(); revealFace(); return; }
  if(v.kind === "start"){ root.innerHTML = viewStart(); return; }
  if(v.kind === "system"){ root.innerHTML = viewSystem(); sysMount(); return; }
  if(v.kind === "sessionDone"){ root.innerHTML = viewSessionDone(v.why); orbMount(); revealFace(); return; }
  if(v.kind === "focus"){ root.innerHTML = viewFocus(); orbMount(); startTicker(); return; }
  if(v.kind === "lunchOn"){ root.innerHTML = viewLunchActive(); orbMount(); return; }
  if(v.kind === "empty"){ root.innerHTML = viewEmpty(); orbMount(); return; }
  if(v.kind === "lunchDue"){ root.innerHTML = viewLunchDue(v.early); orbMount(); return; }
  if(v.kind === "nothing"){ root.innerHTML = viewNothing(v.choice); orbMount(); return; }
  root.innerHTML = v.kind === "transit" ? viewTransit(v.choice) : viewOne(v.choice);
  orbMount(); revealFace(); paintDayRing();
}
function todayLog(){ var d = todayKey(); return S.log.filter(function(l){ return l.date === d; }); }
/* measured minutes since you entered this world */
function sessionMinutes(){
  var from = S.session.enteredAt || 0;
  return todayLog().filter(function(l){ return l.at >= from; }).reduce(function(a,l){ return a + (l.minutes||0); }, 0);
}
/* Productivity is not serving tasks forever. When nothing left in this world is
   important, due, or overdue, ONE says so instead of quietly finding filler. */
function sessionShouldEnd(){
  var id = S.session.planet;
  if(!id || isErrandPlanet(id) || S.session.sessionDone || S.session.keepGoing) return false;
  var mine = todayLog().filter(function(l){ return l.at >= (S.session.enteredAt||0); });
  /* a real stint, not one quick job — otherwise "you're done" is just annoying */
  var worked = mine.length >= 2 || sessionMinutes() >= 25;
  var dayOver = !isErrandPlanet(id) && minsOfDay() > hhmmToMins(S.settings.workUntil) && id === "work";
  if(!worked && !dayOver) return false;
  var live = planetOpen(id).filter(function(t){ return !isResting(t) && locationOK(t); });
  if(!live.length) return false;
  /* Nothing left that matters. */
  if(!live.some(function(t){ return isDueToday(t) || t.priority === "important" || t.fixedStart || isUrgent(t); }))
    return "cleared";
  /* There is still work, but not enough day left to open any of it honestly,
     and you've already had a proper one. Starting a forty-minute job with
     twenty minutes left isn't productivity, it's a worse stopping point. */
  var w = runway();
  var room = Math.min(w.kind === "none" ? 600 : w.mins, Math.max(0, hhmmToMins(S.settings.workUntil) - minsOfDay()));
  if(room > 0 && room <= 35 && productiveToday() &&
     !live.some(function(t){ return timeLeftOn(t) <= room - 2 || t.duration <= room - 2; })) return "noRoom";
  return false;
}
function dayProgress(){
  var entries = todayLog();
  var done = entries.reduce(function(a,l){ return a + (l.minutes||0); }, 0);
  var leftCount = openTasks().filter(function(t){ return planetOf(t) !== "errands" && !isResting(t); }).length;
  var total = entries.length + leftCount;
  return { done:done, leftCount:leftCount, frac: total ? entries.length/total : 0, count:entries.length,
           checks: entries.filter(function(l){ return l.kind === "check"; }).length };
}
function paintDayRing(){
  var p = dayProgress(), el = document.getElementById("tprog");
  if(el) el.setAttribute("stroke-dashoffset", (351.9 * (1 - p.frac)).toFixed(1));
}
function viewStart(){
  var seg = segmentAt(minsOfDay());
  var here = seg && locById(seg.seg.loc) ? seg.seg.loc : S.session.location;
  return ''+
  '<div class="stack" style="gap:22px;padding:20px 0">'+
    '<div class="stack" style="gap:8px">'+
      '<p class="eyebrow left">'+esc(locLabel(here))+' · '+minsToHHMM(minsOfDay())+'</p>'+
      '<h1 class="big">Right<br>then</h1>'+
      '<p class="lede">Dump everything you\'re carrying. I\'ll work out the order, the timing and what fits where.</p>'+
    '</div>'+
    '<button class="btn go wide" id="dump-open">Brain dump</button>'+
    '<button class="btn wide" data-act="start-day">Start with what\'s already there</button>'+
    '<p class="hint">Lunch, working hours and where you\'ll be live in Setup and Day — set once, forget.</p>'+
  '</div>';
}
/* the view from outside: which part of life do you want to be in? */
function viewSystem(){
  var p = dayProgress(), hour = new Date().getHours();
  var greet = hour < 12 ? "Morning" : (hour < 18 ? "Afternoon" : "Evening");
  return '<div class="sysview">'+
    '<p class="eyebrow left">'+esc(greet)+(who() ? ", "+esc(S.profile.name) : "")+' · '+minsToHHMM(minsOfDay())+'</p>'+
    sysHTML()+
    finishLine()+
    '<p class="runway">Pick a world · the rest disappears</p>'+
  '</div>';
}
/* ---------- when you intend to finish ----------
   Your finishing time is not a setting you filled in once. It's a fact about
   today that changes, and everything downstream of it — what fits, what's
   worth opening, whether stopping is the right answer — has to move with it. */
function finishLine(){
  if(S.session.workFinished) return '<p class="finish-line">Work\'s done for today. <button class="linky" data-act="finish-time">Change</button></p>';
  var end = hhmmToMins(S.settings.workUntil), left = end - minsOfDay();
  return '<p class="finish-line">Working until <b>'+esc(S.settings.workUntil)+'</b>'+
    (left > 0 ? ' · '+fmtDur(left)+' left' : ' · that\'s been and gone')+
    ' <button class="linky" data-act="finish-time">Change</button></p>';
}
var FINISH_NUDGES = [-60, -30, -15, 15, 30, 60];
function sheetFinishTime(){
  var end = hhmmToMins(S.settings.workUntil);
  return ''+
  '<div class="sheet-head"><h2 class="sec">When are you finishing?</h2>'+
    '<button class="icon-btn" data-act="close-sheet" aria-label="Close">✕</button></div>'+
  '<p class="hint">Change this and I\'ll work out again what can sensibly fit.</p>'+
  '<div class="choices" style="margin-top:12px">'+
    FINISH_NUDGES.map(function(n){
      return '<button class="choice" data-act="finish-nudge" data-min="'+n+'">'+(n<0?"−":"+")+Math.abs(n)+'m</button>';
    }).join("")+
  '</div>'+
  '<div class="field" style="margin-top:14px"><label>Or set it</label>'+
    '<input type="time" id="ft-at" value="'+esc(minsToHHMM(((end%1440)+1440)%1440))+'"></div>'+
  '<div class="btn-row">'+
    '<button class="btn" data-act="finish-now">I\'m done for today</button>'+
    '<button class="btn go" data-act="finish-set">Set it</button>'+
  '</div>';
}
function setFinish(mins){
  var m = ((Math.round(mins) % 1440) + 1440) % 1440;
  S.settings.workUntil = minsToHHMM(m);
  S.session.workFinished = false;
  S.session.sessionDone = false; S.session.keepGoing = false;
  unpin();                       /* what was on the orb may no longer fit */
  save(); render();
  say("finishMoved", { at:S.settings.workUntil, left:Math.max(0, m - minsOfDay()) });
}
/* stopping is a result, not a failure to continue */
/* Stopping is a result, not a failure to continue. Two ways to arrive here:
   there's nothing left that matters, or there is but there isn't enough day
   left to open any of it honestly. They deserve different words. */
function viewSessionDone(why){
  var p = dayProgress(), here = planetLabel(S.session.planet);
  var mins = sessionMinutes();
  var room = why === "noRoom";
  var face = room ? '<div class="orb-task">That\'ll<br>do</div><div class="orb-sub">nothing worth opening now</div>'
                  : '<div class="orb-task">That\'s<br>the lot</div><div class="orb-sub">nothing left worth starting</div>';
  return ''+
    '<p class="eyebrow good">'+esc(here)+(room ? ' · enough for today' : ' session complete')+'</p>'+
    orbHTML(face, { clear:true, hints:{ u:"", l:"", r:"Add", d:"Leave" } })+
    '<p class="runway">'+p.count+' done · '+fmtDur(mins || p.done)+' focused</p>'+
    '<div style="margin-top:14px">'+coachHTML([line(room ? "nothingFits" : "sessionDone", {})])+'</div>'+
    finishLine()+
    '<div class="btn-row" style="margin-top:12px">'+
      '<button class="btn" data-act="keep-going">Give me another</button>'+
      '<button class="btn go" data-act="leave-planet">Leave '+esc(here)+'</button>'+
    '</div>';
}
function viewEmpty(){
  return orbHTML('<div class="orb-task">Nothing<br>in here</div><div class="orb-sub">'+esc(planetLabel(S.session.planet))+' is empty</div>', { clear:true, hints:{ u:"", l:"", r:"Add", d:"Leave" } })+
    '<p class="runway">Nothing in here. Add something or go somewhere else.</p>'+
    '<p class="dayline">Swipe right to add · swipe down to leave</p>';
}
function viewNothing(choice){
  var here = planetLabel(S.session.planet);
  if(choice.reason === "nofit"){
    return orbHTML('<div class="orb-task">Too<br>tight</div><div class="orb-sub">'+fmtDur(choice.gap.mins)+' left</div>', { clear:true })+
      '<p class="runway">Nothing fits before '+esc(choice.gap.what)+'</p>'+
      '<p class="dayline">'+esc(line("nothingFits", {}))+'</p>';
  }
  var msg = isErrandPlanet(S.session.planet)
    ? "Nothing to pick up. Straight home."
    : here+" is clear. Genuinely nothing left in here.";
  return orbHTML('<div class="orb-task">All<br>clear</div><div class="orb-sub">'+esc(here)+'</div>', { clear:true, hints:{ u:"", l:"", r:"Add", d:"Leave" } })+
    '<p class="runway">'+esc(msg)+'</p>'+
    '<p class="dayline">Swipe down to leave · swipe right to add</p>';
}
/* A flag planted on the moon for anything with a clock on it: red if it's late,
   orange if it's today, gold if you said it matters. */
function flagFor(t){
  if(!t) return null;
  if(isOverdue(t)) return { kind:"late", label:"Overdue" };
  if(isDueToday(t)) return { kind:"today", label:"Due today" };
  if(t.priority === "important") return { kind:"imp", label:"Important" };
  return null;
}
/* one line saying why this and not something else — the orb showing its working */
function whyLine(choice){
  var t = choice.task;
  var w = (choice.why || []).filter(Boolean);
  if(w.length) return w[0];
  if(choice.fixed) return "It's in the diary. That's why.";
  if(isRecurring(t)) return "Due another look.";
  if(t.effort === "easy") return "Small one. Get it off the pile.";
  if(t.duration >= 45) return "You've got the room for it right now.";
  return "Nothing else is more use to you this minute.";
}
function viewOne(choice){
  var t = choice.task, p = dayProgress(), w = runway();
  var early = !!choice.early;                       /* the diary task, offered ahead of time */
  var prep = !!choice.prep;                         /* the run-up to a commitment */
  var fixedNow = choice.fixed && !early && !prep;
  var spentAlready = isRecurring(t) ? 0 : Math.round(t.actualMinutes || 0);
  var sub = prep ? "starts "+t.fixedStart+" · get ready"
          : early ? t.fixedStart+" · "+t.duration+" min"
          : fixedNow ? "until "+minsToHHMM(taskEndMins(t))
          : (isRecurring(t) ? t.duration+" min · "+repeatLabel(t.repeatEvery)
          : (spentAlready > 0
              ? (timeLeftOn(t) > 0 ? timeLeftOn(t)+" min left · "+fmtDur(spentAlready)+" in"
                                   : "over · "+fmtDur(spentAlready)+" in")
              : t.duration+(t.estimated ? "ish min" : " min")+" · "+t.type));
  var note = prep
    ? "Starts at "+t.fixedStart+" · this is your "+prepOf(t)+" minutes to get ready"
    : early
    ? (choice.startsIn > 0 ? "Starts in "+fmtDur(choice.startsIn)+" · tap to start it now" : "Tap to start")
    : fixedNow
    ? "You're in this until "+minsToHHMM(taskEndMins(t))
    : (w.kind === "none" ? "Nothing in the way" : fmtDur(w.mins)+" until "+w.what);
  return ''+
    '<p class="eyebrow'+((fixedNow||prep)?" hot":"")+'">'+esc(planetLabel(S.session.planet))+
      (prep ? " · getting ready" : early ? " · up next" : fixedNow ? " · happening now"
        : choice.urgent ? " · do next" : (isRecurring(t) ? " · check-in" : ""))+'</p>'+
    orbHTML(faceTask(t, sub), { flag:flagFor(t) })+
    '<p class="why"><b>Why this?</b> '+esc(whyLine(choice))+'</p>'+
    '<p class="runway">'+esc(note)+'</p>'+
    '<p class="dayline">'+p.count+' done · '+fmtDur(p.done)+' on the clock</p>'+
    finishLine();
}
function viewTransit(choice){
  var t = choice.task, p = dayProgress(), rest = (choice.rest||[]).slice(0,4);
  return ''+
    '<p class="eyebrow cool">Errand run</p>'+
    orbHTML(faceTask(t, t.type), { flag:flagFor(t), hints:{ u:"Got it", l:"Skip", r:"Add", d:"Leave" } })+
    '<p class="runway">'+(rest.length ? (rest.length+1)+" to pick up" : "Last one")+'</p>'+
    (rest.length ? '<div class="pickup" style="margin-top:12px">'+rest.map(function(x){
      return '<button class="pick" data-act="tick" data-id="'+x.id+'"><span class="tick">✓</span>'+esc(x.name)+'</button>';
    }).join("")+'</div>' : '')+
    '<p class="dayline">'+p.count+' done today</p>';
}
function viewFocus(){
  var f = S.focus, t = byId(f.taskId);
  if(!t){ S.focus = null; save(); return viewEmpty(); }
  var total = (f.plannedMin + f.addedMin)*60;
  var inner = '<div class="orb-clock" id="clock">'+mmss(total)+'</div>'+
              '<div class="orb-sub" id="clocksub">'+(f.paused?"Paused":esc(t.name))+'</div>';

  if(isCommitted(t)){
    var added = t.commit.added.reduce(function(a,m){ return a+m; }, 0);

function orbTap(){

    var f = S.focus;

    else { f.paused = true; f.pausedAt = Date.now(); }

  }
  if(!s.planet) return;
  if(!isErrandPlanet(s.planet) && s.lunchState === "active"){
    S.session.lunchState = "done"; save(); renderNow(true); toast("Right. Back to it."); return;
  }

    S.session.lunchState = "active";
    S.session.lunchEndsAt = Date.now() + S.settings.lunchDuration*60000;
    save(); renderNow(true); return;

var ticker = null;
function startTicker(){ stopTicker(); tick(); ticker = setInterval(tick, 500); }
function stopTicker(){ if(ticker){ clearInterval(ticker); ticker = null; } }
function tick(){
  var f = S.focus;
  if(!f) return stopTicker();
  var clock = document.getElementById("clock");
  if(!clock) return;
  var total = (f.plannedMin + f.addedMin)*60;
  var elapsed = f.paused ? (f.pausedAt - f.startedAt)/1000 : (Date.now() - f.startedAt)/1000;
  var left = total - elapsed;
  clock.textContent = mmss(left);
  var prog = document.getElementById("tprog"), ring = document.getElementById("orbRing");
  if(prog){
    var frac = Math.max(0, Math.min(1, elapsed/total));
    prog.setAttribute("stroke-dashoffset", (351.9*(1-frac)).toFixed(1));
    if(ring) ring.classList.toggle("over", left < 0);
  }
  var rl = document.getElementById("runwayLine");
  if(rl && !isCommitted(byId(f.taskId))){
    var w = runway();
    rl.textContent = f.paused ? "Paused" : (w.kind==="none" ? "" : fmtDur(w.mins)+" until "+w.what);
  }
  if(left <= 0 && !f.rang && !f.paused){
    f.rang = true; save(); stopTicker(); chime();
    if(f.makingSafe){
      var mt = byId(f.taskId), mm = endFocus();
      if(mt){
        mt.actualMinutes = (mt.actualMinutes||0) + mm;
        recordRun(mt, "rabbit");
        mt.commit = null; mt.safeStopped = true; mt.lastPostponedAt = Date.now();
      }
      unpin(); save(); renderNow(true);
      toast("Down tools. That's enough of that one.");
      return;
    }
    openSheet(committedTask() ? sheetCommitCheck() : sheetTimeUp());
  }
}
/* Minutes already spent on a task belong to that task. Come back to something
   you parked and the clock carries on from where you left it, rather than
   handing you the full estimate all over again. Check-ins are the exception:
   every cycle is its own fresh session. */
function timeLeftOn(t){
  if(isRecurring(t)) return t.duration;
  var spent = Math.round(t.actualMinutes || 0);
  if(spent <= 0) return t.duration;
  return t.duration - spent;
}
function beginFocus(t, forcedMins){
  if(!t.originalEstimate) t.originalEstimate = t.duration;
  t.wakeAt = null; t.woke = false;   /* you're looking at it now — the check-in has done its job */
  t.urgent = false;                  /* it got to the front. It doesn't need to keep saying so */
  var spent = isRecurring(t) ? 0 : Math.round(t.actualMinutes || 0);
  var left = timeLeftOn(t);
  var planned = forcedMins || (spent > 0 ? Math.max(5, left) : t.duration);
  S.focus = { taskId:t.id, startedAt:Date.now(), plannedMin:planned, addedMin:0, extensions:0,
              paused:false, pausedAt:null, rang:false, resumedFrom: spent > 0 ? spent : 0 };
  save(); renderNow(true);
  if(spent > 0 && !forcedMins) say("start", { task:t, resumed:true, spent:spent, left:left, mins:planned });
  else say("start", { task:t, mins:planned });
}
function endFocus(){
  var f = S.focus; if(!f) return 0;
  var mins = Math.round(((f.paused? f.pausedAt : Date.now()) - f.startedAt)/60000);
  S.focus = null; stopTicker();
  return Math.max(1, mins);
}
function finishFocus(){
  var t = byId(S.focus && S.focus.taskId), mins = endFocus();
  if(t){ recordRun(t, "finished", mins); t.commit = null; }
  if(t) settleTask(t, mins);
  closeSheet(); save(); renderNow(true);
}
function abandonFocus(block){
  var t = byId(S.focus && S.focus.taskId), mins = endFocus();
  if(t){
    t.actualMinutes = (t.actualMinutes||0) + mins;
    if(block){ save(); closeSheet(); renderNow(true); openSheet(sheetBlocked(t.id)); return; }
    t.postponedToday++; t.lastPostponedAt = Date.now();
  }
  save(); closeSheet(); renderNow(true); toast("Fine. Something else then.");
}

function bindSlider(id, steps, onChange){
  var el = document.getElementById(id);
  if(!el) return;
  var orb = document.getElementById(id+"-orb"), fill = document.getElementById(id+"-fill"), labels = document.getElementById(id+"-labels");
  var n = steps.length;
  function place(idx){
    var pct = n>1 ? idx/(n-1) : 0;
    orb.style.left = "calc(14px + (100% - 28px) * "+pct+")";
    fill.style.width = "calc((100% - 28px) * "+pct+")";
    el.dataset.idx = idx; el.setAttribute("aria-valuenow", idx);
    [].slice.call(labels.children).forEach(function(c,i){ c.classList.toggle("on", i === idx); });
  }
  place(+el.dataset.idx);
  el._setIndex = place;
  function idxFromX(clientX){
    var r = el.getBoundingClientRect();
    var pct = Math.max(0, Math.min(1, (clientX - r.left - 14) / Math.max(1, r.width - 28)));
    return Math.round(pct * (n-1));
  }
  function commit(idx){
    var changed = +el.dataset.idx !== idx;
    place(idx);
    if(changed) onChange(steps[idx].value, idx);
  }

     handed straight back; a tap can only nudge one step, so brushing the bar
     on the way past never flings the value to the end. */
  var live = false, moved = false, sx = 0, sy = 0, downAt = 0;
  el.addEventListener("pointerdown", function(e){
    live = true; moved = false; sx = e.clientX; sy = e.clientY; downAt = performance.now();
    try{ el.focus({ preventScroll:true }); }catch(err){}
  });
  el.addEventListener("pointermove", function(e){
    if(!live) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if(!moved){
      if(Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 8){ live = false; return; }  /* you're scrolling */
      if(Math.abs(dx) < 7) return;
      moved = true;
      el.classList.add("grabbing");
      try{ el.setPointerCapture(e.pointerId); }catch(err){}
    }
    e.preventDefault();
    commit(idxFromX(e.clientX));
  });
  el.addEventListener("pointerup", function(e){
    if(!live){ el.classList.remove("grabbing"); return; }
    live = false; el.classList.remove("grabbing");
    if(moved) return;
    if(performance.now() - downAt > 450) return;
    var i = +el.dataset.idx, want = idxFromX(e.clientX);
    if(Math.abs(want - i) <= 1) commit(want);      /* a tap nudges, a drag jumps */
  });
  el.addEventListener("pointercancel", function(){ live = false; moved = false; el.classList.remove("grabbing"); });
  el.addEventListener("keydown", function(e){
    var i = +el.dataset.idx;
    if(e.key === "ArrowRight" || e.key === "ArrowUp"){ e.preventDefault(); commit(Math.min(n-1, i+1)); }
    if(e.key === "ArrowLeft" || e.key === "ArrowDown"){ e.preventDefault(); commit(Math.max(0, i-1)); }
  });
}

var PREP_CHOICES = [0, 5, 10, 15, 30];

/* Turn a spoken sentence into a task. Anything it recognises is stripped out
   of the name, so "reply to Dave at work, 10 minutes, important" leaves
   "Reply to Dave". Everything it sets is shown in the sheet before you save. */
var NUM_WORDS = { one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,
  eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,
  nineteen:19,twenty:20,thirty:30,forty:40,fifty:50,sixty:60,ninety:90 };
function wordNumbers(t){
  t = t.replace(/\b(twenty|thirty|forty|fifty)[\s-](one|two|three|four|five|six|seven|eight|nine)\b/gi,
      function(_,a,b){ return (NUM_WORDS[a.toLowerCase()]||0) + (NUM_WORDS[b.toLowerCase()]||0); });
  t = t.replace(/\b([a-z]+)\s+(minutes?|mins?|min|hours?|hrs?)\b/gi,
      function(all,w,u){ var n = NUM_WORDS[w.toLowerCase()]; return n ? n+" "+u : all; });
  t = t.replace(/\b(at|from)\s+([a-z]+)\b/gi,
      function(all,pre,w){ var n = NUM_WORDS[w.toLowerCase()]; return (n && n <= 12) ? pre+" "+n : all; });
  return t;
}
function parseSpoken(raw){
  var text = " " + wordNumbers(String(raw||"").trim()) + " ";
  var d = {}, said = [], m;
  function eat(re){ var mm = text.match(re); if(mm){ text = text.replace(mm[0], " "); return mm; } return null; }

  /* repeats before durations - "every 30 minutes" contains a duration */
  if((m = eat(/\bevery\s+(\d{1,3})\s*(minutes?|mins?|m)\b/i))) d.repeatEvery = +m[1];
  else if((m = eat(/\bevery\s+(\d{1,2})\s*(hours?|hrs?|h)\b/i))) d.repeatEvery = (+m[1])*60;
  else if(eat(/\bevery\s+half\s*(an\s*)?hour\b/i)) d.repeatEvery = 30;
  else if(eat(/\bevery\s+hour\b/i)) d.repeatEvery = 60;
  if(d.repeatEvery){ said.push(repeatLabel(d.repeatEvery)); d.effort = "easy"; }

  /* a fixed time */
  if((m = eat(/\b(?:at|from)\s+(\d{1,2})(?:[:.](\d{2}))?\s*(am|pm|a\.m\.|p\.m\.)?(?=\s|$)/i))){
    var hh = +m[1], mm2 = m[2] ? +m[2] : 0, ap = (m[3]||"").toLowerCase();
    if(/^p/.test(ap) && hh < 12) hh += 12;
    if(/^a/.test(ap) && hh === 12) hh = 0;
    if(!ap && hh >= 1 && hh <= 7) hh += 12;        /* "at 3" means this afternoon */
    if(hh < 24 && mm2 < 60){

  var LEAD = "(?:for\\s+|about\\s+|around\\s+|roughly\\s+|lasting\\s+|takes\\s+)?";
  if((m = eat(new RegExp("\\b"+LEAD+"(\\d{1,3})\\s*(?:minutes?|mins?|min)\\b","i")))) d.duration = +m[1];
  else if((m = eat(new RegExp("\\b"+LEAD+"(\\d{1,2})\\s*(?:hours?|hrs?)\\b","i")))) d.duration = (+m[1])*60;
  else if(eat(new RegExp("\\b"+LEAD+"(?:an?\\s+)?hour\\s+and\\s+a\\s+half\\b","i"))) d.duration = 90;
  else if(eat(new RegExp("\\b"+LEAD+"half\\s+an\\s+hour\\b","i"))) d.duration = 30;
  else if(eat(new RegExp("\\b"+LEAD+"quarter\\s+of\\s+an\\s+hour\\b","i"))) d.duration = 15;
  else if(eat(new RegExp("\\b"+LEAD+"(?:an|one)\\s+hour\\b","i"))) d.duration = 60;

  /* how much it matters */
  if(eat(/\b(must do today|must be done today|urgent|urgently|top priority|first thing|asap)\b/i)) d.priority = "must";
  else if(eat(/\bimportant\b/i)) d.priority = "important";
  else if(eat(/\b(optional|if i (get|have) (the )?time|nice to have|whenever|no rush)\b/i)) d.priority = "optional";
  if(d.priority && !d.timed) said.push(PRIORITY[d.priority]);

  /* how heavy */
  if(eat(/\b(deep work|proper(ly)? focus|head down|concentrate|focus session)\b/i)) d.effort = "deep";
  else if(eat(/\b(quick|quickly|easy|small|two minute|five minute)\b/i)) d.effort = "easy";

  /* where. "On the way home" is a journey, so transit phrases are read before
     location names — otherwise the word "home" hijacks it. */
  var here = null;
  var transit = null;
  var TRANSIT_PHRASE = /\b(?:(?:on|in)\s+(?:the|my)\s+way(?:\s+(?:home|back|in|out|there|to\s+\w+))?|while\s+i'?m\s+out|when\s+i'?m\s+out|out\s+and\s+about|in\s+town|at\s+the\s+shops?|on\s+the\s+road)\b/i;
  if(transit && TRANSIT_PHRASE.test(text)){ here = transit; text = text.replace(TRANSIT_PHRASE, " "); }
  if(!here) S.locations.forEach(function(l){
    if(here) return;
    var words = l.label.replace(/&/g," ").split(/\s+/).filter(function(w){ return w.length > 2; });
    var re = new RegExp("\\b(?:at|in|from|when i'?m at|while i'?m at)?\\s*"+
                        words.map(function(w){ return w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }).join("\\s+(?:and\\s+)?")+"\\b","i");
    if(re.test(text)){ here = l.id; text = text.replace(re, " "); }
  });
  if(!here && transit && ERRANDY.test(text)) here = transit;
  if(!here && HOUSEHOLD.test(text)) here = locById("home") ? "home" : (places()[0]||{}).id;
  if(here){
    d.locations = [here];
    said.push(locLabel(here));

  }
  if(!d.category && (HOUSEHOLD.test(text) || /\b(personal|for me|my own)\b/i.test(text))) d.category = "Personal";

  /* what's left is the name */
  var name = text.replace(/\b(add (a )?task|add|remind me to|remember to|i need to|i've got to|i have to|note to self|please|task)\b/ig," ")
                 .replace(/[\s,;.]+/g," ")
                 .replace(/^[\s,;.-]+|[\s,;.-]+$/g,"")

  d._said = said;
  return d;
}

  var r = new SR(), finalText = "";
  r.lang = (navigator.language && /^en/i.test(navigator.language)) ? navigator.language : "en-GB";
  r.interimResults = true; r.continuous = false; r.maxAlternatives = 1;
  r.onresult = function(e){
    var interim = "";
    for(var i = e.resultIndex; i < e.results.length; i++){
      if(e.results[i].isFinal) finalText += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    onInterim(finalText + interim);
  };
  r.onerror = function(e){
    var msg = { "not-allowed":"Microphone blocked. Allow it for this site — inside a preview frame it can't ask.",
                "service-not-allowed":"Microphone blocked. Open ONE from its own web address and allow the mic.",
                "no-speech":"Didn't catch that.",
                "audio-capture":"No microphone found.",
                "network":"Speech needs a connection." }[e.error] || "Couldn't listen just then.";
    toast(msg);
  };
  r.onend = function(){
    rec = null;
    if(recBtn){ recBtn.classList.remove("on"); recBtn = null; }
    if(finalText.trim()) onFinal(finalText.trim());
  };
  try{ r.start(); rec = r; recBtn = btn; btn.classList.add("on"); }
  catch(err){ toast("Couldn't start listening."); }
}

/* ============================================================
   QUICK CAPTURE
   Capture it. Forget it. Carry on with what you were doing.
   One field is required: what needs doing. Everything else is
   guessed from the words, inherited from the world you're in,
   or corrected later — never asked for up front.
   ============================================================ */
var cap = null;
function newCapture(){
  return { text:"", duration:null, priority:null, due:null, when:null,
           fixedStart:null, repeatEvery:null, planet:null, unblocks:null, open:null,
           urgent:null, type:null, after:null, note:null };
}

/* ---------- reading the sentence ---------- */
var WEEKDAYS = ["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
function nextWeekday(idx){
  var d = new Date(), delta = (idx - d.getDay() + 7) % 7;
  d.setDate(d.getDate() + (delta === 0 ? 7 : delta));
  return todayKey(d);
}
/* Everything it recognises is lifted out of the name, so "Call Harrogate today
   20m" leaves "Call Harrogate" and three pieces of metadata you never typed. */
function parseCapture(raw){
  var text = " " + wordNumbers(String(raw||"").trim()) + " ", d = {}, said = [], m;
  function eat(re){ var mm = text.match(re); if(mm){ text = text.replace(mm[0], " "); return mm; } return null; }

  if((m = eat(/\bevery\s+(\d{1,3})\s*(?:minutes?|mins?|m)\b/i))) d.repeatEvery = +m[1];
  else if((m = eat(/\bevery\s+(\d{1,2})\s*(?:hours?|hrs?|h)\b/i))) d.repeatEvery = (+m[1])*60;
  else if(eat(/\bevery\s+half\s*(?:an\s*)?hour\b/i)) d.repeatEvery = 30;
  else if(eat(/\bevery\s+hour\b/i)) d.repeatEvery = 60;
  if(d.repeatEvery) said.push(repeatLabel(d.repeatEvery));

  /* Urgency and importance are different claims. "Important" says this matters;
     "urgent" says do it next. Something can be either, or both. */
  if(eat(/\b(urgent(?:ly)?|asap|a\.s\.a\.p\.|do next|next task|top priority|right now|straight ?away)\b/i)){
    d.urgent = true; said.push("Do next");
  }
  if(eat(/(^|\s)!\s*/) || eat(/\b(important|must do|big one|matters)\b/i)){
    d.priority = "important"; said.push("Important");
  }

  if(eat(/\btomorrow\b/i)){ d.due = dateFromToday(1); said.push("Tomorrow"); }
  else if(eat(/\btoday\b/i) || eat(/\bby\s+(?:the\s+)?end\s+of\s+(?:the\s+)?day\b/i)){ d.due = todayKey(); said.push("Today"); }
  else if((m = eat(/\b(?:on\s+|next\s+)?(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/i))){
    d.due = nextWeekday(WEEKDAYS.indexOf(m[1].toLowerCase())); said.push(dueLabelFor(d.due));
  }

  if((m = eat(/\b(?:at\s+)?(\d{1,2})(?:[:.](\d{2}))?\s*(am|pm)\b/i)) ||
     (m = eat(/\bat\s+(\d{1,2})[:.](\d{2})\b/i))){
    var hh = +m[1], mm2 = m[2] ? +m[2] : 0, ap = (m[3]||"").toLowerCase();
    if(/^p/.test(ap) && hh < 12) hh += 12;
    if(/^a/.test(ap) && hh === 12) hh = 0;
    if(!ap && hh >= 1 && hh <= 7) hh += 12;
    if(hh < 24 && mm2 < 60){
      d.fixedStart = pad(hh)+":"+pad(mm2);
      if(!d.due) d.due = todayKey();
      said.push("at "+d.fixedStart);
    }
  }

  var LEAD = "(?:for\\s+|about\\s+|around\\s+|roughly\\s+|takes\\s+)?";
  if((m = eat(new RegExp("\\b"+LEAD+"(\\d{1,3})\\s*(?:minutes?|mins?|min|m)\\b","i")))) d.duration = +m[1];
  else if((m = eat(new RegExp("\\b"+LEAD+"(\\d{1,2})\\s*(?:hours?|hrs?|h)\\b","i")))) d.duration = (+m[1])*60;
  else if(eat(new RegExp("\\b"+LEAD+"an?\\s+hour\\s+and\\s+a\\s+half\\b","i"))) d.duration = 90;
  else if(eat(new RegExp("\\b"+LEAD+"half\\s+an\\s+hour\\b","i"))) d.duration = 30;
  else if(eat(new RegExp("\\b"+LEAD+"an?\\s+hour\\b","i"))) d.duration = 60;
  if(d.duration) said.push(d.duration+" min");

  var name = text.replace(/\b(add (a )?task|remind me to|remember to|i need to|i've got to|note to self|please)\b/ig," ")
                 .replace(/[\s,;.]+/g," ").replace(/^[\s,;.-]+|[\s,;.-]+$/g,"").trim();
  if(name) d.name = name.charAt(0).toUpperCase() + name.slice(1);
  d._said = said;
  return d;
}
function dueLabelFor(key){ return dueLabel({ due:key }); }

/* ---------- guessing the rest ---------- */
var GUESS_MINS = [
  [/\b(bin|bins|rubbish|recycling|kettle|two minute|quick)\b/i, 5],
  [/\b(email|e-?mail|reply|ring|call|text|message|book|order|invoice|chase)\b/i, 10],
  [/\b(tidy|hoover|vacuum|washing|dishes|shop|shopping|petrol|post|collect|pick up)\b/i, 15],
  [/\b(write|draft|review|read|plan|sort|update|prep)\b/i, 30],
  [/\b(meeting|call with|catch ?up|1:1|one to one)\b/i, 60],
  [/\b(design|build|develop|create|make|install|fit|fix|paint|decorate|research)\b/i, 60]
];
function estimateMinutes(name){
  for(var i=0;i<GUESS_MINS.length;i++) if(GUESS_MINS[i][0].test(name)) return GUESS_MINS[i][1];
  return S.settings.defaultDuration;
}
var WORKY = /\b(invoice|payroll|supplier|client|customer|quote|order|spreadsheet|report|meeting|portal|signage|staff|rota|vat|tax|accounts|email|contract|tender|site|survey|drawing|quote)\b/i;
var PROJECTY = /\b(app|website|hobby|blog|game|prototype|side project|guitar|photos?|model|develop one)\b/i;
function inferPlanet(name){
  if(ERRANDY.test(name)) return "errands";
  if(PROJECTY.test(name)) return "projects";
  if(HOUSEHOLD.test(name)) return "home";
  if(WORKY.test(name)) return "work";
  return null;
}
function guessEffort(mins, repeat){
  if(repeat) return "easy";
  return mins <= 10 ? "easy" : (mins >= 60 ? "deep" : "normal");
}
function guessType(name, planet, timed){
  if(timed) return "Meeting";
  if(planet === "errands") return "Errand";
  if(/\b(email|e-?mail|reply|inbox)\b/i.test(name)) return "Email";
  if(/\b(ring|call|phone|chase)\b/i.test(name)) return "Admin";
  if(HOUSEHOLD.test(name) || /\b(fix|fit|install|paint|carry|move|clean|hang)\b/i.test(name)) return "Physical";
  if(/\b(plan|schedule|organise|prep)\b/i.test(name)) return "Planning";
  if(/\b(design|draft|write|draw|create)\b/i.test(name)) return "Creative";
  if(planet === "projects") return "Personal Project";
  return "Admin";
}

/* ---------- the sheet ---------- */
function openCapture(prefill){
  cap = newCapture();
  if(prefill) for(var k in prefill) cap[k] = prefill[k];
  openSheet(sheetCapture(), bindCapture, "capture");
}
function capWhenLabel(){
  if(cap.fixedStart) return cap.fixedStart;
  if(!cap.due) return "When";
  return dueLabelFor(cap.due);
}
function sheetCapture(){
  var mins = cap.duration || S.settings.defaultDuration;
  return ''+
  '<div class="sheet-head"><h2 class="sec">Quick capture</h2><button class="icon-btn" data-act="close-sheet" aria-label="Close">✕</button></div>'+
  '<div class="field"><label for="qc-name">What needs doing?</label>'+
    '<div class="inline"><input type="text" id="qc-name" placeholder="Email Dionne about Crystal" value="'+esc(cap.text)+'" autocomplete="off" enterkeyhint="done">'+
    (micSupported() ? '<button class="mic" id="qc-mic" type="button" aria-label="Say it">'+MIC_SVG+'</button>' : '')+'</div>'+
  '</div>'+
  '<div class="qc-chips">'+
    '<button class="qc-chip" id="qc-time" type="button" aria-pressed="'+(cap.duration?"true":"false")+'">'+(cap.duration ? cap.duration+"m" : "Time")+'</button>'+
    '<button class="qc-chip" id="qc-imp" type="button" aria-pressed="'+(cap.priority==="important")+'">Important</button>'+
    '<button class="qc-chip" id="qc-urg" type="button" aria-pressed="'+(!!cap.urgent)+'">Do next</button>'+
    '<button class="qc-chip" id="qc-when" type="button" aria-pressed="'+(cap.due?"true":"false")+'">'+esc(capWhenLabel())+'</button>'+
    '<button class="qc-chip ghost" id="qc-more" type="button">•••&nbsp;More</button>'+
  '</div>'+
  '<div id="qc-time-row" class="qc-drawer" hidden><div class="stepper">'+
    '<button class="step" data-qcdur="-15">−15</button><button class="step" data-qcdur="-5">−5</button>'+
    '<div class="val" id="qc-dur">'+mins+'<small>minutes</small></div>'+
    '<button class="step" data-qcdur="5">+5</button><button class="step" data-qcdur="15">+15</button>'+
  '</div><p class="hint">Leave it alone and I\'ll guess from the words.</p></div>'+
  '<div id="qc-when-row" class="qc-drawer" hidden><div class="choices">'+
    WHEN_CHOICES.map(function(w){
      return '<button class="choice" data-qcwhen="'+w.v+'" aria-pressed="false">'+w.l+'</button>';
    }).join("")+
    '</div>'+
    '<div class="inline" id="qc-date-row" style="display:none;margin-top:8px">'+
      '<input type="date" id="qc-date" value="'+esc(cap.due||todayKey())+'">'+
      '<input type="time" id="qc-time-at" value="'+esc(cap.fixedStart||"")+'">'+
    '</div><p class="hint">A time turns it into something in the diary.</p></div>'+
  '<p class="hint heard" id="qc-heard"></p>'+
  '<button class="btn go wide" id="qc-add">Add</button>';
}
function bindCapture(){
  var root = document.getElementById("sheetRoot");
  var name = root.querySelector("#qc-name"), heard = root.querySelector("#qc-heard");
  if(name){
    name.focus();
    name.addEventListener("input", function(){ cap.text = name.value; });
    name.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); commitCapture(); } });
  }
  var mic = root.querySelector("#qc-mic");
  if(mic) mic.addEventListener("click", function(){
    heard.textContent = "Listening…";
    dictate(mic, function(txt){ name.value = txt; },
      function(txt){ name.value = txt; cap.text = txt; heard.textContent = ""; });
  });
  var timeRow = root.querySelector("#qc-time-row"), whenRow = root.querySelector("#qc-when-row");
  root.querySelector("#qc-time").addEventListener("click", function(){
    timeRow.hidden = !timeRow.hidden;
    if(!timeRow.hidden && !cap.duration){ cap.duration = S.settings.defaultDuration; syncCapChips(); }
  });
  root.querySelector("#qc-when").addEventListener("click", function(){ whenRow.hidden = !whenRow.hidden; });
  root.querySelector("#qc-imp").addEventListener("click", function(){
    cap.priority = cap.priority === "important" ? null : "important";
    syncCapChips();
  });
  root.querySelector("#qc-urg").addEventListener("click", function(){
    cap.urgent = !cap.urgent;
    syncCapChips();
  });
  root.querySelectorAll("[data-qcdur]").forEach(function(b){
    b.addEventListener("click", function(){
      cap.duration = Math.max(5, Math.min(480, (cap.duration || S.settings.defaultDuration) + (+b.dataset.qcdur)));
      root.querySelector("#qc-dur").innerHTML = cap.duration+"<small>minutes</small>";
      syncCapChips();
    });
  });
  root.querySelectorAll("[data-qcwhen]").forEach(function(b){
    b.addEventListener("click", function(){
      var v = b.dataset.qcwhen, dateRow = root.querySelector("#qc-date-row");
      if(v === "none"){ cap.due = null; cap.fixedStart = null; dateRow.style.display = "none"; }
      else if(v === "today"){ cap.due = todayKey(); dateRow.style.display = "none"; }
      else if(v === "tomorrow"){ cap.due = dateFromToday(1); dateRow.style.display = "none"; }
      else { cap.due = cap.due || todayKey(); dateRow.style.display = ""; }
      root.querySelectorAll("[data-qcwhen]").forEach(function(x){ x.setAttribute("aria-pressed", String(x === b)); });
      syncCapChips();
    });
  });
  var dt = root.querySelector("#qc-date"), tm = root.querySelector("#qc-time-at");
  if(dt) dt.addEventListener("change", function(){ cap.due = dt.value || null; syncCapChips(); });
  if(tm) tm.addEventListener("change", function(){ cap.fixedStart = tm.value || null; if(tm.value && !cap.due) cap.due = todayKey(); syncCapChips(); });
  root.querySelector("#qc-more").addEventListener("click", function(){ commitCapture(true); });
  root.querySelector("#qc-add").addEventListener("click", function(){ commitCapture(); });
}
function syncCapChips(){
  var root = document.getElementById("sheetRoot");
  if(!root) return;
  var t = root.querySelector("#qc-time"), i = root.querySelector("#qc-imp"), w = root.querySelector("#qc-when");
  var u = root.querySelector("#qc-urg");
  if(t){ t.textContent = cap.duration ? cap.duration+"m" : "Time"; t.setAttribute("aria-pressed", String(!!cap.duration)); }
  if(i) i.setAttribute("aria-pressed", String(cap.priority === "important"));
  if(u) u.setAttribute("aria-pressed", String(!!cap.urgent));
  if(w){ w.textContent = capWhenLabel(); w.setAttribute("aria-pressed", String(!!cap.due)); }
}
/* everything the sentence didn't say, worked out rather than asked */
function buildCaptured(raw){
  var parsed = parseCapture(raw);
  var nm = (parsed.name || raw || "").trim();
  if(!nm) return null;
  var planet = cap.planet || S.session.planet || inferPlanet(nm);
  var sure = !!(cap.planet || S.session.planet || inferPlanet(nm));
  if(!planet) planet = "work";
  var repeat = cap.repeatEvery != null ? cap.repeatEvery : (parsed.repeatEvery || 0);
  var explicitMins = cap.duration || parsed.duration || null;
  var mins = explicitMins || estimateMinutes(nm);
  var fixedStart = cap.fixedStart || parsed.fixedStart || null;
  var due = cap.due || parsed.due || null;
  var pri = cap.priority || parsed.priority || "normal";
  var t = makeTask({
    name:nm, planet:planet, priority:pri, due:due,
    duration:mins, estimated:!explicitMins,
    effort: guessEffort(mins, repeat),
    type: cap.type || guessType(nm, planet, !!fixedStart),
    repeatEvery: fixedStart ? 0 : repeat,
    urgent: cap.urgent != null ? cap.urgent : !!parsed.urgent,
    unblocks: cap.unblocks || null,
    fixedStart: fixedStart,
    fixedEnd: fixedStart ? minsToHHMM(hhmmToMins(fixedStart) + mins) : null
  });
  return { task:t, sure:sure, said:parsed._said || [] };
}
function commitCapture(thenEdit){
  var root = document.getElementById("sheetRoot");
  var raw = ((root && root.querySelector("#qc-name") ? root.querySelector("#qc-name").value : cap.text) || "").trim();
  if(!raw){ toast("Give it a name first."); return; }
  var built = buildCaptured(raw);
  if(!built){ toast("Give it a name first."); return; }
  var t = built.task;
  var after = cap.after, note = cap.note;
  S.tasks.push(t);
  if(!S.session.started){ S.session.started = true; S.session.date = todayKey(); }
  cap = newCapture();
  save(); closeSheet();
  /* the current task keeps the screen — capture never moves you */
  renderChips(); renderList(); renderPlan();
  if(S.ui.tab === "now" && !S.focus) renderNow(true);
  if(S.session.planet === t.planet && !reduceMotion()){
    var nm = document.createElement("span");
    nm.className = "newmoon";
    document.body.appendChild(nm);
    setTimeout(function(){ nm.remove(); }, 1000);
  }
  if(thenEdit){ openEditSheet(t.id); return; }
  if(after === "snooze"){
    var dd = new Date(); dd = new Date(dd.getFullYear(), dd.getMonth(), dd.getDate()+1, 9, 0, 0, 0);
    t.wakeAt = dd.getTime(); save(); render();
    toast(note || ("Filed for tomorrow morning. "+t.name+"."));
    return;
  }
  if(!built.sure && !S.session.planet){ openSheet(sheetWhichPlanet(t.id)); return; }
  if(note){ toast(note); return; }
  say("added", { task:t, urgent:t.urgent, mins:t.duration, where:planetLabel(t.planet) },
      function(){ openEditSheet(t.id); }, "edit");
}
/* the one extra tap, only when ONE genuinely can't tell */
function sheetWhichPlanet(id){
  var t = byId(id);
  return ''+
  '<div class="sheet-head"><h2 class="sec">Where does this belong?</h2><button class="icon-btn" data-act="close-sheet" aria-label="Leave it in Work">✕</button></div>'+
  '<h1 class="big" style="font-size:clamp(1.4rem,6vw,1.9rem)">'+esc(t ? t.name : "")+'</h1>'+
  '<div class="choices" style="margin-top:12px">'+
    S.planets.map(function(p){
      return '<button class="choice grow" data-act="setplanet" data-setplanet="'+esc(p.id)+'" data-id="'+esc(id)+'">'+esc(p.label)+'</button>';
    }).join("")+
  '</div>';
}

/* One box per world. Which part of life a job belongs to is the thing you never
   have to think about, so the box answers it and the capture stays a sentence. */
var BD_PLACEHOLDER = {
  work:     "Do the pay run 45m&#10;Sales meeting @11:00 60m&#10;Check emails every 1h",
  home:     "Empty the bin&#10;Fix the shelf&#10;Ring the plumber",
  errands:  "Petrol&#10;Milk and bread&#10;Post the parcel",
  projects: "Sort the photos&#10;Finish the app"
};
function bdBoxes(){
  return S.planets.map(function(p){
    return { id:p.id, label:p.label, hue:p.hue, ph: BD_PLACEHOLDER[p.id] || "" };
  });
}
function sheetBrainDump(){
  return ''+
  '<div class="sheet-head"><h2 class="sec">Brain dump</h2><button class="icon-btn" data-act="close-sheet" aria-label="Close">✕</button></div>'+
  '<p class="hint">One per line, in the world it belongs to. '+S.settings.defaultDuration+' minutes each unless you end with <b>20m</b>. <b>!</b> = important, <b>today</b> or <b>tomorrow</b> sets a deadline, <b>@11:00</b> puts it in the diary, <b>every 1h</b> makes it a check-in.</p>'+
  bdBoxes().map(function(b){
    return '<div class="field bd-field">'+
      '<div class="bd-head"><label for="bd-'+esc(b.id)+'">'+
        '<span class="swatch" style="background:hsl('+b.hue+' 62% 55%)"></span>'+
        esc(b.label)+'</label>'+
        (micSupported() ? '<button class="mic sm" data-bdmic="'+esc(b.id)+'" type="button" aria-label="Dictate into '+esc(b.label)+'">'+MIC_SVG+'</button>' : '')+
      '</div>'+
      '<textarea id="bd-'+esc(b.id)+'" data-bd="'+esc(b.id)+'" rows="3" placeholder="'+b.ph+'"></textarea>'+
    '</div>';
  }).join("")+
  '<p class="hint" id="bd-heard"></p>'+
  '<button class="btn go wide" id="bd-save">Add them all</button>';
}
/* one dumped line -> one task, with the box it was typed in choosing its world */
function bdLineToTask(line, planet){
  var l = line, at = null;
  var mt = l.match(/@\s*(\d{1,2}[:.]\d{2})/);
  if(mt){ at = mt[1].replace(".",":"); if(at.length === 4) at = "0"+at; l = l.replace(mt[0],"").trim(); }
  if(!l.trim()) return null;
  var parsed = parseCapture(l);
  var nm = parsed.name || l.trim();
  if(!nm) return null;
  var rep = parsed.repeatEvery || 0;
  var explicit = parsed.duration || null;
  var mins = explicit || estimateMinutes(nm);
  if(planet === "errands") mins = Math.min(mins, 15);
  var fixed = at || parsed.fixedStart || null;
  return makeTask({
    name:nm, planet:planet,
    duration:mins, estimated:!explicit,
    effort: guessEffort(mins, rep),
    priority: parsed.priority || "normal",
    due: parsed.due || (fixed ? todayKey() : null),
    type: guessType(nm, planet, !!fixed),
    repeatEvery: fixed ? 0 : rep,
    fixedStart: fixed, fixedEnd: fixed ? minsToHHMM(hhmmToMins(fixed)+mins) : null
  });
}
function bindBrainDump(){
  var root = document.getElementById("sheetRoot");
  var boxes = [].slice.call(root.querySelectorAll("[data-bd]"));
  if(boxes[0]) boxes[0].focus();
  var heard = root.querySelector("#bd-heard");
  root.querySelectorAll("[data-bdmic]").forEach(function(mic){
    mic.addEventListener("click", function(){
      var ta = root.querySelector('[data-bd="'+mic.dataset.bdmic+'"]');
      if(!ta) return;
      var base = ta.value;
      heard.textContent = "Listening…";
      dictate(mic, function(txt){ ta.value = (base ? base.replace(/\n$/,"")+"\n" : "") + txt; },
        function(txt){
          ta.value = (base ? base.replace(/\n$/,"")+"\n" : "") + txt + "\n";
          heard.textContent = "Speak another, or add them all.";
          ta.scrollTop = ta.scrollHeight;
        });
    });
  });
  root.querySelector("#bd-save").addEventListener("click", function(){
    var added = 0;
    boxes.forEach(function(ta){
      var where = ta.dataset.bd;
      (ta.value||"").split("\n").map(function(x){ return x.trim(); }).filter(Boolean).forEach(function(line){
        var t = bdLineToTask(line, where);
        if(t){ S.tasks.push(t); added++; }
      });
    });
    if(!added){ toast("Nothing to add yet."); return; }
    if(!S.session.started){ S.session.started = true; S.session.date = todayKey(); }
    save(); closeSheet(); toast(added+" added"); render();
    if(!S.profile.sawGestures) showGestures();
  });
}
function sheetTimeUp(){
  var f = S.focus, t = byId(f.taskId);
  var again = f.reassessed > 0;
  return ''+
  '<div class="sheet-head"><h2 class="sec">'+(again ? "Half hour's up" : "Time")+'</h2></div>'+
  '<h1 class="big" style="font-size:clamp(1.7rem,7vw,2.2rem)">'+esc(t? t.name : "Task")+'</h1>'+
  coachHTML([again ? "That was the extra 30. Honestly — how close?" : "What's happening?"])+
  '<div class="stack">'+
    '<button class="btn go wide" data-act="tu-done">Done</button>'+
    '<button class="btn wide" data-act="extend" data-min="5">Nearly — 5 more</button>'+

/* ---------- "check back on it later" ----------

function checkInOptions(){
  var now = new Date(), out = [];
  var at = function(days, h, m){
    var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + days, h, m, 0, 0);
    return d;
  };
  out.push({ label:"In an hour", at:new Date(now.getTime() + 60*60000) });
  out.push({ label:"In 3 hours", at:new Date(now.getTime() + 3*60*60000) });
  var aft = at(0, 14, 0);   if(aft > now) out.push({ label:"This afternoon", at:aft });
  var eve = at(0, 18, 30);  if(eve > now) out.push({ label:"This evening", at:eve });
  out.push({ label:"Tomorrow morning", at:at(1, 9, 0) });
  var mon = 1 + ((8 - now.getDay()) % 7 || 7);
  out.push({ label:"Next Monday", at:at(mon, 9, 0) });
  return out;
}
function localStamp(d){
  var p = function(n){ return (n<10?"0":"")+n; };
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes());
