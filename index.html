function sliderHTML(id, steps, value){
  var vals = steps.map(function(s){ return s.value; });
  var idx = Math.max(0, vals.indexOf(value));
  var snaps = steps.map(function(_,i){
    return '<span class="slider-snap" style="left:calc(14px + (100% - 28px) * '+(steps.length>1?i/(steps.length-1):0)+')"></span>';
  }).join("");
  var labels = steps.map(function(s,i){ return '<span class="'+(i===idx?"on":"")+'">'+esc(s.label)+'</span>'; }).join("");
  return '<div class="slider" id="'+id+'" data-idx="'+idx+'" tabindex="0" role="slider" aria-valuemin="0" aria-valuemax="'+(steps.length-1)+'" aria-valuenow="'+idx+'">'+
    '<div class="slider-track"></div><div class="slider-fill" id="'+id+'-fill"></div>'+snaps+
    '<div class="slider-orb" id="'+id+'-orb"></div></div>'+
    '<div class="slider-labels" id="'+id+'-labels">'+labels+'</div>';
}
function bindSlider(id, steps, onChange){
  var el = document.getElementById(id);
  if(!el) return;
  var orb = document.getElementById(id+"-orb"), fill = document.getElementById(id+"-fill"), labels = document.getElementById(id+"-labels");
  var n = steps.length;
  function place(idx){
    var pct = n>1 ? idx/(n-1) : 0;
    orb.style.left = "calc(14px + (100% - 28px) * "+pct+")";
    fill.style.width = "calc((100% - 28px) * "+pct+")";
    el.dataset.idx = idx; el.setAttribute("aria-valuenow", idx);
    [].slice.call(labels.children).forEach(function(c,i){ c.classList.toggle("on", i === idx); });
  }
  place(+el.dataset.idx);
  el._setIndex = place;
  function idxFromX(clientX){
    var r = el.getBoundingClientRect();
    var pct = Math.max(0, Math.min(1, (clientX - r.left - 14) / Math.max(1, r.width - 28)));
    return Math.round(pct * (n-1));
  }
  function commit(idx){
    var changed = +el.dataset.idx !== idx;
    place(idx);
    if(changed) onChange(steps[idx].value, idx);
  }
  /* Nothing commits on touch-down. A vertical drag is a page scroll and is
     handed straight back; a tap can only nudge one step, so brushing the bar
     on the way past never flings the value to the end. */
  var live = false, moved = false, sx = 0, sy = 0, downAt = 0;
  el.addEventListener("pointerdown", function(e){
    live = true; moved = false; sx = e.clientX; sy = e.clientY; downAt = performance.now();
    try{ el.focus({ preventScroll:true }); }catch(err){}
  });
  el.addEventListener("pointermove", function(e){
    if(!live) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if(!moved){
      if(Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 8){ live = false; return; }  /* you're scrolling */
      if(Math.abs(dx) < 7) return;
      moved = true;
      el.classList.add("grabbing");
      try{ el.setPointerCapture(e.pointerId); }catch(err){}
    }
    e.preventDefault();
    commit(idxFromX(e.clientX));
  });
  el.addEventListener("pointerup", function(e){
    if(!live){ el.classList.remove("grabbing"); return; }
    live = false; el.classList.remove("grabbing");
    if(moved) return;
    if(performance.now() - downAt > 450) return;
    var i = +el.dataset.idx, want = idxFromX(e.clientX);
    if(Math.abs(want - i) <= 1) commit(want);      /* a tap nudges, a drag jumps */
  });
  el.addEventListener("pointercancel", function(){ live = false; moved = false; el.classList.remove("grabbing"); });
  el.addEventListener("keydown", function(e){
    var i = +el.dataset.idx;
    if(e.key === "ArrowRight" || e.key === "ArrowUp"){ e.preventDefault(); commit(Math.min(n-1, i+1)); }
    if(e.key === "ArrowLeft" || e.key === "ArrowDown"){ e.preventDefault(); commit(Math.max(0, i-1)); }
  });
}
var PRI_STEPS = PRIORITY_ORDER.map(function(k){ return { value:k, label:PRIORITY[k] }; });
var EFF_STEPS = EFFORT_ORDER.map(function(k){ return { value:k, label:EFFORT[k] }; });
var CAT_STEPS = [{ value:"Work", label:"Work" }, { value:"Personal", label:"Personal" }];
var REPEATS = [{v:0,l:"Never"},{v:30,l:"30m"},{v:60,l:"1h"},{v:120,l:"2h"},{v:180,l:"3h"},{v:240,l:"4h"}];

var MIC_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M18 11a1 1 0 0 0-2 0 4 4 0 0 1-8 0 1 1 0 0 0-2 0 6 6 0 0 0 5 5.91V20H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-3.09A6 6 0 0 0 18 11z"/></svg>';

/* Turn a spoken sentence into a task. Anything it recognises is stripped out
   of the name, so "reply to Dave at work, 10 minutes, important" leaves
   "Reply to Dave". Everything it sets is shown in the sheet before you save. */
var NUM_WORDS = { one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,
  eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,
  nineteen:19,twenty:20,thirty:30,forty:40,fifty:50,sixty:60,ninety:90 };
function wordNumbers(t){
  t = t.replace(/\b(twenty|thirty|forty|fifty)[\s-](one|two|three|four|five|six|seven|eight|nine)\b/gi,
      function(_,a,b){ return (NUM_WORDS[a.toLowerCase()]||0) + (NUM_WORDS[b.toLowerCase()]||0); });
  t = t.replace(/\b([a-z]+)\s+(minutes?|mins?|min|hours?|hrs?)\b/gi,
      function(all,w,u){ var n = NUM_WORDS[w.toLowerCase()]; return n ? n+" "+u : all; });
  t = t.replace(/\b(at|from)\s+([a-z]+)\b/gi,
      function(all,pre,w){ var n = NUM_WORDS[w.toLowerCase()]; return (n && n <= 12) ? pre+" "+n : all; });
  return t;
}
function parseSpoken(raw){
  var text = " " + wordNumbers(String(raw||"").trim()) + " ";
  var d = {}, said = [], m;
  function eat(re){ var mm = text.match(re); if(mm){ text = text.replace(mm[0], " "); return mm; } return null; }

  /* repeats before durations - "every 30 minutes" contains a duration */
  if((m = eat(/\bevery\s+(\d{1,3})\s*(minutes?|mins?|m)\b/i))) d.repeatEvery = +m[1];
  else if((m = eat(/\bevery\s+(\d{1,2})\s*(hours?|hrs?|h)\b/i))) d.repeatEvery = (+m[1])*60;
  else if(eat(/\bevery\s+half\s*(an\s*)?hour\b/i)) d.repeatEvery = 30;
  else if(eat(/\bevery\s+hour\b/i)) d.repeatEvery = 60;
  if(d.repeatEvery){ said.push(repeatLabel(d.repeatEvery)); d.effort = "easy"; }

  /* a fixed time */
  if((m = eat(/\b(?:at|from)\s+(\d{1,2})(?:[:.](\d{2}))?\s*(am|pm|a\.m\.|p\.m\.)?(?=\s|$)/i))){
    var hh = +m[1], mm2 = m[2] ? +m[2] : 0, ap = (m[3]||"").toLowerCase();
    if(/^p/.test(ap) && hh < 12) hh += 12;
    if(/^a/.test(ap) && hh === 12) hh = 0;
    if(!ap && hh >= 1 && hh <= 7) hh += 12;        /* "at 3" means this afternoon */
    if(hh < 24 && mm2 < 60){
      d.timed = true; d.fixedStart = pad(hh)+":"+pad(mm2);
      d.priority = "must"; d.type = "Meeting";
      said.push("at "+d.fixedStart);
    }
  }

  /* how long */
  var LEAD = "(?:for\\s+|about\\s+|around\\s+|roughly\\s+|lasting\\s+|takes\\s+)?";
  if((m = eat(new RegExp("\\b"+LEAD+"(\\d{1,3})\\s*(?:minutes?|mins?|min)\\b","i")))) d.duration = +m[1];
  else if((m = eat(new RegExp("\\b"+LEAD+"(\\d{1,2})\\s*(?:hours?|hrs?)\\b","i")))) d.duration = (+m[1])*60;
  else if(eat(new RegExp("\\b"+LEAD+"(?:an?\\s+)?hour\\s+and\\s+a\\s+half\\b","i"))) d.duration = 90;
  else if(eat(new RegExp("\\b"+LEAD+"half\\s+an\\s+hour\\b","i"))) d.duration = 30;
  else if(eat(new RegExp("\\b"+LEAD+"quarter\\s+of\\s+an\\s+hour\\b","i"))) d.duration = 15;
  else if(eat(new RegExp("\\b"+LEAD+"(?:an|one)\\s+hour\\b","i"))) d.duration = 60;
  if(d.duration) said.push(d.duration+" min");

  /* how much it matters */
  if(eat(/\b(must do today|must be done today|urgent|urgently|top priority|first thing|asap)\b/i)) d.priority = "must";
  else if(eat(/\bimportant\b/i)) d.priority = "important";
  else if(eat(/\b(optional|if i (get|have) (the )?time|nice to have|whenever|no rush)\b/i)) d.priority = "optional";
  if(d.priority && !d.timed) said.push(PRIORITY[d.priority]);

  /* how heavy */
  if(eat(/\b(deep work|proper(ly)? focus|head down|concentrate|focus session)\b/i)) d.effort = "deep";
  else if(eat(/\b(quick|quickly|easy|small|two minute|five minute)\b/i)) d.effort = "easy";

  /* where. "On the way home" is a journey, so transit phrases are read before
     location names — otherwise the word "home" hijacks it. */
  var here = null;
  var transit = (transitLocs()[0]||{}).id;
  var TRANSIT_PHRASE = /\b(?:(?:on|in)\s+(?:the|my)\s+way(?:\s+(?:home|back|in|out|there|to\s+\w+))?|while\s+i'?m\s+out|when\s+i'?m\s+out|out\s+and\s+about|in\s+town|at\s+the\s+shops?|on\s+the\s+road)\b/i;
  if(transit && TRANSIT_PHRASE.test(text)){ here = transit; text = text.replace(TRANSIT_PHRASE, " "); }
  if(!here) S.locations.forEach(function(l){
    if(here) return;
    var words = l.label.replace(/&/g," ").split(/\s+/).filter(function(w){ return w.length > 2; });
    var re = new RegExp("\\b(?:at|in|from|when i'?m at|while i'?m at)?\\s*"+
                        words.map(function(w){ return w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }).join("\\s+(?:and\\s+)?")+"\\b","i");
    if(re.test(text)){ here = l.id; text = text.replace(re, " "); }
  });
  if(!here && transit && ERRANDY.test(text)) here = transit;
  if(!here && HOUSEHOLD.test(text)) here = locById("home") ? "home" : (places()[0]||{}).id;
  if(here){
    d.locations = [here];
    said.push(locLabel(here));
    if(isTransit(here)){ d.category = "Personal"; d.type = "Errand"; d.effort = d.effort || "easy"; }
  }
  if(!d.category && (HOUSEHOLD.test(text) || /\b(personal|for me|my own)\b/i.test(text))) d.category = "Personal";

  /* what's left is the name */
  var name = text.replace(/\b(add (a )?task|add|remind me to|remember to|i need to|i've got to|i have to|note to self|please|task)\b/ig," ")
                 .replace(/[\s,;.]+/g," ")
                 .replace(/^[\s,;.-]+|[\s,;.-]+$/g,"")
                 .trim();
  if(name) d.name = name.charAt(0).toUpperCase() + name.slice(1);
  d._said = said;
  return d;
}

var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var rec = null, recBtn = null;
function micSupported(){ return !!SR; }
function stopDictation(){ try{ if(rec) rec.stop(); }catch(e){} }
function dictate(btn, onInterim, onFinal){
  if(!SR){ toast("This browser can't listen. Type it instead."); return; }
  if(rec){ stopDictation(); return; }
  var r = new SR(), finalText = "";
  r.lang = (navigator.language && /^en/i.test(navigator.language)) ? navigator.language : "en-GB";
  r.interimResults = true; r.continuous = false; r.maxAlternatives = 1;
  r.onresult = function(e){
    var interim = "";
    for(var i = e.resultIndex; i < e.results.length; i++){
      if(e.results[i].isFinal) finalText += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    onInterim(finalText + interim);
  };
  r.onerror = function(e){
    var msg = { "not-allowed":"Microphone blocked. Allow it for this site — inside a preview frame it can't ask.",
                "service-not-allowed":"Microphone blocked. Open ONE from its own web address and allow the mic.",
                "no-speech":"Didn't catch that.",
                "audio-capture":"No microphone found.",
                "network":"Speech needs a connection." }[e.error] || "Couldn't listen just then.";
    toast(msg);
  };
  r.onend = function(){
    rec = null;
    if(recBtn){ recBtn.classList.remove("on"); recBtn = null; }
    if(finalText.trim()) onFinal(finalText.trim());
  };
  try{ r.start(); rec = r; recBtn = btn; btn.classList.add("on"); }
  catch(err){ toast("Couldn't start listening."); }
}

/* after dictation, push the whole parsed draft back into the controls */
function syncAddSheet(){
  var root = document.getElementById("sheetRoot");
  if(!root || !root.querySelector("#at-name")) return;
  root.querySelector("#at-name").value = draft.name || "";
  root.querySelector("#at-dur").innerHTML = draft.duration+"<small>minutes</small>";
  var pri = document.getElementById("sl-pri"), eff = document.getElementById("sl-eff"), cat = document.getElementById("sl-cat");
  if(pri && pri._setIndex) pri._setIndex(Math.max(0, PRIORITY_ORDER.indexOf(draft.priority)));
  if(eff && eff._setIndex) eff._setIndex(Math.max(0, EFFORT_ORDER.indexOf(draft.effort)));
  if(cat && cat._setIndex) cat._setIndex(draft.category === "Personal" ? 1 : 0);
  root.querySelectorAll("[data-loc]").forEach(function(x){ x.setAttribute("aria-pressed", String(draft.locations.indexOf(x.dataset.loc) > -1)); });
  root.querySelectorAll("[data-type]").forEach(function(x){ x.setAttribute("aria-pressed", String(x.dataset.type === draft.type)); });
  root.querySelectorAll("[data-rep]").forEach(function(x){ x.setAttribute("aria-pressed", String(+x.dataset.rep === (draft.repeatEvery||0))); });
  var rh = root.querySelector("#at-rephint"); if(rh) rh.style.display = draft.repeatEvery ? "" : "none";
  var tb = root.querySelector("#at-timed"), ub = root.querySelector("#at-untimed");
  if(tb && ub){
    tb.setAttribute("aria-pressed", String(!!draft.timed));
    ub.setAttribute("aria-pressed", String(!draft.timed));
    root.querySelector("#at-times").style.display = draft.timed ? "" : "none";
    root.querySelector("#at-timedhint").style.display = draft.timed ? "" : "none";
    if(draft.timed){
      root.querySelector("#at-start").value = draft.fixedStart;
      root.querySelector("#at-end").value = minsToHHMM(hhmmToMins(draft.fixedStart) + draft.duration);
    }
  }
}

function bindAddTask(){
  var root = document.getElementById("sheetRoot");
  var mic = root.querySelector("#at-mic"), heard = root.querySelector("#at-heard");
  if(mic){
    mic.addEventListener("click", function(){
      heard.textContent = "Listening…";
      dictate(mic, function(txt){ heard.textContent = "“"+txt+"”"; },
        function(txt){
          var got = parseSpoken(txt);
          Object.keys(got).forEach(function(k){ if(k.charAt(0) !== "_") draft[k] = got[k]; });
          if(draft.timed && !draft.fixedStart) draft.timed = false;
          syncAddSheet();
          heard.textContent = got._said && got._said.length ? "Heard: "+got._said.join(" · ") : "“"+txt+"”";
        });
    });
  }
  var nameEl = root.querySelector("#at-name");
  if(nameEl){
    nameEl.focus();
    nameEl.addEventListener("input", function(){ draft.name = nameEl.value; });
    nameEl.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); commitTask(); } });
  }
  /* every control mutates in place — the sheet never re-renders, so it never jumps */
  root.querySelectorAll("[data-dur]").forEach(function(b){
    b.addEventListener("click", function(){
      draft.duration = Math.max(5, Math.min(480, draft.duration + (+b.dataset.dur)));
      root.querySelector("#at-dur").innerHTML = draft.duration+"<small>minutes</small>";
      var en = root.querySelector("#at-end"), st = root.querySelector("#at-start");
      if(en && st && draft.timed) en.value = minsToHHMM(hhmmToMins(st.value) + draft.duration);
    });
  });
  bindSlider("sl-pri", PRI_STEPS, function(v){ draft.priority = v; });
  bindSlider("sl-eff", EFF_STEPS, function(v){ draft.effort = v; });
  bindSlider("sl-cat", CAT_STEPS, function(v){ draft.category = v; });
  root.querySelectorAll("[data-loc]").forEach(function(b){
    b.addEventListener("click", function(){
      var id = b.dataset.loc;
      if(id === "anywhere") draft.locations = ["anywhere"];
      else {
        draft.locations = draft.locations.filter(function(x){ return x !== "anywhere"; });
        var i = draft.locations.indexOf(id);
        if(i > -1) draft.locations.splice(i,1); else draft.locations.push(id);
        if(!draft.locations.length) draft.locations = ["anywhere"];
      }
      root.querySelectorAll("[data-loc]").forEach(function(x){
        x.setAttribute("aria-pressed", String(draft.locations.indexOf(x.dataset.loc) > -1));
      });
    });
  });
  root.querySelectorAll("[data-type]").forEach(function(b){
    b.addEventListener("click", function(){
      draft.type = b.dataset.type;
      root.querySelectorAll("[data-type]").forEach(function(x){ x.setAttribute("aria-pressed", String(x.dataset.type === draft.type)); });
    });
  });
  root.querySelectorAll("[data-rep]").forEach(function(b){
    b.addEventListener("click", function(){
      draft.repeatEvery = +b.dataset.rep;
      root.querySelectorAll("[data-rep]").forEach(function(x){ x.setAttribute("aria-pressed", String(+x.dataset.rep === draft.repeatEvery)); });
      root.querySelector("#at-rephint").style.display = draft.repeatEvery ? "" : "none";
      /* a check-in belongs in the small-win bucket unless you say otherwise */
      if(draft.repeatEvery && draft.effort === "normal"){
        draft.effort = "easy";
        var sl = document.getElementById("sl-eff");
        if(sl && sl._setIndex) sl._setIndex(0);
      }
    });
  });
  var timed = root.querySelector("#at-timed"), untimed = root.querySelector("#at-untimed");
  var setTimed = function(on){
    draft.timed = on;
    timed.setAttribute("aria-pressed", String(on));
    untimed.setAttribute("aria-pressed", String(!on));
    root.querySelector("#at-times").style.display = on ? "" : "none";
    root.querySelector("#at-timedhint").style.display = on ? "" : "none";
  };
  timed.addEventListener("click", function(){ setTimed(true); });
  untimed.addEventListener("click", function(){ setTimed(false); });
  var st = root.querySelector("#at-start");
  if(st) st.addEventListener("change", function(){
    var en = root.querySelector("#at-end");
    if(en) en.value = minsToHHMM(hhmmToMins(st.value) + draft.duration);
  });
  root.querySelector('[data-act="save-task"]').addEventListener("click", commitTask);
}
function commitTask(){
  var root = document.getElementById("sheetRoot");
  var nm = (root.querySelector("#at-name").value||"").trim();
  if(!nm){ toast("Give it a name first."); root.querySelector("#at-name").focus(); return; }
  draft.name = nm;
  if(draft.timed){
    draft.fixedStart = root.querySelector("#at-start").value || draft.fixedStart;
    draft.fixedEnd = root.querySelector("#at-end").value || null;
    if(draft.fixedEnd && hhmmToMins(draft.fixedEnd) > hhmmToMins(draft.fixedStart)) draft.duration = hhmmToMins(draft.fixedEnd) - hhmmToMins(draft.fixedStart);
  }
  var t = makeTask({
    name:draft.name, category:draft.category, priority:draft.priority, effort:draft.effort,
    duration:draft.duration, locations:draft.locations, type:draft.type,
    repeatEvery: draft.timed ? 0 : draft.repeatEvery,
    unblocks: draft.unblocks || null,
    fixedStart: draft.timed ? draft.fixedStart : null,
    fixedEnd: draft.timed ? draft.fixedEnd : null
  });
  S.tasks.push(t);
  if(!S.session.started){ S.session.started = true; S.session.date = todayKey(); }
  draft = newDraft();
  save(); closeSheet();
  toast(S.focus ? "Added. You're still on the current one." : "Added: "+t.name);
  render();
}

function bindBrainDump(){
  var root = document.getElementById("sheetRoot"), ta = root.querySelector("#bd-text");
  if(ta) ta.focus();
  var mic = root.querySelector("#bd-mic"), heard = root.querySelector("#bd-heard");
  if(mic){
    mic.addEventListener("click", function(){
      var base = ta.value;
      heard.textContent = "Listening…";
      dictate(mic, function(txt){ ta.value = (base ? base.replace(/\n$/,"")+"\n" : "") + txt; },
        function(txt){
          ta.value = (base ? base.replace(/\n$/,"")+"\n" : "") + txt + "\n";
          heard.textContent = "Speak another, or add them all.";
          ta.scrollTop = ta.scrollHeight;
        });
    });
  }
  root.querySelector("#bd-save").addEventListener("click", function(){
    var lines = (ta.value||"").split("\n").map(function(l){ return l.trim(); }).filter(Boolean);
    if(!lines.length){ toast("Nothing to add yet."); return; }
    var outLoc = (transitLocs()[0]||{}).id;
    var homeLoc = locById("home") ? "home" : (places()[0]||{}).id;
    lines.forEach(function(l){
      var dur = S.settings.defaultDuration, eff = "normal", pri = "normal", at = null;
      var mt = l.match(/@\s*(\d{1,2}[:.]\d{2})/);
      if(mt){ at = mt[1].replace(".",":"); if(at.length === 4) at = "0"+at; l = l.replace(mt[0],"").trim(); }
      var rep = 0;
      var mr = l.match(/\bevery\s+(\d{1,3})\s*(m|min|mins|minutes|h|hr|hrs|hours?)\b/i);
      if(mr){ rep = /^h/i.test(mr[2]) ? (+mr[1])*60 : +mr[1]; l = l.replace(mr[0], "").trim(); }
      var m = l.match(/\s(\d{1,3})\s*(m|min|mins|minutes)$/i);
      if(m){ dur = Math.min(480, +m[1]); l = l.slice(0, m.index).trim(); }
      if(dur <= 10) eff = "easy";
      if(dur >= 60) eff = "deep";
      if(/^!/.test(l)){ pri = "must"; l = l.replace(/^!\s*/,""); }
      var errand = outLoc && ERRANDY.test(l), house = !errand && HOUSEHOLD.test(l);
      S.tasks.push(makeTask({
        name:l, duration: errand ? Math.min(dur,15) : dur,
        effort:(rep || errand || (house && dur<=15)) ? "easy" : eff,
        priority: at ? "must" : pri,
        category:(errand||house) ? "Personal" : "Work",
        locations:[ errand ? outLoc : (house ? homeLoc : "anywhere") ],
        type: at ? "Meeting" : (errand ? "Errand" : (house ? "Physical" : "Admin")),
        repeatEvery: at ? 0 : rep,
        fixedStart: at, fixedEnd: at ? minsToHHMM(hhmmToMins(at)+dur) : null
      }));
    });
    if(!S.session.started){ S.session.started = true; S.session.date = todayKey(); }
    save(); closeSheet(); toast(lines.length+" added"); render();
    if(!S.profile.sawGestures) showGestures();
  });
}

/* hand the task a fresh clock and put it in committed mode */
function commitTo(mins){
  var f = S.focus; if(!f) return;
  var t = byId(f.taskId); if(!t) return;
  if(!t.originalEstimate) t.originalEstimate = t.duration;
  t.actualMinutes = (t.actualMinutes||0) + Math.max(0, Math.round((Date.now() - f.startedAt)/60000));
  t.extensions = (t.extensions||0) + 1;
  if(!t.commit) t.commit = { on:false, reasons:[], added:[], startedAt:Date.now() };
  var again = t.commit.on;
  t.commit.on = true;
  t.commit.added.push(mins);
  S.focus = { taskId:t.id, startedAt:Date.now(), plannedMin:mins, addedMin:0,
              extensions:0, paused:false, pausedAt:null, rang:false, committed:true };
  save(); closeSheet(); renderNow(true); startTicker();
  toast(voice(again ? "commitAgain" : "commitOn", { mins:mins })[0]);
}

   14. DAY TAB
   ============================================================ */
var PX_PER_MIN = 1.05;
function renderPlan(){
  var segs = sortedSchedule();
  var startM = 6*60, endM = 24*60, H = (endM - startM) * PX_PER_MIN;
  var y = function(m){ return (Math.max(startM, m) - startM) * PX_PER_MIN; };

  var bands = segs.map(function(s){
    var f = Math.max(startM, hhmmToMins(s.from)), t = Math.min(endM, hhmmToMins(s.to));
    if(t <= f) return "";
    var l = locById(s.loc);
    return '<div class="tl-band" style="top:'+y(f)+'px;height:'+((t-f)*PX_PER_MIN)+'px;background:hsl('+(l?l.hue:210)+' 45% 55% / .6)"></div>';
  }).join("");
  var hours = "";
  for(var h = 6; h <= 23; h++) hours += '<div class="tl-hour" style="top:'+y(h*60)+'px">'+pad(h)+':00</div>';
  /* Anything that overlaps in time gets side-by-side lanes, so every block
     keeps enough width to read. Lanes are worked out per cluster, so one busy
     hour doesn't squeeze the rest of the day. */
  var items = fixedToday().map(function(t){
    return { from:hhmmToMins(t.fixedStart), to:taskEndMins(t), cls:"fixed",
             time:t.fixedStart+"–"+minsToHHMM(taskEndMins(t)), label:t.name };
  });
  if(S.settings.lunchRequired){
    items.push({ from:hhmmToMins(S.settings.lunchFrom), to:hhmmToMins(S.settings.lunchTo), cls:"lunch",
                 time:S.settings.lunchFrom+"–"+S.settings.lunchTo+" window",
                 label:"Lunch · "+S.settings.lunchDuration+" min" });
  }
  items = items.filter(function(it){ return it.to > startM; })
               .sort(function(a,b){ return a.from - b.from || a.to - b.to; });

  var clusterEnd = -1, cluster = [], laid = [];
  function flush(){
    if(!cluster.length) return;
    var lanes = [];
    cluster.forEach(function(it){
      var li = 0;
      while(lanes[li] != null && lanes[li] > it.from) li++;
      lanes[li] = it.to; it.lane = li;
    });
    var total = lanes.length;
    cluster.forEach(function(it){ it.lanes = total; });
    laid = laid.concat(cluster);
    cluster = [];
  }
  items.forEach(function(it){
    if(cluster.length && it.from >= clusterEnd){ flush(); clusterEnd = -1; }
    cluster.push(it);
    clusterEnd = Math.max(clusterEnd, it.to);
  });
  flush();

  var blocks = laid.map(function(it){
    var span = 100 / it.lanes;
    var left = "calc(40px + (100% - 40px) * "+(it.lane*span/100)+" + "+(it.lane?3:0)+"px)";
    var width = "calc((100% - 40px) * "+(span/100)+" - "+(it.lanes>1?4:0)+"px)";
    var h = Math.max(34, (it.to - Math.max(startM, it.from)) * PX_PER_MIN);
    return '<div class="tl-block '+it.cls+(it.lanes>1?" narrow":"")+'" style="top:'+y(it.from)+'px;height:'+h+'px;left:'+left+';width:'+width+';right:auto">'+
      '<span class="t">'+esc(it.time)+'</span>'+esc(it.label)+'</div>';
  }).join("");
  var lunchBlock = "";
  var nowLine = (minsOfDay() >= startM) ? '<div class="tl-now" style="top:'+y(minsOfDay())+'px"></div>' : "";

  var segRows = segs.map(function(s, i){
    return '<div class="seg-row">'+
      '<span class="swatch" style="background:hsl('+locHue(s.loc)+' 45% 55%)"></span>'+
      '<input type="time" data-seg="'+i+'" data-k="from" value="'+esc(s.from)+'">'+
      '<input type="time" data-seg="'+i+'" data-k="to" value="'+esc(s.to)+'">'+
      '<select data-seg="'+i+'" data-k="loc">'+S.locations.map(function(l){
        return '<option value="'+esc(l.id)+'"'+(l.id===s.loc?" selected":"")+'>'+esc(l.label)+'</option>';
      }).join("")+'</select>'+
      '<button class="icon-btn" data-act="seg-del" data-i="'+i+'" aria-label="Remove">✕</button></div>';
  }).join("");

  document.getElementById("planRoot").innerHTML = ''+
  '<div class="stack" style="gap:18px">'+
    '<div class="stack" style="gap:6px"><p class="eyebrow left">Today</p>'+
      '<h1 class="big" style="font-size:clamp(1.7rem,7vw,2.2rem)">The shape of it</h1>'+
      '<p class="hint">Fixed appointments, your lunch window, and where you\'ll be.</p></div>'+
    '<button class="btn wide" data-act="add-timed">+ Add a fixed-time task</button>'+
    '<div class="timeline" style="height:'+H+'px">'+
      '<div class="tl-rail">'+bands+'</div>'+
      '<div class="tl-body">'+hours+lunchBlock+blocks+nowLine+'</div>'+
    '</div>'+
    '<hr class="divider">'+
    '<div class="group"><div class="group-head"><h2 class="sec">Where you are, when</h2>'+
      '<span class="count">'+(S.settings.autoLocation?"auto":"manual")+'</span></div>'+
      segRows+
      '<button class="btn sm" data-act="seg-add">+ Add a segment</button>'+
      '<div class="choices" style="margin-top:8px">'+
        '<button class="choice grow" data-autoloc="1" aria-pressed="'+(S.settings.autoLocation)+'">Follow this schedule</button>'+
        '<button class="choice grow" data-autoloc="0" aria-pressed="'+(!S.settings.autoLocation)+'">I\'ll spin it myself</button>'+
      '</div>'+
      '<p class="hint">Spinning the dial always wins — the schedule takes over again at the next change.</p>'+
    '</div>'+
  '</div>';

  var root = document.getElementById("planRoot");
  root.querySelectorAll("[data-seg]").forEach(function(el){
    el.addEventListener("change", function(){
      var target = sortedSchedule()[+el.dataset.seg];
      var real = S.schedule.indexOf(target);
      if(real < 0) return;
      S.schedule[real][el.dataset.k] = el.value;
      S.session.segIndex = -1;
      save(); applySchedule(); applyHue(); renderPlan(); renderChips();
    });
  });
  root.querySelectorAll("[data-autoloc]").forEach(function(b){
    b.addEventListener("click", function(){
      S.settings.autoLocation = b.dataset.autoloc === "1";
      S.session.segIndex = -1;
      save();
      if(S.settings.autoLocation) applySchedule();
      applyHue(); renderPlan(); renderNow(true);
    });
  });
}

function rowHTML(t){
  var meta = '<span class="mini">'+t.duration+'m</span>';
  if(t.fixedStart) meta += '<span class="mini hot">'+esc(t.fixedStart)+'–'+esc(minsToHHMM(taskEndMins(t)))+'</span>';
  if(t.priority === "must") meta += '<span class="mini hot">Must do today</span>';
  else if(t.priority === "optional") meta += '<span class="mini">Optional</span>';
  if(t.effort === "deep") meta += '<span class="mini cool">Deep</span>';
  if(t.effort === "easy") meta += '<span class="mini good">Easy</span>';
  meta += '<span class="mini">'+esc(t.category)+'</span>';
  t.locations.forEach(function(l){ meta += '<span class="mini'+(isTransit(l)?" cool":"")+'">'+esc(locLabel(l))+'</span>'; });
  if(isRecurring(t)){
    meta += '<span class="mini cool">'+esc(repeatLabel(t.repeatEvery))+'</span>';
    meta += isCooling(t) ? '<span class="mini">next in '+coolMins(t)+'m</span>' : '<span class="mini hot">due now</span>';
    if(t.checkCount) meta += '<span class="mini good">checked '+t.checkCount+'×</span>';
  }
  if(isCommitted(t)) meta += '<span class="mini hot">Committed</span>';
  if(t.safeStopped) meta += '<span class="mini good">Left safe</span>';
  if(t.status === "open" && !isRecurring(t) && t.actualMinutes > 0){
    meta += timeLeftOn(t) > 0
      ? '<span class="mini cool">'+fmtDur(t.actualMinutes)+' in · '+timeLeftOn(t)+'m left</span>'
      : '<span class="mini hot">'+fmtDur(t.actualMinutes)+' in · over estimate</span>';
  }
  if(t.status === "done" && t.originalEstimate && t.actualMinutes > t.originalEstimate)
    meta += '<span class="mini">'+t.originalEstimate+'m est · '+fmtDur(t.actualMinutes)+' actual</span>';
  if(t.postponedToday) meta += '<span class="mini hot">Dodged '+t.postponedToday+'×</span>';
  if(t.status === "blocked" && t.blockedReason) meta += '<span class="mini">'+esc(t.blockedReason)+'</span>';
  if(t.status === "done" && t.actualMinutes) meta += '<span class="mini good">'+t.actualMinutes+'m actual</span>';
  var actions = (t.status === "done"
    ? '<button class="icon-btn" data-act="undone" data-id="'+t.id+'" aria-label="Reopen">↩</button>'
    : (t.status === "blocked"
      ? '<button class="icon-btn" data-act="unblock" data-id="'+t.id+'" aria-label="Unblock">↺</button>'
      : '<button class="icon-btn" data-act="complete" data-id="'+t.id+'" aria-label="Mark done">✓</button>'))
    + '<button class="icon-btn" data-act="edit" data-id="'+t.id+'" aria-label="Edit">⋯</button>';
  return '<div class="row'+(t.status==="done"?" done":"")+'"><div class="row-main">'+
    '<div class="row-title">'+esc(t.name)+'</div><div class="row-meta">'+meta+'</div></div>'+
    '<div class="row-actions">'+actions+'</div></div>';
}

    '<hr class="divider">'+
    '<div class="field"><label>Working until</label><input type="time" id="yo-until" value="'+esc(st.workUntil)+'"></div>'+
    '<div class="field"><label>Lunch</label><div class="choices">'+
      '<button class="choice grow" data-lunchreq="1" aria-pressed="'+(st.lunchRequired)+'">Planned in</button>'+
      '<button class="choice grow" data-lunchreq="0" aria-pressed="'+(!st.lunchRequired)+'">Not today</button>'+
    '</div></div>'+

      '<div class="field"><label>Start window</label><div class="inline"><input type="time" id="yo-from" value="'+esc(st.lunchFrom)+'"><input type="time" id="yo-to" value="'+esc(st.lunchTo)+'"></div></div>'+
    '</div>'+

function buildId(){
  var m = document.querySelector('meta[name="one-build"]');
  return (m && m.content) ? m.content : "dev";
}
function renderChips(){
  var s = S.session, L = lunchInfo();
  var motLabel = { motivated:"Motivated", meh:"Meh", unmotivated:"Unmotivated" }[s.motivation];
  var chips = '<button class="statchip'+(s.motivation==="motivated"?" is-hi":"")+'" data-act="cycle-mot">'+motLabel+'</button>';
  var nf = nextFixed(), extra = "";
  if(s.started && !s.dayClosed){
    if(nf && hhmmToMins(nf.fixedStart) - minsOfDay() <= 60){
      extra = '<span class="statchip is-hi">'+esc(nf.name)+' '+esc(nf.fixedStart)+'</span>';
    } else if(L.active){ extra = '<span class="statchip is-cool">Lunch</span>'; }
    else if(L.pending && L.beforeWindow && L.minsToOpen <= 45){ extra = '<span class="statchip is-cool">Lunch in '+fmtDur(L.minsToOpen)+'</span>'; }
    else if(departureImminent()){
      var n = transitTasks().length;
      extra = '<span class="statchip is-cool">'+n+' errand'+(n === 1 ? '' : 's')+'</span>';
    }
  }
  document.getElementById("statchips").innerHTML = chips + extra;
}

/* ============================================================
   16. ACTIONS
   ============================================================ */
function unpin(){ S.ui.pinnedId = null; }
/* Anything dodged three times keeps its place at the front: you can skip past
   it as often as you like, but the moment you finish something it's back. */
function releaseNags(){
  S.tasks.forEach(function(x){
    if(x.status === "open" && x.postponedToday >= 3) x.lastPostponedAt = null;
  });
}
/* mins is time actually measured on the timer. Ticking something off by hand
   records the completion but claims no time — the day's totals stay honest. */
function completeTask(t, mins){
  unpin();
  releaseNags();
  t.status = "done"; t.completedAt = Date.now();
  t.actualMinutes = (t.actualMinutes || 0) + (mins || 0);
  S.log.push({ date:todayKey(), taskId:t.id, name:t.name, type:t.type, minutes:mins || 0, at:t.completedAt, kind:"done" });
  save();
}
document.addEventListener("click", function(e){
  var b = e.target.closest("[data-act]");
  if(!b) return;
  var act = b.dataset.act, id = b.dataset.id, t = id ? byId(id) : null;
  switch(act){
    case "close-sheet": closeSheet(); break;
    case "start-day": S.session.started = true; S.session.date = todayKey(); save(); render(); if(!S.profile.sawGestures) showGestures(); break;
    case "add-task": draft = draft || newDraft(); openSheet(sheetAddTask(), bindAddTask); break;
    case "add-timed": draft = newDraft(); draft.timed = true; draft.type = "Meeting"; openSheet(sheetAddTask(), bindAddTask); break;
    case "tick": case "complete": if(t){ settleTask(t, 0); render(); } break;
    case "finish-recurring": if(t){ finishRecurring(t); closeSheet(); render(); toast("Closed off for today."); } break;
    case "undone": if(t){ t.status="open"; t.completedAt=null; save(); render(); } break;
    case "unblock": if(t){ t.status="open"; t.blockedReason=null; save(); render(); toast("Back in play."); } break;
    case "block-reason": {
      var reason = b.dataset.reason;
      if(t){ t.status = "blocked"; t.blockedReason = reason; unpin(); save(); }
      if(t && UNBLOCK_HINTS[reason]){ openSheet(sheetUnblock(t.id, reason)); render(); }
      else { closeSheet(); toast("Parked. I won't keep asking."); render(); }
      break;
    }
    case "unblock-skip": closeSheet(); toast("Parked. I won't keep asking."); render(); break;
    case "unblock-add": {
      var hint = UNBLOCK_HINTS[b.dataset.reason] || UNBLOCK_HINTS.Other;
      draft = newDraft();
      draft.name = hint.name + (t ? t.name : "");
      draft.duration = hint.mins;
      draft.effort = "easy";
      draft.type = hint.type;
      draft.category = t ? t.category : draft.category;
      draft.unblocks = t ? t.id : null;
      if(hint.where === "transit"){
        var tl = transitLocs()[0];
        if(tl) draft.locations = [tl.id];
      } else if(t){
        draft.locations = t.locations.slice();
      }
      openSheet(sheetAddTask(), bindAddTask);
      break;
    }
    case "edit": openEditSheet(id); break;
    case "save-edit":
      if(t){
        var nm = document.getElementById("ed-name"); if(nm) t.name = nm.value.trim() || t.name;
        var s1 = document.getElementById("ed-start"), e1 = document.getElementById("ed-end");
        t.fixedStart = (s1 && s1.value) ? s1.value : null;
        t.fixedEnd = (e1 && e1.value) ? e1.value : null;
        if(t.fixedStart && t.fixedEnd && hhmmToMins(t.fixedEnd) > hhmmToMins(t.fixedStart)) t.duration = hhmmToMins(t.fixedEnd) - hhmmToMins(t.fixedStart);
        save();
      }
      closeSheet(); render(); toast("Updated.");
      break;
    case "delete-task":
      if(t){ S.tasks = S.tasks.filter(function(x){ return x.id !== t.id; }); save(); }
      closeSheet(); render(); toast("Gone.");
      break;
    case "tu-done": finishFocus(); break;
    case "tu-commit": openSheet(sheetCommitWhy()); break;
    case "commit-open-minutes": openSheet(sheetCommitHowLong(true), bindCommitMinutes); break;
    case "commit-why": {
      var ct = byId(S.focus && S.focus.taskId); if(!ct) break;
      if(!ct.commit) ct.commit = { on:false, reasons:[], added:[], startedAt:Date.now() };
      ct.commit.reasons.push(b.dataset.reason);
      save(); openSheet(sheetCommitHowLong(false), bindCommitMinutes);
      break;
    }
    case "commit-more": openSheet(sheetCommitHowLong(true), bindCommitMinutes); break;
    case "commit-finished": {
      var ft2 = byId(S.focus && S.focus.taskId);
      var fm = endFocus();
      if(ft2){
        ft2.actualMinutes = (ft2.actualMinutes||0) + fm;
        recordRun(ft2, "finished");
        ft2.commit = null;
        completeTask(ft2, 0);
        flashDone(ft2);
      }
      closeSheet(); save(); renderNow(true);
      break;
    }
    case "commit-safe": {
      var st2 = byId(S.focus && S.focus.taskId);
      var sm = endFocus();
      if(st2){
        st2.actualMinutes = (st2.actualMinutes||0) + sm;
        recordRun(st2, "safe-stop");
        st2.commit = null; st2.safeStopped = true;
        st2.lastPostponedAt = Date.now();     /* parked, not dodged */
        releaseNags();
      }
      unpin(); closeSheet(); save(); renderNow(true);
      toast(voice("safestop")[0]);
      break;
    }
    case "commit-rabbit": openSheet(sheetCommitRabbit()); break;
    case "commit-makesafe": {
      var mf = S.focus; if(!mf) break;
      mf.addedMin += 5; mf.rang = false; mf.makingSafe = true;
      save(); closeSheet(); renderNow(true);
      toast("Five minutes. Make it safe, then stop.");
      break;
    }
    case "commit-stopnow": {
      var rt2 = byId(S.focus && S.focus.taskId);
      var rm2 = endFocus();
      if(rt2){
        rt2.actualMinutes = (rt2.actualMinutes||0) + rm2;
        recordRun(rt2, "rabbit");
        rt2.commit = null; rt2.safeStopped = true;
        rt2.lastPostponedAt = Date.now();
      }
      unpin(); closeSheet(); save(); renderNow(true);
      toast(voice("rabbit")[0]);
      break;
    }
    case "tu-rabbit": {
      var rt = byId(S.focus && S.focus.taskId), rm = endFocus();
      if(rt){
        rt.actualMinutes = (rt.actualMinutes||0)+rm;
        recordRun(rt, "rabbit"); rt.commit = null;
        rt.lastPostponedAt = Date.now();
      }
      closeSheet(); save(); renderNow(true); toast(voice("rabbit")[0]);
      break;
    }
    case "extend": {
      var ef = S.focus; if(!ef) break;
      var add = +b.dataset.min;
      ef.addedMin += add; ef.extensions++; ef.rang = false;
      var xt = byId(ef.taskId); if(xt) xt.extensions = (xt.extensions||0) + 1;
      save(); closeSheet(); renderNow(true);
      toast(ef.extensions === 1 ? voice("ext1",{add:add})[0] : voice("extN",{plan:ef.plannedMin,total:fmtDur(ef.plannedMin+ef.addedMin)})[0]);
      break;
    }
    case "finish-work": S.session.workFinished = true; save(); render(); toast(transitTasks().length ? "Work's done. Check the pickup list." : "Work's done. Leave it there."); break;
    case "resume-work": S.session.workFinished = false; save(); render(); break;
    case "close-day": S.session.dayClosed = true; save(); go("now"); break;
    case "reopen": S.session.dayClosed = false; save(); renderNow(true); break;
    case "cycle-mot": {
      var order = ["motivated","meh","unmotivated"];
      S.session.motivation = order[(order.indexOf(S.session.motivation)+1) % 3];
      unpin(); save(); renderChips(); renderNow(true);
      toast("Motivation: "+S.session.motivation+".");
      break;
    }
    case "loc-add": openSheet(sheetAddLocation(), bindAddLocation); break;
    case "loc-hue": { var lh = locById(id); if(lh){ lh.hue = (lh.hue + 40) % 360; save(); applyHue(); renderYou(); } break; }
    case "loc-del": {
      var ld = locById(id); if(!ld) break;
      if(S.locations.length <= 1){ toast("You need somewhere to be."); break; }
      var stranded = 0;
      S.tasks.forEach(function(x){
        var i = x.locations.indexOf(id);
        if(i > -1){ x.locations.splice(i,1); stranded++; if(!x.locations.length) x.locations = ["anywhere"]; }
      });
      var fallback = S.locations.filter(function(x){ return x.id !== id; })[0].id;
      S.schedule.forEach(function(sg){ if(sg.loc === id) sg.loc = fallback; });
      S.locations = S.locations.filter(function(x){ return x.id !== id; });
      if(S.session.location === id) S.session.location = fallback;
      if(S.session.lastPlace === id) S.session.lastPlace = (places()[0]||S.locations[0]).id;
      save(); applyHue(); render();
      toast(stranded ? ld.label+" removed — "+stranded+" task(s) moved." : ld.label+" removed.");
      break;
    }
    case "seg-add":
      S.schedule.push({ from:"12:00", to:"13:00", loc:(places()[0]||S.locations[0]).id });
      S.session.segIndex = -1; save(); renderPlan();
      break;
    case "seg-del": {
      var target = sortedSchedule()[+b.dataset.i], real = S.schedule.indexOf(target);
      if(real > -1 && S.schedule.length > 1){ S.schedule.splice(real,1); S.session.segIndex = -1; save(); renderPlan(); }
      break;
    }
    case "show-gestures": showGestures(); break;
    case "wipe":
      if(confirm("Delete all tasks, locations and settings on this device?")){ localStorage.removeItem(KEY); location.reload(); }
      break;
  }
});
document.addEventListener("click", function(e){
  if(e.target.id === "dump-open") openSheet(sheetBrainDump(), bindBrainDump);
});

/* ============================================================
   17. WARNINGS
   ============================================================ */
function checkWarnings(){
  var m = minsOfDay(), fired = false, committed = committedTask();
  fixedToday().forEach(function(t){
    var lead = hhmmToMins(t.fixedStart) - m;
    if(!t.warned && lead <= S.settings.warnMinutes && lead > 0){
      t.warned = true; fired = true;
      chime(true);
      toast(committed ? t.name+" in "+lead+" min. Get this somewhere safe."
                      : t.name+" in "+lead+" min — start wrapping up.");
    }
    /* a genuine appointment still gets through a committed task */
    if(!t.started && lead <= 0 && lead > -3){
      t.started = true; fired = true;
      if(committed){ chime(true); toast(t.name+" is starting now."); }
    }
  });
  if(fired) save();
}

function showGestures(){

    '<div class="gkey"><b>Swipe ←</b><span>Not now</span></div>'+
    '<div class="gkey"><b>Swipe ↑</b><span>Can\'t do this yet</span></div>'+
    '<div class="gkey"><b>Swipe ↓</b><span>Add a task</span></div>'+
    '<div class="gkey"><b>Hold</b><span>Flick through everything here and pick one</span></div>'+
    '<div class="gkey"><b>Two fingers</b><span>Turn the dial to change location</span></div>'+
    '<p class="hint">Or grab the edge of the orb and turn it like a dial.</p>'+

  el.querySelector("#g-close").addEventListener("click", function(){
    el.remove(); S.profile.sawGestures = true; save();
  });
}

/* ============================================================
   19. NAV + BOOT
   ============================================================ */
function go(tab){
  S.ui.tab = tab; save();
  ["now","plan","list","done","you"].forEach(function(t){
    document.getElementById("scr-"+t).classList.toggle("is-on", t === tab);
  });
  document.querySelectorAll(".tab").forEach(function(b){ b.setAttribute("aria-selected", String(b.dataset.tab === tab)); });
  render();
  window.scrollTo(0, 0);
}
document.querySelectorAll(".tab").forEach(function(b){ b.addEventListener("click", function(){ go(b.dataset.tab); }); });
document.getElementById("backdrop").addEventListener("click", function(){ if(S.focus && S.focus.rang) return; closeSheet(); });
document.addEventListener("keydown", function(e){ if(e.key === "Escape"){ if(!(S.focus && S.focus.rang)) closeSheet(); } });

/* renders never move the page under you */
function render(){
  var y = window.scrollY;
  renderChips();
  var tab = S.ui.tab || "now";
  if(tab === "now") renderNow(true);
  if(tab === "plan") renderPlan();
  if(tab === "list") renderList();
  if(tab === "done") renderDone();
  if(tab === "you") renderYou();
  if(window.scrollY !== y) window.scrollTo(0, y);
}

setInterval(function(){
  checkWarnings();
  var moved = applySchedule();
  if(moved) applyHue();
  if(S.ui.tab === "now" && !S.focus && !Orb.spinning && !Orb.bezel && !Orb.swipe) renderNow();
  renderChips();
}, 15000);

document.addEventListener("visibilitychange", function(){
  if(document.visibilityState !== "visible") return;
  checkWarnings();
  if(applySchedule()) applyHue();
  if(S.focus) startTicker(); else if(S.ui.tab === "now") renderNow(true);
  renderChips();
});
window.addEventListener("resize", function(){ orbLayout(); if(Pick.on) layoutPicker(); });
document.addEventListener("pointerdown", function(e){
  if(Pick.on && !e.target.closest("#orb")) closePicker();
}, true);

if(!CAN_STORE){
  var warn = document.createElement("div");
  warn.className = "nostore";
  warn.innerHTML = '<b>This copy can\'t save.</b> Your browser blocks storage for files opened from disk, so today\'s list disappears when you close the tab. Open ONE from its web address instead and it will remember everything.'+
                   '<button class="icon-btn" aria-label="Dismiss">✕</button>';
  warn.querySelector("button").addEventListener("click", function(){ warn.remove(); });
  document.querySelector("main").prepend(warn);
}

/* the offline shell tells the page when a newer build is sitting ready */
window.__oneToast = toast;

applySchedule();
applyHue();
checkWarnings();
go(S.ui.tab || "now");
if(S.focus) startTicker();
if(!S.profile.sawGestures && S.session.started) showGestures();
})();
</script>
<script>
/* Served over https (GitHub Pages), ONE installs to the home screen and keeps
   working with no signal. Anywhere else this is a no-op.

   The ?v= stamp changes on every build, so the browser can't quietly hand back
   yesterday's worker - a new deploy is a new URL and always installs. When the
   replacement is ready and waiting, say so rather than silently swapping the
   app out from under a running timer. */
(function () {
  if (!('serviceWorker' in navigator) || location.protocol !== 'https:') return;
  var BUILD = '20260827-1114-449568';
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js?v=' + BUILD).then(function (reg) {
      function watch(sw) {
        if (!sw) return;
        sw.addEventListener('statechange', function () {
          if (sw.state === 'installed' && navigator.serviceWorker.controller) {
            var t = window.__oneToast;
            if (t) t('New version ready', function () { location.reload(); }, 'update');
          }
        });
      }
      watch(reg.installing);
      reg.addEventListener('updatefound', function () { watch(reg.installing); });
      reg.update();
    }).catch(function () {});
  });
})();
</script>
