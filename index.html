<style>
/* ============================================================
   ONE — tokens
   Neutrals take their hue from wherever you are: --loc-h is the
   current location's hue, so the whole app shifts when you spin.
   Orange belongs to the orb and to acting now. Periwinkle is
   everything away from the desk. Mint is done.
   ============================================================ */
:root{
  --loc-h:22;
  --orb-h:22;
  --bg:hsl(var(--loc-h) 18% 93%);
  --surface:hsl(var(--loc-h) 30% 98.5%);
  --raised:hsl(var(--loc-h) 20% 95.5%);
  --ink:hsl(var(--loc-h) 26% 10%);
  --ink-2:hsl(var(--loc-h) 14% 33%);
  --muted:hsl(var(--loc-h) 10% 52%);
  --line:hsl(var(--loc-h) 22% 20% / .14);
  --line-2:hsl(var(--loc-h) 22% 20% / .07);
  --hi:#DC4B08; --hi-ink:#FFFFFF; --hi-soft:rgba(220,75,8,.10);
  --cool:#4E5BD1; --cool-soft:rgba(78,91,209,.10);
  --good:#0E8F60; --good-soft:rgba(14,143,96,.10);
  --shadow:0 1px 2px hsl(var(--loc-h) 30% 10% / .06), 0 8px 24px -12px hsl(var(--loc-h) 30% 10% / .18);
  --shadow-lg:0 2px 4px hsl(var(--loc-h) 30% 10% / .06), 0 24px 48px -20px hsl(var(--loc-h) 30% 10% / .28);
  --orb-glow:hsl(var(--orb-h) 96% 48% / .40);
  --sky-1:hsl(var(--loc-h) 26% 88%); --sky-2:hsl(var(--loc-h) 20% 91%); --star:hsl(var(--loc-h) 40% 34%);
  --r:14px; --r-lg:20px;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  --mono:"Sometype Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:hsl(var(--loc-h) 20% 6.5%);
    --surface:hsl(var(--loc-h) 16% 11%);
    --raised:hsl(var(--loc-h) 14% 16%);
    --ink:hsl(var(--loc-h) 18% 94%);
    --ink-2:hsl(var(--loc-h) 12% 76%);
    --muted:hsl(var(--loc-h) 10% 58%);
    --line:hsl(var(--loc-h) 30% 92% / .11);
    --line-2:hsl(var(--loc-h) 30% 92% / .055);
    --hi:#FF6B1F; --hi-ink:#140B04; --hi-soft:rgba(255,107,31,.14);
    --cool:#98A5FF; --cool-soft:rgba(152,165,255,.14);
    --good:#46D39B; --good-soft:rgba(70,211,155,.14);
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px -14px rgba(0,0,0,.8);
    --shadow-lg:0 2px 6px rgba(0,0,0,.5), 0 30px 60px -24px rgba(0,0,0,.9);
    --orb-glow:hsl(var(--orb-h) 100% 56% / .34);
  --sky-1:hsl(232 42% 11%); --sky-2:hsl(230 40% 7%); --star:#EAF0FF;
  }
}
:root[data-theme="dark"]{
  --bg:hsl(var(--loc-h) 20% 6.5%);
  --surface:hsl(var(--loc-h) 16% 11%);
  --raised:hsl(var(--loc-h) 14% 16%);
  --ink:hsl(var(--loc-h) 18% 94%);
  --ink-2:hsl(var(--loc-h) 12% 76%);
  --muted:hsl(var(--loc-h) 10% 58%);
  --line:hsl(var(--loc-h) 30% 92% / .11);
  --line-2:hsl(var(--loc-h) 30% 92% / .055);
  --hi:#FF6B1F; --hi-ink:#140B04; --hi-soft:rgba(255,107,31,.14);
  --cool:#98A5FF; --cool-soft:rgba(152,165,255,.14);
  --good:#46D39B; --good-soft:rgba(70,211,155,.14);
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px -14px rgba(0,0,0,.8);
  --shadow-lg:0 2px 6px rgba(0,0,0,.5), 0 30px 60px -24px rgba(0,0,0,.9);
  --orb-glow:hsl(var(--orb-h) 100% 56% / .34);
  --sky-1:hsl(232 42% 11%); --sky-2:hsl(230 40% 7%); --star:#EAF0FF;
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--body);font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  transition:background-color .7s ease, color .7s ease;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hi);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}}

.app{max-width:540px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);position:relative;transition:background-color .7s ease}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:14px 18px 10px;backdrop-filter:blur(14px)}
.mark{font-family:var(--display);font-variation-settings:'wdth' 78,'wght' 900;font-size:19px;letter-spacing:.10em;line-height:1;color:var(--ink);opacity:.85}
.mark span{color:var(--hi)}
.topbar-spacer{flex:1}
.statchips{display:flex;gap:6px;justify-content:flex-end}
.statchip{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);background:transparent;white-space:nowrap;cursor:pointer;max-width:44vw;overflow:hidden;text-overflow:ellipsis}
.statchip:hover{border-color:var(--hi);color:var(--ink)}
.statchip.is-hi{color:var(--hi);border-color:color-mix(in srgb,var(--hi) 42%,transparent);background:var(--hi-soft)}
.statchip.is-cool{color:var(--cool);border-color:color-mix(in srgb,var(--cool) 42%,transparent);background:var(--cool-soft)}

main{flex:1;padding:6px 18px 150px;display:flex;flex-direction:column}
.screen{display:none;flex-direction:column;gap:16px}
.screen.is-on{display:flex;animation:rise .3s ease both}
#scr-now.is-on{justify-content:center;min-height:calc(100vh - 230px);gap:0}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:0;text-align:center}
.eyebrow.hot{color:var(--hi)} .eyebrow.cool{color:var(--cool)} .eyebrow.left{text-align:left}
h1.big{font-family:var(--display);font-variation-settings:'wdth' 84,'wght' 800;font-size:clamp(1.9rem,8vw,2.6rem);line-height:.95;letter-spacing:-.02em;text-transform:uppercase;margin:0;text-wrap:balance}
h2.sec{font-family:var(--display);font-variation-settings:'wdth' 88,'wght' 700;font-size:14px;letter-spacing:.1em;text-transform:uppercase;margin:0;color:var(--ink-2)}
.lede{color:var(--ink-2);margin:0;max-width:60ch}
.hint{font-size:13.5px;color:var(--muted);margin:0}
.stack{display:flex;flex-direction:column;gap:10px}
.divider{height:1px;background:var(--line-2);border:0;margin:2px 0}

.coach{display:flex;gap:10px;align-items:flex-start;padding:13px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.coach-mark{font-family:var(--display);font-variation-settings:'wdth' 75,'wght' 900;font-size:11px;letter-spacing:.08em;color:var(--hi);border:1.5px solid var(--hi);border-radius:5px;padding:2px 4px;line-height:1;margin-top:2px;flex:none}
.coach-lines{display:flex;flex-direction:column;gap:3px;font-size:15px;color:var(--ink)}
.coach-lines b{font-weight:700}

/* ============================================================
   THE ORB
   ============================================================ */
.orb-stage{
  --orb:min(88vw, 54vh, 460px);
  position:relative;width:calc(100% + 36px);margin:0 -18px;height:calc(var(--orb) + 62px);
  display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none;
}
.orb-float{position:absolute;inset:0;animation:float 11s ease-in-out infinite;will-change:transform}
@keyframes float{0%,100%{transform:translateY(-5px)}50%{transform:translateY(6px)}}
/* One ramp, any colour. --orb-h comes from the location you're in, so the
   sphere is the same object wherever you are, wearing that place's colour. */
/* ---------- the world you're standing on ----------
   Exactly the same recipe as the little planet out in the system, so flying to
   it can hand one over to the other without anything appearing to change. */
.orb{
  position:absolute;inset:0;border-radius:50%;overflow:hidden;isolation:isolate;
  background:radial-gradient(circle at 50% 50%, hsl(var(--orb-h) 70% 42%), hsl(calc(var(--orb-h) - 8) 80% 20%));
  box-shadow:0 34px 74px -26px var(--orb-glow);
  transition:box-shadow .5s ease;touch-action:none;
}
.orb::after{
  content:"";position:absolute;inset:0;border-radius:50%;z-index:3;pointer-events:none;
  background:
    radial-gradient(circle at 30% 24%, rgba(255,255,255,.4), rgba(255,255,255,0) 46%),
    radial-gradient(circle at 74% 78%, rgba(2,2,10,.7), rgba(2,2,10,0) 58%);
  box-shadow:inset -14px -18px 50px -18px rgba(0,0,6,.8), inset 4px 6px 22px -14px rgba(255,255,255,.5);
}
.orb.icy{background:radial-gradient(circle at 38% 32%, #FFFFFF 0%, hsl(var(--orb-h) 92% 78%) 26%, hsl(var(--orb-h) 88% 56%) 60%, hsl(calc(var(--orb-h) - 6) 86% 34%) 100%)}
.orb.rock{background:radial-gradient(circle at 34% 28%, hsl(calc(var(--orb-h) + 16) 42% 62%), hsl(var(--orb-h) 34% 38%) 56%, hsl(calc(var(--orb-h) - 10) 40% 16%))}

/* ---------- the moon: the one thing you're doing ----------
   It hangs between you and the world, like an eclipse seen from the sun. The
   planet stays where it is; the moon is what you push around. */
.orb-wrap{position:relative;width:var(--orb);height:var(--orb);display:grid;place-items:center;transform:translateY(-16px)}
.moon{
  position:absolute;left:50%;top:50%;width:60%;aspect-ratio:1;
  transform:translate(-50%,-50%);
  border-radius:50%;display:grid;place-items:center;z-index:5;cursor:grab;touch-action:none;
  background:radial-gradient(circle at 33% 27%, #FFFEFA 0%, #F1EEE6 26%, #D8D4C9 56%, #A9A599 82%, #7C7970 100%);
  box-shadow:
    0 24px 48px -18px rgba(0,0,8,.72),
    inset -10px -14px 30px -12px rgba(20,18,14,.55),
    inset 6px 8px 18px -10px rgba(255,255,255,.9),
    0 0 34px 2px hsl(var(--orb-h) 96% 60% / .28);
  animation:moonfloat 13s ease-in-out infinite;
}
@keyframes moonfloat{0%,100%{transform:translate(-50%,-50%) translateY(-4px)}50%{transform:translate(-50%,-50%) translateY(5px)}}
.moon:active{cursor:grabbing}
.moon.cool{background:radial-gradient(circle at 33% 27%, #F4F6FF 0%, #DDE2FF 30%, #B9C2F4 62%, #8E97CE 100%)}
.moon.clear{background:radial-gradient(circle at 33% 27%, #F2FFF9 0%, #D6F5E7 30%, #A9E2C8 62%, #79B69C 100%)}
.moon-crater{position:absolute;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 38% 34%, rgba(120,116,104,.36), rgba(160,156,144,.12) 62%, transparent 100%);
  box-shadow:inset 1px 1px 2px rgba(255,255,255,.5)}
/* the flag: a pole planted in the rock and a pennant that stirs */
.moon-flag{position:absolute;left:71%;top:12%;width:2px;height:26%;z-index:5;
  background:linear-gradient(180deg,#4A463D,#6E6A60);border-radius:2px;
  box-shadow:0 1px 2px rgba(0,0,0,.35)}
.moon-flag .pennant{
  position:absolute;left:2px;top:0;width:min(40px,7.6vw);height:min(26px,5vw);
  clip-path:polygon(0 0, 100% 50%, 0 100%);
  transform-origin:0 50%;animation:flutter 3.4s ease-in-out infinite;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.3));
}
@keyframes flutter{0%,100%{transform:scaleX(1) skewY(0deg)}50%{transform:scaleX(.9) skewY(-3deg)}}
.moon-flag.late .pennant{background:linear-gradient(90deg,#E5484D,#B4232A)}
.moon-flag.today .pennant{background:linear-gradient(90deg,#FF7A1F,#D8500A)}
.moon-flag.imp .pennant{background:linear-gradient(90deg,#F2C13D,#C99310)}
.moon-flag.sm{left:74%;top:13%;height:19%;width:1.5px}
.moon-flag.sm .pennant{width:min(22px,4.2vw);height:min(14px,2.8vw)}
.moon-crater.c1{width:19%;height:19%;left:15%;top:58%}
.moon-crater.c2{width:11%;height:11%;left:68%;top:24%}
.moon-crater.c3{width:8%;height:8%;left:52%;top:76%}
.moon-ring{position:absolute;inset:-7%;width:114%;height:114%;transform:rotate(-90deg);opacity:0;transition:opacity .3s ease;pointer-events:none}
.moon-ring.running{opacity:1}
.moon-ring .t-track{fill:none;stroke:var(--line);stroke-width:2}
.moon-ring .t-prog{fill:none;stroke:var(--hi);stroke-width:3.5;stroke-linecap:round;transition:stroke-dashoffset .6s linear}
/* the moon leaving, and the next one arriving */
.moon.go-up{animation:moonup .42s cubic-bezier(.4,0,.7,.3) both}
.moon.go-left{animation:moonleft .42s cubic-bezier(.4,0,.7,.3) both}
@keyframes moonup{to{transform:translate(-50%,-50%) translateY(-95vh) scale(.35);opacity:0}}
@keyframes moonleft{to{transform:translate(-50%,-50%) translate(-95vw,-8vh) scale(.4) rotate(-22deg);opacity:0}}
.moon.arrive{animation:moonin .62s cubic-bezier(.18,.86,.28,1) both}
@keyframes moonin{
  0%{transform:translate(-50%,-50%) translateY(78vh) scale(.5);opacity:0}
  100%{transform:translate(-50%,-50%) translateY(0) scale(1);opacity:1}
}
/* ---------- the rolodex of moons ----------
   Press and hold and this world's tasks come round on a wheel, each one the
   moon it would be if you chose it. */
.orb-pick{position:absolute;inset:0;z-index:8;touch-action:none}
.pick-item{
  position:absolute;left:50%;top:50%;width:56%;aspect-ratio:1;border-radius:50%;
  appearance:none;border:0;cursor:pointer;color:#191712;padding:8% 11%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  background:radial-gradient(circle at 33% 27%, #FFFEFA 0%, #F1EEE6 26%, #D8D4C9 56%, #A9A599 82%, #7C7970 100%);
  box-shadow:0 18px 36px -16px rgba(0,0,8,.7), inset -8px -11px 24px -10px rgba(20,18,14,.5),
             inset 5px 6px 14px -8px rgba(255,255,255,.9);
  transform-origin:50% 50%;will-change:transform,opacity;
}
.pick-item b{
  font-family:var(--display);font-variation-settings:'wdth' 76,'wght' 900;
  font-size:clamp(.8rem,3.7vw,1.04rem);line-height:1.02;text-transform:uppercase;text-align:center;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.pick-item small{font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;opacity:.62;text-align:center}
.pick-item.on b{filter:url(#inkwarp)}
.orb.picking{cursor:ns-resize}
.orb-stage.picking .moon{opacity:0!important;transform:translate(-50%,-50%) scale(.72)!important;transition:opacity .2s ease,transform .25s ease;animation:none!important}

/* a captured task drops into the world it belongs to */
.newmoon{
  position:fixed;left:50%;bottom:16vh;width:26px;height:26px;border-radius:50%;z-index:45;pointer-events:none;
  background:radial-gradient(circle at 34% 30%, #FFFEFA, #CFCBC0 70%, #8B887F);
  animation:newmoon .95s cubic-bezier(.3,.1,.2,1) both;
}
@keyframes newmoon{
  0%{transform:translate(-50%,40px) scale(.4);opacity:0}
  22%{opacity:1}
  100%{transform:translate(-50%,-44vh) scale(.16);opacity:0}
}

.orb-face{
  position:relative;z-index:4;width:84%;text-align:center;color:#191712;
  display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:none;
  transition:opacity .26s ease, transform .34s cubic-bezier(.2,.8,.25,1), filter .26s ease;
}
.orb-face.surfacing{animation:surface .68s cubic-bezier(.16,.84,.3,1) both}
@keyframes surface{
  0%{opacity:0;transform:translateY(26px) scale(.78);filter:blur(18px)}
  45%{opacity:.9;transform:translateY(4px) scale(1.03);filter:blur(3px)}
  70%{transform:translateY(0) scale(.995);filter:blur(0)}
  100%{opacity:1;transform:none;filter:blur(0)}
}
.orb-task{
  font-family:var(--display);font-variation-settings:'wdth' 74,'wght' 900;
  font-size:clamp(1.02rem,5.1vw,1.44rem);line-height:1.02;letter-spacing:-.006em;
  text-transform:uppercase;text-wrap:balance;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;
  text-shadow:0 1px 0 rgba(255,255,250,.55), 0 -1px 1px rgba(60,56,48,.22);
  filter:url(#inkwarp);
}
@media (prefers-reduced-motion:reduce){ .orb-task{filter:none} }
.orb-sub{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;opacity:.66}
.orb-clock{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums;font-size:clamp(1.9rem,9vw,2.4rem);letter-spacing:-.03em;line-height:1}
.orb-count{font-family:var(--display);font-variation-settings:'wdth' 80,'wght' 900;font-size:clamp(2.4rem,12vw,3.2rem);line-height:.9;font-variant-numeric:tabular-nums}

/* one ring, two meanings: the day when idle, the countdown when running */
.orb-ring{position:absolute;inset:-15px;pointer-events:none;transform:rotate(-90deg);z-index:2}
.orb-ring circle{fill:none;stroke-width:3;stroke-linecap:round}
.orb-ring .t-track{stroke:var(--line)}
.orb-ring .t-prog{stroke:var(--ink-2);opacity:.5;transition:stroke-dashoffset .6s cubic-bezier(.3,.9,.4,1)}
.orb-ring.running .t-prog{stroke:var(--hi);opacity:1;stroke-width:4;transition:stroke-dashoffset .5s linear}
.orb-ring.over .t-prog{stroke:var(--cool)}

.swipe-hint{position:absolute;z-index:4;font-family:var(--display);font-variation-settings:'wdth' 90,'wght' 800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);opacity:0;transition:opacity .16s ease;pointer-events:none;white-space:nowrap}
.swipe-hint.on{opacity:1}
.swipe-hint.l{left:2px;top:46%;transform:translateY(-50%)}
.swipe-hint.r{right:2px;top:46%;transform:translateY(-50%);color:var(--good)}
.swipe-hint.u{top:4px;left:50%;transform:translateX(-50%);color:var(--cool)}
.swipe-hint.d{bottom:4px;left:50%;transform:translateX(-50%)}

/* ---------- the solar system ----------
   A place, not a menu. Everything here turns: the whole field makes one
   revolution a day, so the sky you see at four in the afternoon isn't the sky
   you saw at nine. Nothing moves fast enough to distract you. */
.sky{
  position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:radial-gradient(circle at 50% 38%, var(--sky-1), var(--sky-2) 62%, transparent 78%);
  opacity:0;animation:skyin 1.1s ease forwards;
}
@keyframes skyin{to{opacity:1}}
.star{
  position:absolute;border-radius:50%;background:var(--star);
  animation:twinkle var(--tw,4s) ease-in-out infinite;animation-delay:var(--td,0s);
}
@keyframes twinkle{0%,100%{opacity:var(--o,.5);transform:scale(1)}50%{opacity:calc(var(--o,.5) * .25);transform:scale(.72)}}
/* the occasional visitor: a head, a tail, and a long wait in between */
.shooter{
  position:absolute;width:2px;height:2px;border-radius:50%;background:var(--star);
  box-shadow:0 0 6px 2px var(--star);
  opacity:0;animation:shoot var(--dur,26s) linear infinite;animation-delay:var(--sd,0s);
}
/* the tail is drawn straight back along the direction of travel, never across it */
.shooter::after{
  content:"";position:absolute;left:0;top:50%;width:var(--tail,120px);height:1.6px;
  transform-origin:0 50%;transform:translateY(-50%) rotate(var(--ang,0deg));
  background:linear-gradient(90deg, var(--star), transparent);border-radius:2px;
}
@keyframes shoot{
  0%{opacity:0;transform:translate(0,0)}
  1%{opacity:.9}
  9%{opacity:.9;transform:translate(var(--sx,-70vw), var(--sy,42vh))}
  10%,100%{opacity:0;transform:translate(var(--sx,-70vw), var(--sy,42vh))}
}

.sys{
  position:relative;width:min(94vw,420px);aspect-ratio:1;margin:2vh auto 0;z-index:1;
  transform-origin:50% 50%;
}
/* nothing behind the sky, everything else in front of it — and while you're out
   in the system the app column goes transparent so the sky is the background */
#sky{z-index:0}
.app{position:relative;z-index:1}
body.in-space .app{background:transparent}
.sysview{display:flex;flex-direction:column;justify-content:center;min-height:calc(100vh - 210px)}
/* The flight: the camera pulls back for a beat, then runs at the world you
   picked — which slides to the middle of the screen as you close on it. */
/* --- what makes travel read as one move, not two animations ---
   The system you left is lifted out of the page and thrown past the camera,
   while the sphere you're arriving at grows from exactly where that little
   planet was. Both happen at once, so nothing ever cuts. */
.lift{position:fixed;z-index:30;pointer-events:none;transform-origin:var(--ox,50%) var(--oy,50%)}
.lift-sys{transition:transform 1.5s cubic-bezier(.4,0,.5,1), opacity 1.15s ease .18s}
.lift-sys.gone{transform:scale(7.5);opacity:0}
.lift-sys .body-name,.lift-sys .orbit{opacity:0;transition:opacity .4s ease}
.lift-planet{transform-origin:50% 50%;z-index:31}
.sys .body-name,.sys .orbit{transition:opacity .5s ease .55s}
.sys.zooming .body-name,.sys.zooming .orbit{opacity:0;transition:opacity .12s ease}
.lift-orb{transform-origin:50% 50%}
.lift-orb.thrown{animation:catapult .75s cubic-bezier(.24,.6,.32,1) both}
/* on the way, the page holds its breath: no words until you've arrived */
#nowRoot.approaching .orb-float,
#nowRoot.approaching .moon,
#nowRoot.approaching .orb-face,
#nowRoot.approaching .why,
#nowRoot.approaching .runway,
#nowRoot.approaching .dayline,
#nowRoot.approaching .eyebrow,
#nowRoot.approaching .swipe-hint,
#nowRoot.approaching .pull-note,
#nowRoot.approaching .orb-ring{opacity:0!important;transition:none}
/* The world breathes. Hold that breath while something is flying towards it, or
   the traveller aims at where the orb was a second ago and lands with a jolt.
   -5px is the animation's own 0% frame, so letting go doesn't move it either. */
#nowRoot.approaching .orb-float{animation:none!important;transform:translateY(-5px)!important}
#nowRoot .why,#nowRoot .runway,#nowRoot .dayline,#nowRoot .eyebrow{transition:opacity .5s ease .15s}
.sky.warp .star{animation:none;opacity:.9;transition:transform 2.2s cubic-bezier(.6,0,.9,.4), opacity 2.2s ease}
.sky.warp .shooter{opacity:0}

.orbit{
  position:absolute;left:50%;top:50%;border-radius:50%;pointer-events:none;
  border:1px solid var(--line-2);transform:translate(-50%,-50%);
}
.orbit.o1{width:64%;height:64%}
.orbit.o2{width:80%;height:80%;border-style:dashed;opacity:.55}

/* One field, one revolution a day. It isn't animated — the angle is read off
   the clock and nudged every few seconds, so the sky is genuinely where the
   time of day says it should be and nothing burns battery drawing it. */
.orbit-field{position:absolute;inset:0;transform:rotate(0deg);transition:transform 1.2s linear}
/* each slot is a full-size rotating frame, so it must not swallow taps meant
   for the world underneath it */
.slot{position:absolute;inset:0;transform:rotate(var(--a));pointer-events:none}
.slot > .body{pointer-events:auto}
.body{
  position:absolute;left:50%;top:calc(50% - var(--r));width:var(--sz);
  transform:translate(-50%,-50%) rotate(calc(-1 * var(--a)));
  appearance:none;background:none;border:0;padding:0;cursor:pointer;
}
.upright{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  transform:rotate(0deg);transition:transform 1.2s linear;
}
.body-orb{
  position:relative;width:100%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  overflow:hidden;isolation:isolate;
  background:radial-gradient(circle at 50% 50%, hsl(var(--orb-h) 70% 42%), hsl(calc(var(--orb-h) - 8) 80% 20%));
  box-shadow:0 16px 40px -16px hsl(var(--orb-h) 96% 50% / .55);
}
/* the light: one sun, so one highlight and one terminator on every world */
.body-orb::after{
  content:"";position:absolute;inset:0;border-radius:50%;z-index:3;pointer-events:none;
  background:
    radial-gradient(circle at 30% 24%, rgba(255,255,255,.42), rgba(255,255,255,0) 46%),
    radial-gradient(circle at 74% 78%, rgba(2,2,10,.72), rgba(2,2,10,0) 58%);
  box-shadow:inset -6px -8px 22px -8px rgba(0,0,6,.75), inset 2px 3px 10px -6px rgba(255,255,255,.5);
}
.tex{position:absolute;inset:0;border-radius:50%;z-index:1;overflow:hidden}
.body:active .upright{transform:scale(.96)}
.body-name{
  font-family:var(--display);font-variation-settings:'wdth' 84,'wght' 800;
  font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap;
}
.sys .body.chosen{z-index:5}
.sys .body.chosen .body-orb{box-shadow:0 0 60px 10px hsl(var(--orb-h) 96% 55% / .5)}

/* ---------- the sun ----------
   Granulation, a couple of spots and a corona that breathes. */
.body.sun{cursor:pointer}
.body.sun .body-orb{
  background:radial-gradient(circle at 50% 50%, #FFF8E6 0%, #FFE9A8 22%, #FFC24A 46%, #FF8A12 72%, #E85D02 89%, #B93C00 100%);
  box-shadow:0 0 40px 6px rgba(255,168,40,.35), 0 0 110px 26px rgba(255,120,10,.16);
  animation:corona 9s ease-in-out infinite;overflow:visible;
}
@keyframes corona{
  0%,100%{box-shadow:0 0 38px 5px rgba(255,168,40,.32), 0 0 100px 22px rgba(255,120,10,.14)}
  50%{box-shadow:0 0 58px 12px rgba(255,190,70,.46), 0 0 140px 38px rgba(255,120,10,.22)}
}
.body.sun .body-orb::after{
  background:radial-gradient(circle at 50% 50%, rgba(255,255,255,0) 62%, rgba(180,60,0,.35) 100%);
  box-shadow:none;
}
.sun-tex{
  position:absolute;inset:-6%;border-radius:50%;z-index:1;
  background:
    radial-gradient(closest-side circle at 32% 38%, rgba(120,30,0,.55), transparent 100%),
    radial-gradient(closest-side circle at 66% 60%, rgba(140,40,0,.45), transparent 100%),
    radial-gradient(closest-side circle at 54% 24%, rgba(255,255,220,.55), transparent 100%),
    radial-gradient(closest-side circle at 24% 68%, rgba(255,240,180,.4), transparent 100%);
  background-size:26% 18%, 18% 13%, 30% 22%, 24% 16%;
  background-repeat:no-repeat;
  filter:blur(2px);opacity:.85;
  animation:granul 34s ease-in-out infinite alternate;
}
@keyframes granul{
  0%{background-position:30% 40%, 64% 58%, 52% 22%, 22% 66%}
  100%{background-position:38% 46%, 58% 52%, 60% 30%, 30% 60%}
}
/* a flare licking off the limb */
.sun-flare{
  position:absolute;inset:-26%;border-radius:50%;z-index:0;pointer-events:none;
  background:conic-gradient(from 0deg, transparent 0deg, rgba(255,170,50,.34) 14deg, transparent 34deg,
             transparent 180deg, rgba(255,140,30,.26) 196deg, transparent 220deg);
  filter:blur(9px);
  animation:flare 46s linear infinite;
}
@keyframes flare{to{transform:rotate(360deg)}}
.sun-num{font-family:var(--display);font-variation-settings:'wdth' 80,'wght' 900;font-size:clamp(1.6rem,7.6vw,2.3rem);
  line-height:.9;color:#5B2600;font-variant-numeric:tabular-nums;position:relative;z-index:4}
.sun-sub{font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:#7A3703;position:relative;z-index:4}

/* ---------- Work: a banded gas giant ---------- */
/* Zones and belts: wide creamy bands, narrow dark ones, every edge soft. The
   layer is drawn taller than the sphere and drifts sideways, so what you see is
   a slice of a much bigger weather system. */
.gas .tex{
  background:linear-gradient(180deg,
    hsl(calc(var(--orb-h) + 16) 78% 74%) 0%,
    hsl(calc(var(--orb-h) + 10) 72% 66%) 7%,
    hsl(calc(var(--orb-h) - 4) 68% 40%) 15%,
    hsl(calc(var(--orb-h) + 12) 76% 71%) 24%,
    hsl(calc(var(--orb-h) + 14) 74% 76%) 33%,
    hsl(calc(var(--orb-h) - 6) 66% 36%) 41%,
    hsl(calc(var(--orb-h) + 2) 74% 58%) 48%,
    hsl(calc(var(--orb-h) + 12) 76% 72%) 57%,
    hsl(calc(var(--orb-h) - 2) 70% 46%) 66%,
    hsl(calc(var(--orb-h) - 8) 64% 32%) 73%,
    hsl(calc(var(--orb-h) + 10) 74% 68%) 82%,
    hsl(calc(var(--orb-h) + 4) 72% 60%) 90%,
    hsl(calc(var(--orb-h) - 4) 68% 42%) 100%);
  filter:blur(1.1px);
}
.gas .spot{
  position:absolute;top:63%;width:30%;height:13%;border-radius:50%;z-index:2;
  background:radial-gradient(circle at 42% 42%, hsl(calc(var(--orb-h) - 12) 82% 58%), hsl(calc(var(--orb-h) - 16) 76% 32%) 72%);
  box-shadow:0 0 8px 2px hsl(calc(var(--orb-h) - 16) 80% 26% / .5) inset;
  filter:blur(1px);animation:spotdrift 260s linear infinite;
}
@keyframes spotdrift{0%{left:-34%}100%{left:104%}}

/* ---------- Home: a lived-on world ---------- */
.world .tex{
  background:
    radial-gradient(closest-side ellipse at 30% 34%, hsl(var(--orb-h) 54% 42%) 0%, hsl(var(--orb-h) 54% 42%) 60%, transparent 100%),
    radial-gradient(closest-side ellipse at 66% 62%, hsl(calc(var(--orb-h) + 14) 48% 34%) 0%, hsl(calc(var(--orb-h) + 14) 48% 34%) 56%, transparent 100%),
    radial-gradient(closest-side ellipse at 52% 10%, rgba(240,248,255,.92) 0%, transparent 100%),
    radial-gradient(closest-side ellipse at 48% 94%, rgba(235,246,255,.9) 0%, transparent 100%),
    linear-gradient(#1E5FA8, #0E3568);
  background-size:46% 34%, 38% 26%, 40% 14%, 44% 12%, 100% 100%;
  background-repeat:no-repeat;
  background-position:26% 34%, 64% 62%, 50% 4%, 50% 96%, 0 0;
  animation:worldturn 180s linear infinite;
}
@keyframes worldturn{
  0%{background-position:-40% 34%, 10% 62%, 50% 4%, 50% 96%, 0 0}
  100%{background-position:120% 34%, 170% 62%, 50% 4%, 50% 96%, 0 0}
}
.world .clouds{
  position:absolute;inset:0;border-radius:50%;z-index:2;
  background:
    radial-gradient(closest-side ellipse at 20% 40%, rgba(255,255,255,.62), transparent 100%),
    radial-gradient(closest-side ellipse at 60% 26%, rgba(255,255,255,.5), transparent 100%),
    radial-gradient(closest-side ellipse at 78% 66%, rgba(255,255,255,.45), transparent 100%);
  background-size:42% 16%, 34% 12%, 38% 14%;background-repeat:no-repeat;
  filter:blur(1.5px);opacity:.75;
  animation:cloudturn 130s linear infinite;
}
@keyframes cloudturn{
  0%{background-position:-40% 40%, 20% 24%, 60% 68%}
  100%{background-position:140% 40%, 200% 24%, 240% 68%}
}
/* the night side has the lights on */
.world .lights{
  position:absolute;inset:0;border-radius:50%;z-index:2;pointer-events:none;
  background:
    radial-gradient(circle at 78% 70%, rgba(255,214,140,.9) 0.7px, transparent 1.4px),
    radial-gradient(circle at 84% 62%, rgba(255,206,130,.8) 0.6px, transparent 1.3px),
    radial-gradient(circle at 72% 80%, rgba(255,220,150,.75) 0.6px, transparent 1.2px),
    radial-gradient(circle at 88% 74%, rgba(255,200,120,.7) 0.5px, transparent 1.1px);
  animation:citypulse 6s ease-in-out infinite;
}
@keyframes citypulse{0%,100%{opacity:.75}50%{opacity:1}}

/* ---------- Projects: a little belt of your own things ---------- */
.body.belt .body-orb{background:none;box-shadow:none;overflow:visible;animation:beltturn 300s linear infinite}
.body.belt .body-orb::after{display:none}
@keyframes beltturn{to{transform:rotate(360deg)}}
.belt-rock{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle at 34% 28%, hsl(calc(var(--orb-h) + 16) 42% 62%), hsl(var(--orb-h) 34% 38%) 56%, hsl(calc(var(--orb-h) - 10) 40% 16%));
  box-shadow:0 4px 12px -6px hsl(var(--orb-h) 60% 30% / .8), inset -3px -4px 8px -3px rgba(0,0,8,.85);
}
.belt-rock::after{
  content:"";position:absolute;left:52%;top:26%;width:22%;height:22%;border-radius:50%;
  background:hsl(calc(var(--orb-h) - 10) 30% 22% / .6);box-shadow:inset 1px 1px 2px rgba(0,0,0,.5);
}
.belt-rock.r1{width:54%;height:54%;left:0;top:24%}
.belt-rock.r2{width:38%;height:38%;left:50%;top:2%}
.belt-rock.r3{width:28%;height:28%;left:62%;top:58%}

/* ---------- Errands: a comet, always on its way somewhere ---------- */
.body.comet .body-orb{
  overflow:visible;
  background:radial-gradient(circle at 38% 32%, #FFFFFF 0%, hsl(var(--orb-h) 92% 78%) 26%, hsl(var(--orb-h) 88% 56%) 60%, hsl(calc(var(--orb-h) - 6) 86% 34%) 100%);
  box-shadow:0 0 18px 4px hsl(var(--orb-h) 96% 62% / .5);
  animation:cometpulse 5s ease-in-out infinite;
}
@keyframes cometpulse{0%,100%{box-shadow:0 0 16px 3px hsl(var(--orb-h) 96% 62% / .45)}50%{box-shadow:0 0 26px 7px hsl(var(--orb-h) 96% 70% / .6)}}
/* the tail streams away from the sun, which means it follows the slot's angle
   rather than staying upright with the label */
.tail-wrap{position:absolute;left:50%;top:50%;width:100%;height:100%;pointer-events:none;z-index:-1;
  transform:translate(-50%,-50%) rotate(calc(var(--a) - 90deg))}
.comet-tail{
  position:absolute;left:46%;top:50%;width:230%;height:58%;transform:translateY(-50%);
  border-radius:50%;
  background:linear-gradient(90deg, hsl(var(--orb-h) 96% 70% / .5), hsl(var(--orb-h) 96% 66% / .14) 44%, transparent 80%);
  filter:blur(7px);
}
.comet-tail.t2{height:20%;opacity:.75;filter:blur(3px);width:180%}

/* ---------- leaving a world: wind up, then catapult ---------- */
/* the catapult: load the sling, then let it go */
@keyframes catapult{
  0%{transform:translateY(0) scale(1) rotate(0);opacity:1}
  11%{transform:translateY(56px) scale(1.05) rotate(-5deg);opacity:1}
  86%{opacity:.5}
  100%{transform:translateY(-150vh) scale(.04) rotate(38deg);opacity:0}
}
.orb-stage.pulling .orb-float{transition:none}
.pull-note{
  position:absolute;left:50%;bottom:-26px;transform:translateX(-50%) translateY(6px);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--hi);
  opacity:0;transition:opacity .18s ease,transform .18s ease;pointer-events:none;white-space:nowrap;
}
.orb-stage.armed .pull-note{opacity:1;transform:translateX(-50%) translateY(0)}
.orb-stage.armed .swipe-hint{opacity:0}
/* everything on the page leaves with the world, not after it */
#nowRoot.launching .why,#nowRoot.launching .runway,#nowRoot.launching .dayline,
#nowRoot.launching .eyebrow,#nowRoot.launching .pickup,#nowRoot.launching .committed-note{
  opacity:0;transition:opacity .3s ease;
}

@media (prefers-reduced-motion:reduce){
  .lift-sys,.lift-orb{animation-duration:.001s;transition-duration:.001s}
  .tex,.clouds,.sun-tex,.sun-flare,.star,.shooter{animation:none}
  .orbit-field,.upright{transition:none}
}

/* quick capture: one field and a row of optional afterthoughts */
.qc-chips{display:flex;gap:9px;flex-wrap:wrap}
.qc-chip{
  appearance:none;cursor:pointer;border-radius:99px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink-2);padding:11px 17px;min-height:46px;font-weight:650;font-size:14px;
  transition:border-color .14s ease,color .14s ease,background .14s ease;
}
.qc-chip[aria-pressed="true"]{color:var(--hi);border-color:color-mix(in srgb,var(--hi) 55%,transparent);background:var(--hi-soft)}
.qc-chip.ghost{color:var(--muted);border-style:dashed}
.qc-drawer{display:flex;flex-direction:column;gap:12px;padding:15px 0 3px;border-top:1px solid var(--line-2)}
.qc-drawer[hidden]{display:none}
.qc-drawer .choices{gap:9px}
/* capture is the one sheet that should never feel cramped */
#sheetRoot .qc-chips + .qc-drawer{margin-top:2px}
#sheetRoot{display:flex;flex-direction:column;gap:19px}
.sheet.capture #sheetRoot{gap:22px}
.sheet.capture .field{gap:11px}
.sheet.capture #qc-name{min-height:56px;font-size:16.5px}
.sheet.capture .hint{line-height:1.5}

.committed-note{
  margin:14px auto 0;max-width:34ch;text-align:center;
  display:flex;flex-direction:column;gap:4px;
  padding:12px 14px;border-radius:var(--r);
  border:1px solid color-mix(in srgb,var(--hi) 40%,transparent);background:var(--hi-soft);
}
.committed-note b{font-family:var(--display);font-variation-settings:'wdth' 90,'wght' 800;font-size:14px;letter-spacing:.02em;color:var(--hi)}
.committed-note span{font-size:13.5px;color:var(--ink-2);line-height:1.35}
/* the orb showing its working: one sentence, never a paragraph */
.why{text-align:center;max-width:32ch;margin:10px auto 2px;font-size:13.5px;line-height:1.4;color:var(--muted)}
.why b{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--hi);margin-right:6px}
.runway{text-align:center;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin:2px 0 0}
.dayline{text-align:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:8px 0 0}

.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:14px 16px;cursor:pointer;font-family:var(--display);font-variation-settings:'wdth' 92,'wght' 700;font-size:14px;letter-spacing:.09em;text-transform:uppercase;transition:transform .12s ease,background .16s ease,border-color .16s ease,filter .16s ease;min-height:50px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{border-color:var(--hi)}
.btn:active{transform:scale(.985)}
.btn.go{background:var(--ink);color:var(--bg);border-color:var(--ink);font-size:17px;letter-spacing:.12em;min-height:58px;font-variation-settings:'wdth' 88,'wght' 800}
.btn.go:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent}
.btn.quiet{font-family:var(--body);font-size:14px;letter-spacing:0;text-transform:none;font-variation-settings:normal;font-weight:600;color:var(--ink-2);min-height:46px}
.btn.wide{width:100%}
.btn.sm{min-height:38px;padding:8px 12px;font-size:12px}
.btn.danger:hover{border-color:var(--hi);color:var(--hi)}
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1}

.field{display:flex;flex-direction:column;gap:9px}
.field > label{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.finish-line{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-2);opacity:.8;text-align:center;margin-top:10px}
.finish-line b{font-weight:700;opacity:1}
.linky{appearance:none;background:none;border:0;padding:2px 4px;cursor:pointer;font:inherit;
  color:hsl(var(--orb-h) 80% 62%);text-decoration:underline;text-underline-offset:3px}
.choices{display:flex;gap:8px;flex-wrap:wrap}
.choice{appearance:none;cursor:pointer;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);padding:11px 13px;font-weight:600;font-size:14px;min-height:44px;transition:border-color .14s ease,color .14s ease,background .14s ease}
.choice:hover{border-color:var(--ink-2)}
.choice[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.choice.cool[aria-pressed="true"]{background:var(--cool);border-color:var(--cool);color:var(--surface)}
.choice small{display:block;font-weight:500;font-size:11.5px;opacity:.75;letter-spacing:0}
.grow{flex:1}
input[type="text"],input[type="time"],input[type="number"],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:11px;padding:13px 14px;min-height:48px}
input::placeholder,textarea::placeholder{color:var(--muted)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--hi)}
.inline{display:flex;gap:10px;align-items:center}

.mic{appearance:none;flex:none;width:50px;min-height:48px;border-radius:11px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);cursor:pointer;display:flex;align-items:center;justify-content:center}
.mic:hover{border-color:var(--hi);color:var(--hi)}
.mic svg{width:19px;height:19px;fill:currentColor}
.mic.on{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);animation:micpulse 1.5s ease-in-out infinite}
@keyframes micpulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--hi) 45%,transparent)}70%{box-shadow:0 0 0 12px transparent}}
.heard{font-size:13px;color:var(--cool);font-style:italic}
.heard:empty{display:none}
.stepper{display:flex;align-items:center;gap:8px}
.stepper .step{appearance:none;cursor:pointer;flex:none;width:52px;min-height:48px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-family:var(--mono);font-size:13px}
.stepper .step:hover{border-color:var(--hi);color:var(--hi)}
.stepper .val{flex:1;text-align:center;font-family:var(--display);font-variation-settings:'wdth' 84,'wght' 800;font-size:24px;font-variant-numeric:tabular-nums;color:var(--ink)}
.stepper .val small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-variation-settings:normal}

.slider{position:relative;height:56px;margin:0 4px;touch-action:pan-y;cursor:grab;-webkit-user-select:none;user-select:none}
.slider.grabbing{cursor:grabbing}
.slider-track{position:absolute;left:14px;right:14px;top:50%;height:5px;margin-top:-2.5px;border-radius:99px;background:var(--raised);border:1px solid var(--line)}
.slider-fill{position:absolute;left:14px;top:50%;height:5px;margin-top:-2.5px;border-radius:99px;background:color-mix(in srgb,var(--hi) 55%,transparent);transition:width .18s cubic-bezier(.3,.9,.4,1)}
.slider-snap{position:absolute;top:50%;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;background:var(--line)}

.slider.grabbing .slider-orb{transform:scale(1.14)}

.group{display:flex;flex-direction:column;gap:8px}

.count{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em}
.row{display:flex;align-items:flex-start;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px}
.row.done{opacity:.6}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.row-title{font-weight:600;font-size:15px;line-height:1.25;word-break:break-word}

.row-meta{display:flex;flex-wrap:wrap;gap:5px}
.mini{font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line-2);border-radius:6px;padding:3px 6px;background:var(--raised)}
.mini.hot{color:var(--hi);border-color:color-mix(in srgb,var(--hi) 30%,transparent);background:var(--hi-soft)}
.mini.cool{color:var(--cool);border-color:color-mix(in srgb,var(--cool) 30%,transparent);background:var(--cool-soft)}
.mini.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 30%,transparent);background:var(--good-soft)}
.icon-btn{appearance:none;background:transparent;border:1px solid var(--line);border-radius:9px;width:38px;height:38px;flex:none;cursor:pointer;color:var(--ink-2);font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center}

.row-actions{display:flex;gap:6px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px 18px;text-align:center;color:var(--muted);font-size:14px;background:var(--surface)}

.timeline{position:relative;display:flex;gap:12px;padding:4px 0 10px}
.tl-rail{position:relative;width:14px;flex:none;border-radius:99px;overflow:hidden;background:var(--raised)}
.tl-band{position:absolute;left:0;right:0}
.tl-body{position:relative;flex:1;min-width:0}
.tl-hour{position:absolute;left:0;right:0;border-top:1px solid var(--line-2);font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--muted);padding-left:2px}
.tl-block{position:absolute;left:40px;right:0;border-radius:10px;padding:6px 10px;overflow:hidden;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600}
.tl-block .t{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--muted);display:block;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-block.narrow{font-size:12px;padding:5px 7px;line-height:1.18}
.tl-block.narrow .t{font-size:8.5px;letter-spacing:.04em}
.tl-block.fixed{border-color:color-mix(in srgb,var(--hi) 45%,transparent);background:var(--hi-soft)}
.tl-block.lunch{border-color:color-mix(in srgb,var(--cool) 45%,transparent);background:var(--cool-soft)}
.tl-now{position:absolute;left:0;right:0;height:2px;background:var(--hi);z-index:3;border-radius:2px}
.tl-now::after{content:"";position:absolute;left:0;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--hi)}
.seg-row{display:flex;align-items:center;gap:6px}
.seg-row input[type="time"]{min-height:44px;padding:8px 4px;text-align:center;flex:1;min-width:0}
.seg-row select{min-height:44px;padding:8px 8px;flex:1.2;min-width:0}
.swatch{width:14px;height:14px;border-radius:50%;flex:none;border:1px solid var(--line);display:inline-block;vertical-align:-2px;margin-right:8px}
.bd-field{gap:6px}
