.mic.sm{width:40px;min-height:38px;border-radius:9px}
.mic.sm svg{width:17px;height:17px}
/* the colour strip on each location in Setup */
.hues{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;justify-items:center;padding:2px 0 4px}
.hue-dot{appearance:none;cursor:pointer;width:30px;height:30px;border-radius:50%;border:2px solid transparent;padding:0;
  box-shadow:0 0 0 1px var(--line) inset;transition:transform .12s ease,border-color .12s ease}
.hue-dot[aria-pressed="true"]{border-color:var(--ink);transform:scale(1.12)}
.more-toggle{background:none;border:0;color:var(--ink-2);font:inherit;font-weight:600;font-size:13px;letter-spacing:.04em;
  cursor:pointer;padding:10px 0;display:flex;align-items:center;gap:8px;min-height:44px}
.more-toggle::after{content:"▾";transition:transform .16s ease}
.more-toggle[aria-expanded="true"]::after{transform:rotate(180deg)}

.slab{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:6px}
.slab .num{font-family:var(--display);font-variation-settings:'wdth' 82,'wght' 900;font-size:clamp(3rem,17vw,4.6rem);line-height:.86;letter-spacing:-.03em;color:var(--hi);font-variant-numeric:tabular-nums}
.slab .num.cool{color:var(--cool)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duo .slab{padding:16px}
.duo .num{font-size:clamp(2rem,10vw,2.6rem)}
.bars{display:flex;flex-direction:column;gap:7px}
.bar-row{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2)}
.bar-row .lab{width:78px;flex:none;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bar-track{flex:1;height:8px;border-radius:99px;background:var(--raised);overflow:hidden;border:1px solid var(--line-2)}
.bar-fill{display:block;height:100%;background:var(--hi);border-radius:99px}
.bar-fill.cool{background:var(--cool)} .bar-fill.good{background:var(--good)} .bar-fill.hot{background:var(--hi)}
/* one row per task in Progress: what it was, how long it really took */
.tt-row{display:flex;flex-direction:column;gap:6px;padding:11px 0;border-bottom:1px solid var(--line-2)}
.tt-row:last-child{border-bottom:0}
.tt-row .bar-track{flex:none;height:9px}
.tt-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.tt-name{font-weight:650;font-size:14.5px;color:var(--ink);line-height:1.25}
.tt-val{flex:none;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink)}
.bar-val{width:44px;text-align:right;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}

.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);max-width:540px;margin:0 auto;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line-2);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tab{appearance:none;background:transparent;border:0;cursor:pointer;padding:8px 2px;border-radius:11px;color:var(--muted);font-family:var(--display);font-variation-settings:'wdth' 88,'wght' 700;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;min-height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tab .dot{width:5px;height:5px;border-radius:99px;background:transparent}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"] .dot{background:var(--hi)}

.backdrop{position:fixed;inset:0;z-index:50;background:rgba(8,9,12,.55);opacity:0;pointer-events:none;transition:opacity .22s ease}
.backdrop.is-on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:60;left:0;right:0;bottom:0;max-width:540px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;box-shadow:var(--shadow-lg);padding:14px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(102%);transition:transform .26s cubic-bezier(.2,.8,.25,1);max-height:90vh;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:19px}
.sheet.is-on{transform:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:-14px;background:var(--surface);padding:6px 0 4px;margin-top:-6px;z-index:2}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 4px}
.toast{position:fixed;left:50%;transform:translate(-50%,20px);bottom:96px;z-index:70;background:var(--ink);color:var(--bg);border-radius:12px;padding:11px 16px;font-size:14px;font-weight:600;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;max-width:min(90vw,420px);cursor:pointer;text-align:center}
.toast.is-on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.nostore{display:flex;gap:12px;align-items:flex-start;background:var(--hi-soft);border:1px solid color-mix(in srgb,var(--hi) 40%,transparent);border-radius:var(--r);padding:13px 14px;font-size:13.5px;line-height:1.4;color:var(--ink);margin-bottom:12px}
.nostore b{display:block;color:var(--hi)}
.nostore .icon-btn{width:30px;height:30px;font-size:13px}

.gestures{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:24px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px)}
.gestures .card{max-width:340px;display:flex;flex-direction:column;gap:13px}
.gkey{display:flex;align-items:center;gap:12px;font-size:15px}
.gkey b{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--hi);width:92px;flex:none}
</style>
</head>
<body>
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <filter id="inkwarp" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.013 0.021" numOctaves="2" seed="9" result="noise">
      <animate attributeName="baseFrequency" dur="26s" repeatCount="indefinite"
               values="0.013 0.021; 0.019 0.014; 0.011 0.024; 0.013 0.021"></animate>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.6" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
  </filter>
</svg>

<div class="app">
  <header class="topbar">
    <div class="mark">O<span>N</span>E</div>
    <div class="topbar-spacer"></div>
    <div class="statchips" id="statchips"></div>
  </header>

  <main>
    <section class="screen is-on" id="scr-now"><div id="nowRoot"></div></section>
    <section class="screen" id="scr-plan"><div id="planRoot"></div></section>
    <section class="screen" id="scr-list"><div id="listRoot"></div></section>
    <section class="screen" id="scr-done"><div id="doneRoot"></div></section>
    <section class="screen" id="scr-you"><div id="youRoot"></div></section>
  </main>

  <nav class="tabbar" role="tablist">
    <button class="tab" role="tab" data-tab="now" aria-selected="true">Now<span class="dot"></span></button>
    <button class="tab" role="tab" data-tab="plan" aria-selected="false">Day<span class="dot"></span></button>
    <button class="tab" role="tab" data-tab="list" aria-selected="false">List<span class="dot"></span></button>
    <button class="tab" role="tab" data-tab="done" aria-selected="false">Progress<span class="dot"></span></button>
    <button class="tab" role="tab" data-tab="you" aria-selected="false">Setup<span class="dot"></span></button>
  </nav>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Panel"><div id="sheetRoot"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";

/* ============================================================
   1. STORAGE
   ============================================================ */
var KEY = "one.app.v1";
var CAN_STORE = (function(){
  try{ localStorage.setItem(KEY+".probe","1"); localStorage.removeItem(KEY+".probe"); return true; }catch(e){ return false; }
})();
var save = function(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };
var load = function(){ try{ return JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){ return null; } };
function pad(n){ return (n<10?"0":"")+n; }
var todayKey = function(d){ d = d || new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); };

/* The hue is the whole look of the app while you're there: the sphere, the
   tints, the paper. Work keeps ONE's orange; the others take their own. */
/* Where your body can be. Being out and about used to live here; it's a world
   of its own now, so this list is only about what a job physically needs. */
var DEFAULT_LOCATIONS = [
  { id:"home", label:"Home",      kind:"place", hue:150 },
  { id:"work", label:"Workplace", kind:"place", hue:22  }
];
var DEFAULT_SCHEDULE = [
  { from:"00:00", to:"08:00", loc:"home" },
  { from:"08:00", to:"09:00", loc:"out"  },
  { from:"09:00", to:"17:00", loc:"work" },
  { from:"17:00", to:"18:00", loc:"out"  },
  { from:"18:00", to:"23:59", loc:"home" }
];
var HUE_POOL = [35, 190, 320, 95, 260, 10];
/* the colours you can give a place, one per row of the wheel */
var HUE_CHOICES = [8, 22, 45, 95, 150, 175, 195, 215, 260, 285, 320, 340];
var HUE_NAMES = { 8:"Red", 22:"Orange", 45:"Amber", 95:"Green", 150:"Mint", 175:"Teal",
                  195:"Sky", 215:"Blue", 260:"Violet", 285:"Purple", 320:"Magenta", 340:"Pink" };
function hueName(h){ return HUE_NAMES[h] || ("Hue "+h); }

/* The four worlds. A planet is a part of your life, not a building: you can be
   in Work at the kitchen table. Where you physically are is separate metadata
   (S.locations), and only decides whether a job is possible right now. */
var DEFAULT_PLANETS = [
  { id:"work",     label:"Work",     kind:"planet", hue:22  },
  { id:"home",     label:"Home",     kind:"planet", hue:150 },
  { id:"errands",  label:"Errands",  kind:"comet",  hue:195 },
  { id:"projects", label:"Projects", kind:"belt",   hue:285 }
];

var DEFAULTS = {
  version:6,
  profile:{ name:"", tone:"normal", sawGestures:false },
  settings:{
    lunchDuration:45, lunchFrom:"12:00", lunchTo:"13:00", lunchRequired:true,
    workUntil:"17:30", defaultDuration:30, autoLocation:true, warnMinutes:10, chime:true
  },
  planets: JSON.parse(JSON.stringify(DEFAULT_PLANETS)),
  locations: JSON.parse(JSON.stringify(DEFAULT_LOCATIONS)),
  schedule: JSON.parse(JSON.stringify(DEFAULT_SCHEDULE)),
  session:{
    date:null, started:false, motivation:"meh", location:"work", lastPlace:"work", segIndex:-1,
    planet:null, enteredAt:null, sessionDone:false, keepGoing:false, lightUntil:0,
    lunchState:"pending", lunchEndsAt:null, workFinished:false, dayClosed:false, briefed:false, spun:false
  },
  tasks:[], focus:null, history:[],
  ui:{ tab:"now", arrival:null, pinnedId:null },
  log:[]
};

var S = load() || JSON.parse(JSON.stringify(DEFAULTS));
(function fill(){
  var d = DEFAULTS, k;
  for(k in d){ if(!(k in S)) S[k] = JSON.parse(JSON.stringify(d[k])); }
  ["session","settings","ui","profile"].forEach(function(g){
    for(var k2 in d[g]){ if(!(k2 in S[g])) S[g][k2] = d[g][k2]; }
  });
})();

(function migrate(){
  var was = +S.version || 0;
  if(!Array.isArray(S.locations) || !S.locations.length) S.locations = JSON.parse(JSON.stringify(DEFAULT_LOCATIONS));
  if(!Array.isArray(S.schedule) || !S.schedule.length) S.schedule = JSON.parse(JSON.stringify(DEFAULT_SCHEDULE));
  var KNOWN_HUES = { home:150, work:22, out:215 };
  S.locations.forEach(function(l,i){
    if(typeof l.hue !== "number") l.hue = KNOWN_HUES[l.id] != null ? KNOWN_HUES[l.id] : HUE_POOL[i % HUE_POOL.length];
  });
  /* Before v4 the hue only tinted the neutrals and the sphere was always
     orange. Now it paints the sphere too, so anything still on an old default
     moves to a colour that was picked to be looked at. Anything chosen by hand
     is left exactly as it is. */
  if(was && was < 4){
    var OLD = { home:150, work:215, out:285 };
    S.locations.forEach(function(l){
      if(OLD[l.id] === l.hue && KNOWN_HUES[l.id] != null) l.hue = KNOWN_HUES[l.id];
    });
  }

  var legacy = { home:"home", work:"work", "else":"out", errand:"out" };
  if(legacy[S.session.location]) S.session.location = legacy[S.session.location];
  if(!locById(S.session.location)) S.session.location = (S.locations[0]||{}).id;

  ["lunchRequired","lunchFrom","lunchTo","lunchDuration","workUntil"].forEach(function(k){
    if(S.session[k] != null && S.settings[k] == null) S.settings[k] = S.session[k];
  });

  S.tasks.forEach(function(t){
    if(!Array.isArray(t.locations)){
      var one = t.location;
      if(legacy[one]) one = legacy[one];
      if(!one || (one !== "anywhere" && !locById(one))) one = "anywhere";
      t.locations = [one];
      delete t.location;
    }
    if(!("fixedStart" in t)) t.fixedStart = null;
    if(!("fixedEnd" in t)) t.fixedEnd = null;
    if(!("warned" in t)) t.warned = false;
    if(!("repeatEvery" in t)) t.repeatEvery = 0;
    if(!("nextDueAt" in t)) t.nextDueAt = null;
    if(!("checkCount" in t)) t.checkCount = 0;
    if(!("originalEstimate" in t)) t.originalEstimate = null;
    if(!("extensions" in t)) t.extensions = 0;
    if(!("commit" in t)) t.commit = null;
    if(!("safeStopped" in t)) t.safeStopped = false;
    if(!("unblocks" in t)) t.unblocks = null;
    if(!("wakeAt" in t)) t.wakeAt = null;      /* v7: asleep until you asked to see it again */
    if(!("urgent" in t)) t.urgent = false;     /* v7: do this next, whatever else is true */
    if(!("prepMins" in t)) t.prepMins = 0;     /* v7: get-ready time before a fixed commitment */
    if(!("waitingOn" in t)) t.waitingOn = null;
    if(!("cancelledAt" in t)) t.cancelledAt = null;
    if(!("reopened" in t)) t.reopened = 0;
    /* the old "Deep Work" type carried two meanings; keep the one that matters */
    if(t.type === "Deep Work"){
      t.type = "Planning";
      if(t.effort === "normal") t.effort = "deep";
    }

    /* ---- v5: planets, deadlines, importance ----
       Every task gains the part of life that owns it. Being out and about was
       a place; now it's a world of its own, so those tasks emigrate and stop
       carrying a physical requirement they no longer need. */
    if(!t.planet){
      if(t.locations && t.locations.some(isTransit)) t.planet = "errands";
      else if(t.type === "Personal Project") t.planet = "projects";
      else if(t.category === "Personal") t.planet = "home";
      else t.planet = "work";
    }
    if(!planetById(t.planet)) t.planet = "work";
    if(t.planet === "errands"){ t.locations = ["anywhere"]; }
    else if(Array.isArray(t.locations)){
      var kept = t.locations.filter(function(x){ return x === "anywhere" || (locById(x) && !isTransit(x)); });
      t.locations = kept.length ? kept : ["anywhere"];
    }
    t.category = t.planet === "work" ? "Work" : "Personal";

    /* "Must do today" was importance and urgency wearing one coat. Split them:
       the urgency becomes a real deadline, the importance stays importance. */
    if(!("due" in t)) t.due = null;
    if(t.priority === "must"){ t.priority = "important"; if(!t.due) t.due = todayKey(); }
    if(["optional","normal","important"].indexOf(t.priority) < 0) t.priority = "normal";
    if(!("estimated" in t)) t.estimated = false;
    if(!("avoidCount" in t)) t.avoidCount = 0;
    if(!("needsPlace" in t)) t.needsPlace = null;
  });
  if(!Array.isArray(S.planets) || !S.planets.length) S.planets = JSON.parse(JSON.stringify(DEFAULT_PLANETS));
  DEFAULT_PLANETS.forEach(function(p){
    if(!planetById(p.id)) S.planets.push(JSON.parse(JSON.stringify(p)));
  });
  S.planets.forEach(function(p){ if(typeof p.hue !== "number") p.hue = 215; });
  if(S.session.planet && !planetById(S.session.planet)) S.session.planet = null;

  /* v6: transit places retire into the Errands planet. Anything that pointed at
     one - the schedule, where you are, a task's requirement - is mended here. */
  var gone = S.locations.filter(function(l){ return l.kind === "transit"; }).map(function(l){ return l.id; });
  if(gone.length){
    S.locations = S.locations.filter(function(l){ return l.kind !== "transit"; });
    if(!S.locations.length) S.locations = JSON.parse(JSON.stringify(DEFAULT_LOCATIONS));
    var home = (S.locations[0]||{}).id;
    S.schedule.forEach(function(sg){ if(gone.indexOf(sg.loc) > -1) sg.loc = home; });
    if(gone.indexOf(S.session.location) > -1) S.session.location = home;
    if(gone.indexOf(S.session.lastPlace) > -1) S.session.lastPlace = home;
    S.tasks.forEach(function(t){
      if(!Array.isArray(t.locations)) return;
      t.locations = t.locations.filter(function(x){ return gone.indexOf(x) < 0; });
      if(!t.locations.length) t.locations = ["anywhere"];
      if(t.needsPlace && gone.indexOf(t.needsPlace) > -1) t.needsPlace = null;
    });
  }
  if(locById("work") && S.locations.filter(function(l){ return l.id === "work"; })[0].label === "Work"){
    S.locations.filter(function(l){ return l.id === "work"; })[0].label = "Workplace";
  }
  S.version = 6;
})();

(function rollover(){
  var t = todayKey();
  if(S.session.date !== t){
    var keep = locById(S.session.location) ? S.session.location : (S.locations[0]||{}).id;
    S.session = JSON.parse(JSON.stringify(DEFAULTS.session));
    S.session.date = t;
    S.session.location = keep;
    S.session.lastPlace = isTransit(keep) ? (((places()[0]||{}).id) || keep) : keep;
    S.focus = null; S.ui.arrival = null; S.ui.pinnedId = null;
    S.tasks.forEach(function(x){
      if(x.status === "done") x.archived = true;
      x.postponedToday = 0; x.lastPostponedAt = null; x.warned = false;
      x.nextDueAt = null; x.checkCount = 0;
      x.commit = null; x.safeStopped = false;
    });
    save();
  }
})();

/* ============================================================
   2. TIME
   ============================================================ */
function now(){ return new Date(); }
function minsOfDay(d){ d = d||now(); return d.getHours()*60 + d.getMinutes(); }
function hhmmToMins(s){ if(!s) return null; var p = String(s).split(":"); return (+p[0])*60 + (+p[1]); }
function minsToHHMM(m){ m = Math.max(0, Math.min(1439, Math.round(m))); return pad(Math.floor(m/60))+":"+pad(m%60); }
function fmtDur(mins){
  mins = Math.max(0, Math.round(mins));
  if(mins < 60) return mins+"m";
  var h = Math.floor(mins/60), m = mins%60;
  return h+"h"+(m? " "+m+"m":"");
}
function mmss(sec){
  var neg = sec < 0; sec = Math.abs(Math.round(sec));
  return (neg?"+":"")+pad(Math.floor(sec/60))+":"+pad(sec%60);
}

/* ============================================================
   3. LOCATIONS + DAY SHAPE
   ============================================================ */
function locById(id){
  if(!Array.isArray(S.locations)) return null;
  for(var i=0;i<S.locations.length;i++) if(S.locations[i].id === id) return S.locations[i];
  return null;
}
function isTransit(id){ var l = locById(id); return !!l && l.kind === "transit"; }
function locLabel(id){ if(id === "anywhere") return "Anywhere"; var l = locById(id); return l ? l.label : "Anywhere"; }
function locHue(id){ var l = locById(id); return l ? l.hue : 215; }
function places(){ return S.locations.filter(function(l){ return l.kind === "place"; }); }
function transitLocs(){ return S.locations.filter(function(l){ return l.kind === "transit"; }); }
function slug(s){
  var base = String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "place";
  var id = base, n = 2;
  while(locById(id)){ id = base+"-"+n; n++; }
  return id;
}
function sortedSchedule(){ return S.schedule.slice().sort(function(a,b){ return hhmmToMins(a.from) - hhmmToMins(b.from); }); }
function segmentAt(m){
  var seg = sortedSchedule();
  for(var i=0;i<seg.length;i++){
    var f = hhmmToMins(seg[i].from), t = hhmmToMins(seg[i].to);
    if(m >= f && m < (t <= f ? 1440 : t)) return { seg:seg[i], i:i };
  }
  return null;
}
/* the schedule drives location; a manual spin holds until the next change */
function applySchedule(){
  if(!S.settings.autoLocation) return false;
  var hit = segmentAt(minsOfDay());
  if(!hit || hit.i === S.session.segIndex) return false;
  S.session.segIndex = hit.i;
  if(locById(hit.seg.loc) && hit.seg.loc !== S.session.location){
    S.session.location = hit.seg.loc;
    if(!isTransit(hit.seg.loc)) S.session.lastPlace = hit.seg.loc;
    return true;
  }
  return false;
}
/* ---------- planets: the part of life a task belongs to ---------- */
function planetById(id){
  if(!id || !Array.isArray(S.planets)) return null;
  for(var i=0;i<S.planets.length;i++) if(S.planets[i].id === id) return S.planets[i];
  return null;
}
function planetLabel(id){ var p = planetById(id); return p ? p.label : "Somewhere"; }
function planetHue(id){ var p = planetById(id); return p ? p.hue : 22; }
function inPlanet(){ return S.session.planet ? planetById(S.session.planet) : null; }
function planetOf(t){ return t.planet || "work"; }
/* every task in this world, whatever state it's in */
function planetTasks(id){ return liveTasks().filter(function(t){ return planetOf(t) === id; }); }
function planetOpen(id){ return planetTasks(id).filter(function(t){ return t.status === "open"; }); }
function isErrandPlanet(id){ var p = planetById(id); return !!p && p.kind === "comet"; }

/* ---------- deadlines ---------- */
function isDueToday(t){ return !!t.due && t.due <= todayKey(); }
function isOverdue(t){ return !!t.due && t.due < todayKey(); }
function dueLabel(t){
  if(!t.due) return "";
  var k = todayKey();
  if(t.due < k) return "Overdue";
  if(t.due === k) return "Today";
  var d = new Date(); d.setDate(d.getDate()+1);
  if(t.due === todayKey(d)) return "Tomorrow";
  var p = t.due.split("-");
  return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][(+p[1])-1]+" "+(+p[2]);
}
function dateFromToday(n){ var d = new Date(); d.setDate(d.getDate()+n); return todayKey(d); }

function applyHue(){
  var h = S.session.planet ? planetHue(S.session.planet) : locHue(S.session.location);
  var r = document.documentElement.style;
  r.setProperty("--loc-h", String(h));
  r.setProperty("--orb-h", String(h));
}

/* ============================================================
   4. VOCABULARY
   ============================================================ */
/* Importance is how much it matters. When it's due is a separate question —
   mixing the two is what made "must do today" mean three different things. */
var PRIORITY_ORDER = ["optional","normal","important"];
var PRIORITY = { important:"Important", normal:"Normal", optional:"Optional" };
var WHEN_CHOICES = [{v:"none",l:"No deadline"},{v:"today",l:"Today"},{v:"tomorrow",l:"Tomorrow"},{v:"date",l:"Pick date"}];
var EFFORT_ORDER = ["easy","normal","deep"];
var EFFORT = { easy:"Easy win", normal:"Normal", deep:"Deep work" };
/* "Deep Work" isn't a kind of work, it's how heavy the work is — and mental
   load already says that. One less near-duplicate to choose between. */
var TYPES = ["Admin","Email","Physical","Planning","Creative","Errand","Meeting","Personal Project"];
var BLOCK_REASONS = ["Waiting for someone","Need information","Need equipment/materials","Wrong location","Can't access it right now","Other"];
var HOUSEHOLD = /\b(bin|bins|rubbish|recycling|washing|laundry|dishes|dishwasher|kitchen|bathroom|bedroom|tidy|hoover|vacuum|garage|garden|lawn|ironing|beds?|curtains?|blinds?|shelf|shelves|rail|boiler|radiator|plumber|electrician|light ?bulb|lamp|fence|shed|loft|attic|cupboard|drawer|hallway|carpet|door|window|dinner|tea|cooking|meal ?plan|kids?|school run)\b/i;
var ERRANDY = /\b(petrol|diesel|fuel|milk|bread|shop|shopping|groceries|chemist|pharmacy|post office|parcel|bank|collect|pick up|pickup|drop off|dry clean|car wash|cash)\b/i;

/* ============================================================
   5. COACH
   ============================================================ */
/* ============================================================
   5. THE VOICE
   One personality, and every line is built rather than drawn out
   of a hat. Three questions, always in the same order:

     what actually happened  →  what is worth saying  →  how to say it

   The point is not to sound clever. It is to demonstrate that ONE
   understood the situation. Most of the time that means saying
   something short and plain and getting out of the way; the humour
   only means anything because it is rare, and because it is earned
   by something you actually did.
   ============================================================ */
function who(){ return (S.profile.name || "").trim(); }

/* ---------- what ONE knows about today ----------
   Not "the last event" — the shape of the whole day, because a
   completion at half nine means something different to the same
   completion twenty minutes before you finish. */
function coachCtx(){
  var log = todayLog(), since = S.session.enteredAt || 0;
  var sess = log.filter(function(l){ return l.at >= since; });
  var live = liveTasks();
  var end = hhmmToMins(S.settings.workUntil);
  var minsLeft = S.session.workFinished ? 0 : Math.max(0, end - minsOfDay());
  var mins = function(a){ return a.reduce(function(x,l){ return x + (l.minutes||0); }, 0); };
  var last = log.length ? log[log.length-1] : null;
  /* a run is completions close enough together to feel like a run */
  var streak = 0;
  for(var i = log.length - 1; i > 0; i--){
    if(log[i].at - log[i-1].at <= 25*60000) streak++; else break;
  }
  var w = S.session.planet && !isErrandPlanet(S.session.planet) ? runway() : { mins:600, kind:"none", what:"" };
  var doneMins = mins(log);
  return {
    doneToday: log.length, doneSession: sess.length,
    minsToday: doneMins, minsSession: mins(sess),
    importantDone: doneToday().filter(function(t){ return t.priority === "important"; }).length,
    urgentDone: doneToday().filter(function(t){ return t.wasUrgent; }).length,
    recentTypes: log.slice(-3).map(function(l){ return l.type; }),
    streak: streak + (log.length ? 1 : 0),
    sinceLast: last ? Math.round((Date.now() - last.at)/60000) : null,
    minsLeft: minsLeft, finishAt: S.settings.workUntil, runway: w,
    nextFixed: nextFixed(true),
    waiting: live.filter(isWaiting).length,
    blocked: live.filter(function(t){ return t.status === "blocked"; }).length,
    asleep: live.filter(isAsleep).length,
    left: openTasks().filter(function(t){ return !isResting(t); }).length,
    worstDodge: live.reduce(function(a,t){ return Math.max(a, t.postponedToday||0); }, 0),
    lightHead: !!(S.session.lightUntil && Date.now() < S.session.lightUntil),
    motivation: S.session.motivation,
    productive: log.length >= 2 || doneMins >= 45,
    where: S.session.planet ? planetLabel(S.session.planet) : ""
  };
}
function productiveToday(){ var c = coachCtx(); return c.productive; }

/* ---------- what an event means ----------
   The same button press means different things on different days.
   Naming the meaning before choosing the words is the whole trick:
   it is why ONE can tell a sensible decision from a dodge. */
function interpret(ev, f, c){
  var t = f.task;
  switch(ev){
    case "done":
      if(f.urgent) return "URGENT_WIN";
      if(t && t.priority === "important") return "IMPORTANT_WIN";
      if(c.streak >= 3) return "MOMENTUM";
      return "ROUTINE_COMPLETION";
    case "picked":
      /* Choosing something yourself is not evidence of anything except that
         you have eyes. It only reads as avoidance when the thing you keep
         stepping over is the same thing every time. */
      return (f.skipped && f.skipped.postponedToday >= 3) ? "GENUINE_AVOIDANCE" : "SENSIBLE_OVERRIDE";
    case "dodge":
      if(t && (t.avoidCount||0) >= 3) return "GENUINE_AVOIDANCE";
      return "LEGITIMATE_POSTPONEMENT";
    case "blocked":  return "BLOCKED_EXTERNAL";
    case "waiting":  return "AWAITING_CONFIRMATION";
    case "confirmed":return "IMPORTANT_WIN";
    case "reopened": return "WORKAROUND_REQUIRED";
    case "cancelled":return "CONTEXT_CHANGED";
    case "snoozed":  return "LEGITIMATE_POSTPONEMENT";
    case "extend":
      return (f.extensions >= 3 || (f.total||0) >= (f.plan||1) * 2) ? "POSSIBLE_SCOPE_CREEP" : "LEGITIMATE_OVERRUN";
    case "rabbit":   return "RABBIT_HOLE";
    case "safestop": return "SENSIBLE_STOPPING_POINT";
    case "workaround": return "WORKAROUND_REQUIRED";
    case "sessionDone": return "SESSION_COMPLETE";
    case "nothingFits": return c.productive ? "USER_HAS_DONE_ENOUGH" : "SESSION_NEAR_END";
    case "finishMoved": return "CONTEXT_CHANGED";
    case "finishNow":   return c.productive ? "USER_HAS_DONE_ENOUGH" : "CONTEXT_CHANGED";
    case "added":    return f.urgent ? "URGENT_WIN" : "ROUTINE_COMPLETION";
    case "start":    return f.resumed ? "RETURN_TO_INTERRUPTED_TASK" : "MAINTAIN_FOCUS";
    case "prep":     return "SESSION_NEAR_END";
    default:         return "ROUTINE_COMPLETION";
  }
}
/* ---------- what the response is for ----------
   Firmness and chastisement have to be earned by the reading above.
   Nothing here reaches for them on its own. */
function intentFor(read, ev, f, c){
  switch(read){
    case "GENUINE_AVOIDANCE":     return "CHALLENGE";
    case "RABBIT_HOLE":           return "REDIRECT";
    case "POSSIBLE_SCOPE_CREEP":  return "CHALLENGE";
    case "LEGITIMATE_OVERRUN":    return "REASSURE";
    case "SENSIBLE_STOPPING_POINT":
    case "SENSIBLE_OVERRIDE":
    case "CONTEXT_CHANGED":
    case "AWAITING_CONFIRMATION":
    case "BLOCKED_EXTERNAL":
    case "WORKAROUND_REQUIRED":
    case "LEGITIMATE_POSTPONEMENT": return "ACCEPT_AND_REPLAN";
    case "USER_HAS_DONE_ENOUGH":
    case "SESSION_COMPLETE":      return "RECOMMEND_STOPPING";
    case "IMPORTANT_WIN":
    case "URGENT_WIN":
    case "MOMENTUM":              return "CELEBRATE";
    case "RETURN_TO_INTERRUPTED_TASK": return "RETURN_TO_INTERRUPTED_TASK";
    case "MAINTAIN_FOCUS":        return "MAINTAIN_FOCUS";
    default:                      return "ACKNOWLEDGE";
  }
}

/* ---------- the humour budget ----------
   Roughly seven lines in ten are plain, two are lightly playful and
   one pushes back — and the last two are only available when
   something in the day actually warrants them. A joke after every
   interaction stops being a joke and becomes a tic. */
function witBudget(){
  if(!S.session.wit) S.session.wit = { n:0, lastLight:-99, lastPush:-99, light:0, push:0 };
  return S.session.wit;
}
function humour(level, warrant){
  var b = witBudget();
  if(!warrant) return false;
  if(level === 2) return b.n - b.lastPush >= 4;      /* earned, but not twice running */
  return b.n - b.lastLight >= 2 && Math.random() < 0.78;
}
function spend(level){
  var b = witBudget();
  if(level === 2){ b.lastPush = b.n; b.push = (b.push||0) + 1; }
  else if(level === 1){ b.lastLight = b.n; b.light = (b.light||0) + 1; }
}

/* ---------- saying it ----------
   1–2 sentences. Acknowledgement, decision, next action. No speeches,
   and no explaining the algorithm unless you asked "why this?". */
function fmtLeft(c){ return c.minsLeft > 0 ? fmtDur(c.minsLeft)+" left" : "past your finish"; }
function phrase(read, intent, ev, f, c){
  var t = f.task, name = t ? t.name : "that";
  var L = 0, out = "";
  switch(read){

    case "ROUTINE_COMPLETION":
      if(ev === "added"){
        if(f.mins && f.mins <= 5 && humour(1, true)){ L=1; out = "Added. "+f.mins+" minutes. Don't make a project of it."; }
        else out = "Added"+(f.where ? " to "+f.where : "")+". Back to what you were doing.";
        break;
      }
      out = (c.left === 0 && c.where) ? "Done. That's "+c.where+" clear."
          : c.left === 0 ? "Done. That's the lot."
          : (c.doneToday === 1 ? "Done. That's you off the mark."
          : (humour(1, c.sinceLast !== null && c.sinceLast <= 4) ? (L=1, "That's cleared. You're not hanging about.")
          : humour(1, c.doneToday >= 5) ? (L=1, "Another one. The pile has noticed.")
          : pickPlain(["Done.", "That's cleared.", "Done. Next."], c)));
      break;

    case "IMPORTANT_WIN":
      out = ev === "confirmed"
        ? "Confirmed working. "+name+" is properly done."
        : "Good. That's an important one gone.";
      if(c.left === 0) out += " Nothing left in "+c.where+".";
      break;

    case "URGENT_WIN":
      if(ev === "added"){
        if(f.mins && f.mins <= 10 && humour(1, true)){ L=1; out = "Urgent and "+f.mins+" minutes. Do not somehow turn that into an afternoon."; }
        else out = "Urgent — it's next up.";
        break;
      }
      out = "Done. That's the urgent one cleared.";
      break;

    case "MOMENTUM":
      out = humour(1, c.streak >= 4) ? (L=1, "Nice. You're moving now.")
          : c.streak+" in a row. "+(c.minsLeft > 60 ? "Keep going." : fmtLeft(c)+".");
      break;

    /* -------- decisions ONE should recognise, not question -------- */
    case "SENSIBLE_OVERRIDE":
      out = f.parked
        ? f.parked.name+" parked with "+fmtDur(f.parked.mins)+" banked. "+name+" it is."
        : (c.nextFixed ? "Yep. Makes sense with "+c.nextFixed.name+" coming up." : "Fair enough. "+name+" it is.");
      break;

    case "LEGITIMATE_POSTPONEMENT":
      if(ev === "snoozed"){ out = "Back with you "+f.when+"."; break; }
      out = f.reason === "Bad time" ? "Fine. Not now, then."
          : (t && (t.postponedToday||0) >= 3 ? "Away it goes — but it's first up the moment you finish something."
          : humour(1, c.minsLeft > 0 && c.minsLeft < 45) ? (L=1, "Fine. Not much left of today to hide in, mind.")
          : "Noted. Something else, then.");
      break;

    case "GENUINE_AVOIDANCE":
      if(humour(2, true)){
        L=2;
        out = who() ? who()+". "+((t&&t.avoidCount)||3)+" times. We're doing it."
                    : "That's "+((t&&t.avoidCount)||3)+" times now. We're doing it.";
      } else {
        out = "That's "+((t&&t.avoidCount)||3)+" passes on the same job. It stays at the front until it's gone.";
      }
      break;

    case "BLOCKED_EXTERNAL":
      out = "Can't do much about that. Parked until you hear back.";
      break;

    case "AWAITING_CONFIRMATION":
      out = f.on ? "Parked. Waiting on "+f.on+"." : "Parked. You've done your bit.";
      break;

    case "WORKAROUND_REQUIRED":
      if(ev === "reopened") out = "Right — still not fixed. It's back on the list.";
      else out = "Good. Deal with the symptom now, leave the problem parked.";
      break;

    case "CONTEXT_CHANGED":
      if(ev === "cancelled") out = "Fine — that one's gone. It stays in the history, not the count.";
      else if(ev === "finishMoved") out = "Finishing at "+f.at+". "+(f.left > 0 ? fmtDur(f.left)+" — I'll only offer what fits." : "That's now, then.");
      else out = "Understood. Replanning round that.";
      break;

    /* -------- the clock -------- */
    case "LEGITIMATE_OVERRUN":
      out = "Fair enough — bigger than it looked. Another "+f.add+" and stay with it.";
      break;

    case "POSSIBLE_SCOPE_CREEP":
      out = humour(2, true)
        ? (L=2, (who()?who()+". ":"")+f.plan+" minutes became "+f.total+". What are we actually doing here?")
        : f.plan+" minutes has become "+f.total+". Worth finishing, or worth stopping somewhere sensible?";
      break;

    case "RABBIT_HOLE":
      out = humour(2, true)
        ? (L=2, "Out. That was a task, not an archaeological dig.")
        : "Right — out of there. Leave it somewhere you can pick it up.";
      break;

    case "SENSIBLE_STOPPING_POINT":
      out = "Fair. We've given it a proper go. Left somewhere sensible — that's the right call.";
      break;

    /* -------- stopping is allowed to be the answer -------- */
    case "USER_HAS_DONE_ENOUGH":
      out = "You've cleared the important stuff. Nothing worth opening for "+fmtDur(Math.max(1,c.minsLeft))+
            ". You're done at "+c.finishAt+".";
      break;

    case "SESSION_COMPLETE":
      out = "Nothing left in "+c.where+" worth starting. "+
            (c.doneToday ? c.doneToday+" done and "+fmtDur(c.minsToday)+" on the clock. " : "")+"Stopping is the right answer here.";
      break;

    case "SESSION_NEAR_END":
      if(ev === "prep") out = f.at ? "Getting ready for "+name+" at "+f.at+". Nothing else starts now." : "Nothing else starts now.";
      else out = "Only "+fmtDur(Math.max(1,c.minsLeft))+" left. Not enough for anything that matters.";
      break;

    case "MAINTAIN_FOCUS":
      out = f.mins ? "Right. "+f.mins+" minutes. Just this." : "Just this.";
      break;

    case "RETURN_TO_INTERRUPTED_TASK":
      out = f.left > 0
        ? "Picking it up — "+fmtDur(f.spent)+" already in, "+f.left+" to go."
        : "You're past the estimate on this. "+f.mins+" minutes to see it off.";
      break;
  }
  if(L) spend(L);
  witBudget().n++;
  return out;
}
/* rotate through the plain forms so the commonest line isn't a chant */
function pickPlain(arr, c){ return arr[(c.doneToday + witBudget().n) % arr.length]; }

/* the two ways to use it: a line on screen, or a line said out loud */
function line(ev, f){
  f = f || {};
  var c = coachCtx();
  var read = interpret(ev, f, c);
  return phrase(read, intentFor(read, ev, f, c), ev, f, c);
}
window.ONEsay = function(ev, f){ return line(ev, f); };
window.ONEwit = function(){ return witBudget(); };
window.ONEctx = function(){ return coachCtx(); };
function say(ev, f, undo, undoLabel){
  var msg = line(ev, f);
  if(msg) toast(msg, undo, undo ? (undoLabel || "undo") : null);
  return msg;
}

/* ============================================================
   6. TASKS
   ============================================================ */
function uid(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function makeTask(o){
  var planet = planetById(o.planet) ? o.planet : "work";
  return {
    id:uid(), name:(o.name||"Untitled").trim(),
    planet:planet,
    category: planet === "work" ? "Work" : "Personal",   /* kept in step with the planet, for the engine */
    priority:o.priority||"normal", effort:o.effort||"normal",
    due:o.due||null,
    duration:o.duration||S.settings.defaultDuration, estimated:!!o.estimated,
    locations: planet === "errands" ? ["anywhere"]
             : ((o.locations && o.locations.length) ? o.locations.slice() : ["anywhere"]),
    type:o.type||"Admin",
    fixedStart:o.fixedStart||null, fixedEnd:o.fixedEnd||null, warned:false,
    unblocks:o.unblocks||null,
    repeatEvery:o.repeatEvery||0, nextDueAt:null, checkCount:0, wakeAt:null,
    urgent:!!o.urgent, prepMins:o.prepMins||0, waitingOn:null, cancelledAt:null, reopened:0,
    status:"open", blockedReason:null, postponedToday:0, lastPostponedAt:null,
    avoidCount:0, needsPlace:null,
    actualMinutes:0, createdAt:Date.now(), completedAt:null, archived:false
  };
}
/* moving a task between worlds keeps the derived bits honest */
function setPlanet(t, id){
  if(!planetById(id)) return;
  t.planet = id;
  t.category = id === "work" ? "Work" : "Personal";
  if(id === "errands") t.locations = ["anywhere"];
}
function liveTasks(){ return S.tasks.filter(function(t){ return !t.archived; }); }
function byId(id){ for(var i=0;i<S.tasks.length;i++) if(S.tasks[i].id===id) return S.tasks[i]; return null; }
function openTasks(){ return liveTasks().filter(function(t){ return t.status==="open"; }); }
function doneToday(){
  var d = todayKey();
  return S.tasks.filter(function(t){ return t.status==="done" && t.completedAt && todayKey(new Date(t.completedAt))===d; });
}
function transitTasks(){
  return openTasks().filter(function(t){ return planetOf(t) === "errands" && !t.fixedStart && !isResting(t); });
}
/* ============================================================
   COMMITTED TASKS
   The ordinary timer exists to stop you drifting. This is the
   opposite case: the timer ran out but stopping now would cost
   more than carrying on. It is a conscious re-commitment, not a
   licence to ignore the clock — every extension is re-estimated.
   ============================================================ */
var COMMIT_REASONS = [
  "Work would be unsafe or incomplete",
  "Equipment or work area is dismantled",
  "I've reached a point of no return",
  "Stopping now would create more work",
  "Unexpected problems made it much bigger",
  "Other"
];
var COMMIT_MINUTES = [15, 30, 45, 60, 90];
function isCommitted(t){ return !!(t && t.commit && t.commit.on); }
function committedTask(){
  var f = S.focus; if(!f) return null;
  var t = byId(f.taskId);
  return isCommitted(t) ? t : null;
}
function spentOn(t){ return Math.round(t.actualMinutes || 0); }
/* everything worth learning from a run, kept beyond the task's own life */
function recordRun(t, outcome, extraMins){
  if(!t) return;
  var rec = {
    at: Date.now(), date: todayKey(), name: t.name, type: t.type,
    est: t.originalEstimate || t.duration,
    actual: (t.actualMinutes || 0) + (extraMins || 0),
    extensions: t.extensions || 0,
    committed: isCommitted(t),
    reasons: isCommitted(t) ? t.commit.reasons.slice() : [],
    added: isCommitted(t) ? t.commit.added.slice() : [],
    outcome: outcome
  };
  if(!Array.isArray(S.history)) S.history = [];
  S.history.push(rec);
  if(S.history.length > 400) S.history = S.history.slice(-400);
  return rec;
}
function isRecurring(t){ return !!(t.repeatEvery && t.repeatEvery > 0); }
/* how long a dodged task stays out of the way */
function dodgeRestMins(t){
  if(isDueToday(t)) return 12;
  if(t.priority === "important") return 20;
  if(t.priority === "optional") return 120;
  return 35;
}
function isDodged(t){
  return !!(t.lastPostponedAt && (Date.now() - t.lastPostponedAt) < dodgeRestMins(t)*60000);
}
function isCooling(t){ return isRecurring(t) && t.nextDueAt && Date.now() < t.nextDueAt; }
/* You asked to be shown this again at a particular moment. Until then it isn't
   hidden away in a list somewhere being forgotten — it's asleep, and it will
   wake itself up. */
function isAsleep(t){ return !!(t.wakeAt && Date.now() < t.wakeAt); }
/* ---------- urgent is not the same as important ----------
   Important says this matters. Due today says there's a deadline. Urgent says
   do it next — it jumps the queue once, and then stops shouting, so it can't
   quietly bend every decision you make for the rest of the week. */
function isUrgent(t){ return !!t.urgent && t.status === "open"; }
/* ---------- waiting on the world ----------
   You've done your part and you're waiting to find out whether it worked. That
   is not finished, not blocked before you could start, and certainly not a
   dodge. It leaves the running order and keeps everything it knows. */
function isWaiting(t){ return t.status === "waiting"; }
function isCancelled(t){ return t.status === "cancelled"; }
/* Getting ready counts. A commitment at 11:30 that takes ten minutes to set up
   really starts at 11:20, and nothing unrelated should be running into it. */
function prepOf(t){ return Math.max(0, t.prepMins || 0); }
function startsEffectively(t){ return hhmmToMins(t.fixedStart) - prepOf(t); }
function isResting(t){ return isCooling(t) || isAsleep(t); }
function justWoke(t){ return !!(t.wakeAt && Date.now() >= t.wakeAt && Date.now() - t.wakeAt < 3*3600000); }
function wakeLabel(t){
  if(!t.wakeAt) return "";
  var d = new Date(t.wakeAt), now = new Date();
  var day = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var days = Math.round((day - today) / 86400000);
  var hm = (d.getHours()<10?"0":"")+d.getHours()+":"+(d.getMinutes()<10?"0":"")+d.getMinutes();
  if(days <= 0) return hm;
  if(days === 1) return "tomorrow "+hm;
  if(days < 7) return ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][d.getDay()]+" "+hm;
  return d.getDate()+" "+["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()]+" "+hm;
}
function coolMins(t){ return isCooling(t) ? Math.max(1, Math.round((t.nextDueAt - Date.now())/60000)) : 0; }
function overdueMins(t){
  if(!isRecurring(t) || !t.nextDueAt) return 0;
  return Math.max(0, Math.round((Date.now() - t.nextDueAt)/60000));
}
/* a check-in doesn't finish the task — it restarts its clock */
function checkTask(t, mins){
  unpin();
  releaseNags();
  t.checkCount = (t.checkCount||0) + 1;
  t.nextDueAt = Date.now() + t.repeatEvery*60000;
  t.actualMinutes = (t.actualMinutes||0) + (mins || 0);
  t.postponedToday = 0; t.lastPostponedAt = null;
  S.log.push({ date:todayKey(), taskId:t.id, name:t.name, type:t.type, minutes:mins || 0, at:Date.now(), kind:"check" });
  save();
}
function finishRecurring(t){
  t.status = "done"; t.completedAt = Date.now(); t.nextDueAt = null;
  S.log.push({ date:todayKey(), taskId:t.id, name:t.name, type:t.type, minutes:0, at:Date.now(), kind:"done" });
  save();
}
function repeatLabel(mins){
  if(!mins) return "";
  return mins % 60 === 0 ? "every "+(mins/60)+"h" : "every "+mins+"m";
}
function taskEndMins(t){
  if(!t.fixedStart) return null;
  return t.fixedEnd ? hhmmToMins(t.fixedEnd) : hhmmToMins(t.fixedStart) + t.duration;
}
function fixedToday(){
  return openTasks().filter(function(t){ return !!t.fixedStart; })
    .sort(function(a,b){ return hhmmToMins(a.fixedStart) - hhmmToMins(b.fixedStart); });
}
/* An appointment still belongs to wherever you said it happens. Pinned to
   Work, it won't hijack the orb while you're at home — the topbar chip still
   warns you about it. */
function currentFixed(){
  var m = minsOfDay(), f = fixedToday();
  for(var i=0;i<f.length;i++){
    if(m >= hhmmToMins(f[i].fixedStart) && m < taskEndMins(f[i]) && locationOK(f[i])) return f[i];
  }
  return null;
}
function nextFixed(hereOnly){
  var m = minsOfDay(), f = fixedToday();
  for(var i=0;i<f.length;i++){
    if(startsEffectively(f[i]) > m && (!hereOnly || locationOK(f[i]))) return f[i];
  }
  return null;
}
/* Inside the run-up to a commitment there's nothing to start — this is the
   getting-ready time you asked for. */
function inPrepFor(){
  var m = minsOfDay(), f = fixedToday();
  for(var i=0;i<f.length;i++){
    if(prepOf(f[i]) && m >= startsEffectively(f[i]) && m < hhmmToMins(f[i].fixedStart) && locationOK(f[i])) return f[i];
  }
  return null;
}

/* ============================================================
   7. LUNCH + RUNWAY
   ============================================================ */
function lunchInfo(){
  var st = S.settings, from = hhmmToMins(st.lunchFrom), to = hhmmToMins(st.lunchTo), m = minsOfDay();
  var pending = st.lunchRequired && S.session.lunchState === "pending";
  return {
    required:st.lunchRequired, pending:pending, active:S.session.lunchState==="active",
    from:from, to:to,
    beforeWindow:pending && m < from, inWindow:pending && m >= from && m < to, overdue:pending && m >= to,
    minsToOpen:from - m, minsToForce:to - m
  };
}
/* the next wall you'll hit, and what it is */
function runway(){
  var m = minsOfDay(), L = lunchInfo(), end = hhmmToMins(S.settings.workUntil), nf = nextFixed(true), walls = [];
  if(nf) walls.push({ mins:startsEffectively(nf) - m, what:nf.name+" at "+nf.fixedStart, kind:"fixed",
                      prep:prepOf(nf), task:nf });
  if(L.pending) walls.push({ mins:Math.max(0, L.to - m), what:"lunch", kind:"lunch" });
  if(!S.session.workFinished && end != null && end > m) walls.push({ mins:end - m, what:"the end of the day", kind:"day" });
  if(!walls.length) return { mins:600, what:"", kind:"none" };
  walls.sort(function(a,b){ return a.mins - b.mins; });
  return walls[0];
}
function workingHours(){
  if(S.session.workFinished) return false;
  var end = hhmmToMins(S.settings.workUntil);
  return end == null ? true : minsOfDay() < end;
}
function departureImminent(){
  if(isTransit(S.session.location)) return false;
  if(!transitTasks().length) return false;
  if(S.session.workFinished) return true;
  var left = hhmmToMins(S.settings.workUntil) - minsOfDay();
  return left <= 45 && left > -120;
}

/* ============================================================
   8. SELECTION ENGINE
   ============================================================ */
/* Can this actually be done from where your body is? Nothing to do with which
   world it belongs to — a Work task can need the workplace, or nowhere at all. */
function locationOK(t){
  var here = S.session.location;
  if(planetOf(t) === "errands") return true;      /* errands live in their own world */
  if(t.needsPlace && t.needsPlace !== here) return false;
  if(isTransit(here)) return t.locations.indexOf("anywhere") > -1;
  return t.locations.indexOf("anywhere") > -1 || t.locations.indexOf(here) > -1;
}
function recentDone(n){
  return doneToday().sort(function(a,b){ return b.completedAt - a.completedAt; }).slice(0,n);
}
function scoreTask(t, ctx){
  var s = 0, why = [];
  s += ({ important:64, normal:32, optional:8 })[t.priority] || 32;

  /* A deadline is urgency, importance is weight. Both count, separately. */
  if(isOverdue(t)){ s += 130; why.push("This was due "+dueLabel(t).toLowerCase()+". It goes first."); }
  else if(isDueToday(t)){ s += 96; why.push(t.priority === "important" ? "Important, and due today." : "Due today."); }
  else if(t.due === dateFromToday(1)){ s += 26; }
  if(t.priority === "important" && !t.due) why.push("You marked this one important.");

  if(ctx.transit){ s += Math.max(0, 40 - t.duration); return { score:s, why:why }; }

  /* You chose which world to be in. Inside it, nothing is second class — the
     old work-beats-personal veto lived at this level and now lives one level
     up, in which planet you decided to enter. */
  if(ctx.heavy >= 2 && t.effort === "easy" && !ctx.workEasyWin) s += 6;

  /* You set a time to come back to this, and it's come. Honour it — you knew
     something then that you may not remember now. */
  if(justWoke(t)){ s += 88; why.push("You asked to look at this again around now."); }

  /* check-ins are small wins that get louder the longer they're overdue */
  if(isRecurring(t)){
    s += 18 + Math.min(46, overdueMins(t) * 0.7);
    if(t.checkCount) why.push("Time for another look at this.");
  }

  /* you said your head wasn't in it — so nothing heavy for a while */
  if(S.session.lightUntil && Date.now() < S.session.lightUntil){
    if(t.effort === "deep"){ s -= 46; }
    else if(t.effort === "easy"){ s += 24; why.push("Your head wasn't in the big stuff. Here's a small one."); }
  }

  var mot = S.session.motivation;
  if(mot === "motivated"){
    if(t.effort === "deep"){ s += 38; why.push("You're motivated. Don't waste that on easy wins."); }
    if(t.effort === "easy") s -= 22;
    if(t.duration >= 45) s += 10;
  } else if(mot === "meh"){
    if(t.effort === "easy") s += 14;
    if(t.effort === "deep") s -= 12;
  } else {
    if(t.effort === "easy"){ s += 52; why.push("We're starting small. Momentum first."); }
    if(t.duration <= 15) s += 26;
    if(t.effort === "deep") s -= 48;
    if(t.duration >= 60) s -= 26;
  }

  var rec = ctx.recent;
  if(ctx.heavy >= 2){
    if(t.effort === "easy"){ s += (mot==="motivated"?22:40); why.push("You've done enough heavy lifting for the moment. Quick win."); }
    if(t.effort === "deep") s -= 30;
  }
  if(rec.length >= 2 && rec[0].type === rec[1].type && t.type === rec[0].type) s -= 34;
  if(rec.length && t.type === rec[0].type && t.effort === rec[0].effort) s -= 12;

  if(t.postponedToday > 0){
    if(t.postponedToday >= 3){
      /* three dodges and it goes to the front of the queue, whatever it is */
      s += 110 + (t.postponedToday - 3) * 12;
      why.push("Dodged "+t.postponedToday+" times. It's not going anywhere.");
    } else if(isDueToday(t) || t.priority === "important"){
      s += t.postponedToday * 26;
      why.push("That's "+(t.postponedToday===2?"twice":t.postponedToday+" times")+" you've dodged this now.");
    } else if(t.priority === "optional"){ s -= t.postponedToday * 30; }
    else { s -= t.postponedToday * 10; }
  }

  var gap = ctx.runway.mins;
  if(t.duration > gap + 5){ s -= 150; why.push(""); }
  else if(gap < 25 && t.duration <= gap){ s += 30; why.push("It fits the gap you've got left."); }
  else if(gap - t.duration < 10){ s += 8; }
  if(ctx.runway.kind === "fixed" && gap <= 45 && t.duration <= gap - 3){
    why.push(fmtDur(gap)+" before "+ctx.runway.what+". This fits.");
  }
  var L = ctx.lunch;
  if(L && L.beforeWindow && L.minsToOpen <= 45){
    if(t.duration <= L.minsToOpen + 3){ s += 36; why.push(fmtDur(L.minsToOpen)+" before lunch. Knock out a quick one."); }
    else s -= (L.minsToOpen <= 30 ? 55 : 30);
  }
  if(ctx.minsLeftOfDay < 90 && t.duration >= 60 && !isDueToday(t)) s -= 24;
  s += Math.min(10, (Date.now() - t.createdAt) / (1000*60*60) * 2);
  return { score:s, why:why };
}

/* Everything selection ever looks at is one world's worth of tasks. Nothing
   from another planet can be chosen, counted, or hinted at. */
function planetPool(){
  var here = S.session.planet;
  return openTasks().filter(function(t){ return planetOf(t) === here; });
}
function chooseTask(){
  if(!S.session.planet) return { task:null, reason:"nowhere" };
  var fx = currentFixed();
  if(fx) return { task:fx, fixed:true, why:[] };
  /* The run-up to a commitment belongs to that commitment. */
  var pr = inPrepFor();
  if(pr) return { task:pr, fixed:true, prep:true, why:["It starts at "+pr.fixedStart+". This is the getting-ready time you asked for."] };

  var L = lunchInfo(), transit = isErrandPlanet(S.session.planet);
  if(!transit && (L.overdue || S.session.lunchState === "active")) return { lunch:true };

  var pool = planetPool().filter(function(t){ return !t.fixedStart && !isResting(t); }).filter(locationOK);
  if(!pool.length) return { task:null, reason:"none" };

  /* You said one of these was next. That isn't a scoring hint, it's an
     instruction — it goes to the front, and it stops shouting once you've
     started it, so a single urgent job can't bend the rest of your week. */
  var urgent = pool.filter(isUrgent);
  if(urgent.length){
    urgent.sort(function(a,b){ return (a.createdAt||0) - (b.createdAt||0); });
    S.ui.pinnedId = urgent[0].id;
    S.ui.lastServedId = urgent[0].id;
    return { task:urgent[0], urgent:true, why:["You said this one was next."],
             rest: pool.filter(function(x){ return x.id !== urgent[0].id; }) };
  }

  /* You can always pass on something, whatever it is. A dodged task steps out
     of the queue for a while — briefly if it matters, ages if it doesn't — and
     comes back near the top rather than at the bottom. It only reappears
     immediately if it's genuinely the last thing standing. */
  var eligible = pool.slice();
  var awake = pool.filter(function(t){ return !isDodged(t); });
  if(awake.length) pool = awake;

  var recent = recentDone(3);
  var ctx = {
    recent:recent, lunch:L, transit:transit,
    heavy: recent.filter(function(r){ return r.effort==="deep" || r.duration>=45; }).length,
    workingHours: workingHours(),
    workEasyWin: pool.some(function(t){
      return t.category === "Work" && (t.effort === "easy" || t.duration <= 15) &&
             !(t.lastPostponedAt && (Date.now() - t.lastPostponedAt) < 12*60000);
    }),
    runway: transit ? { mins:600, what:"", kind:"none" } : runway(),
    minsLeftOfDay: Math.max(0, hhmmToMins(S.settings.workUntil) - minsOfDay())
  };

  /* Once a task is on the orb it stays there until something actually changes.
     Without this the random tie-breaker could swap it out mid-glance. */
  if(S.ui.pinnedId){
    for(var pi=0; pi<eligible.length; pi++){
      if(eligible[pi].id === S.ui.pinnedId){
        if(!transit && eligible[pi].duration > ctx.runway.mins + 5) break;   /* wall moved — pick again */
        var kept = scoreTask(eligible[pi], ctx);
        return { task:eligible[pi], why:kept.why, pinned:true,
                 rest: pool.filter(function(x){ return x.id !== S.ui.pinnedId; }) };
      }
    }
    S.ui.pinnedId = null;
  }

  var ranked = pool.map(function(t){
    var r = scoreTask(t, ctx);
    return { task:t, score:r.score + Math.random()*4, why:r.why };
  }).sort(function(a,b){ return b.score - a.score; });

  var best = ranked[0];
  if(!transit && best.score < -60 && L.pending && L.inWindow) return { lunch:true, early:true };
  if(!transit && best.score < -60){
    /* Nothing fits in the gap before the next thing in the diary. Rather than an
       empty screen and a dead ten minutes, put that diary task up now — you can
       always start it early if you're ready for it. */
    var soon = ctx.runway.kind === "fixed" ? nextFixed(true) : null;
    if(soon && planetOf(soon) === S.session.planet){
      S.ui.pinnedId = null;
      return { task:soon, fixed:true, early:true, startsIn:Math.max(0, ctx.runway.mins),
               why:["Nothing else fits before it. Start it early if you're ready."] };
    }
    return { task:null, reason:"nofit", gap:ctx.runway };
  }
  best.rest = ranked.slice(1).filter(function(r){ return r.score > -900; }).map(function(r){ return r.task; });
  S.ui.pinnedId = best.task.id;
  S.ui.lastServedId = best.task.id;
  return best;
}

var audioCtx = null;
function chime(low){
  if(!S.settings.chime) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state === "suspended") audioCtx.resume();
    [0, .18].forEach(function(delay, i){
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "sine";
      o.frequency.value = low ? (i? 392:294) : (i? 659:523);
      g.gain.setValueAtTime(0.0001, audioCtx.currentTime + delay);
      g.gain.exponentialRampToValueAtTime(0.13, audioCtx.currentTime + delay + .02);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + delay + .5);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(audioCtx.currentTime + delay); o.stop(audioCtx.currentTime + delay + .55);
    });
  }catch(e){}
}

var Orb = { stage:null, swipe:null, holdT:null, moved:false, movedAt:0, twoFinger:false, moonAway:false };
