<meta name="theme-color" content="#E9EAEE" media="(prefers-color-scheme: light)">
<meta name="description" content="ONE - you don't have a whole list to deal with. You have ONE thing to do right now.">

<style>
/* ============================================================
   ONE — tokens
   Neutrals take their hue from wherever you are: --loc-h is the
   current location's hue, so the whole app shifts when you spin.
   Orange belongs to the orb and to acting now. Periwinkle is
   everything away from the desk. Mint is done.
   ============================================================ */
:root{
  --loc-h:215;
  --bg:hsl(var(--loc-h) 18% 93%);
  --surface:hsl(var(--loc-h) 30% 98.5%);
  --raised:hsl(var(--loc-h) 20% 95.5%);
  --ink:hsl(var(--loc-h) 26% 10%);
  --ink-2:hsl(var(--loc-h) 14% 33%);
  --muted:hsl(var(--loc-h) 10% 52%);
  --line:hsl(var(--loc-h) 22% 20% / .14);
  --line-2:hsl(var(--loc-h) 22% 20% / .07);
  --hi:#DC4B08; --hi-ink:#FFFFFF; --hi-soft:rgba(220,75,8,.10);
  --cool:#4E5BD1; --cool-soft:rgba(78,91,209,.10);
  --good:#0E8F60; --good-soft:rgba(14,143,96,.10);
  --shadow:0 1px 2px hsl(var(--loc-h) 30% 10% / .06), 0 8px 24px -12px hsl(var(--loc-h) 30% 10% / .18);
  --shadow-lg:0 2px 4px hsl(var(--loc-h) 30% 10% / .06), 0 24px 48px -20px hsl(var(--loc-h) 30% 10% / .28);
  --orb-glow:rgba(236,84,6,.40);
  --r:14px; --r-lg:20px;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  --mono:"Sometype Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:hsl(var(--loc-h) 20% 6.5%);
    --surface:hsl(var(--loc-h) 16% 11%);
    --raised:hsl(var(--loc-h) 14% 16%);
    --ink:hsl(var(--loc-h) 18% 94%);
    --ink-2:hsl(var(--loc-h) 12% 76%);
    --muted:hsl(var(--loc-h) 10% 58%);
    --line:hsl(var(--loc-h) 30% 92% / .11);
    --line-2:hsl(var(--loc-h) 30% 92% / .055);
    --hi:#FF6B1F; --hi-ink:#140B04; --hi-soft:rgba(255,107,31,.14);
    --cool:#98A5FF; --cool-soft:rgba(152,165,255,.14);
    --good:#46D39B; --good-soft:rgba(70,211,155,.14);
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px -14px rgba(0,0,0,.8);
    --shadow-lg:0 2px 6px rgba(0,0,0,.5), 0 30px 60px -24px rgba(0,0,0,.9);
    --orb-glow:rgba(255,107,31,.34);
  }
}
:root[data-theme="dark"]{
  --bg:hsl(var(--loc-h) 20% 6.5%);
  --surface:hsl(var(--loc-h) 16% 11%);
  --raised:hsl(var(--loc-h) 14% 16%);
  --ink:hsl(var(--loc-h) 18% 94%);
  --ink-2:hsl(var(--loc-h) 12% 76%);
  --muted:hsl(var(--loc-h) 10% 58%);
  --line:hsl(var(--loc-h) 30% 92% / .11);
  --line-2:hsl(var(--loc-h) 30% 92% / .055);
  --hi:#FF6B1F; --hi-ink:#140B04; --hi-soft:rgba(255,107,31,.14);
  --cool:#98A5FF; --cool-soft:rgba(152,165,255,.14);
  --good:#46D39B; --good-soft:rgba(70,211,155,.14);
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px -14px rgba(0,0,0,.8);
  --shadow-lg:0 2px 6px rgba(0,0,0,.5), 0 30px 60px -24px rgba(0,0,0,.9);
  --orb-glow:rgba(255,107,31,.34);
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--body);font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  transition:background-color .7s ease, color .7s ease;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hi);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}}

.app{max-width:540px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);position:relative;transition:background-color .7s ease}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:14px 18px 10px;backdrop-filter:blur(14px)}
.mark{font-family:var(--display);font-variation-settings:'wdth' 78,'wght' 900;font-size:19px;letter-spacing:.10em;line-height:1;color:var(--ink);opacity:.85}
.mark span{color:var(--hi)}
.topbar-spacer{flex:1}
.statchips{display:flex;gap:6px;justify-content:flex-end}
.statchip{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);background:transparent;white-space:nowrap;cursor:pointer;max-width:44vw;overflow:hidden;text-overflow:ellipsis}
.statchip:hover{border-color:var(--hi);color:var(--ink)}
.statchip.is-hi{color:var(--hi);border-color:color-mix(in srgb,var(--hi) 42%,transparent);background:var(--hi-soft)}
.statchip.is-cool{color:var(--cool);border-color:color-mix(in srgb,var(--cool) 42%,transparent);background:var(--cool-soft)}

main{flex:1;padding:6px 18px 150px;display:flex;flex-direction:column}
.screen{display:none;flex-direction:column;gap:16px}
.screen.is-on{display:flex;animation:rise .3s ease both}
#scr-now.is-on{justify-content:center;min-height:calc(100vh - 230px);gap:0}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:0;text-align:center}
.eyebrow.hot{color:var(--hi)} .eyebrow.cool{color:var(--cool)} .eyebrow.left{text-align:left}
h1.big{font-family:var(--display);font-variation-settings:'wdth' 84,'wght' 800;font-size:clamp(1.9rem,8vw,2.6rem);line-height:.95;letter-spacing:-.02em;text-transform:uppercase;margin:0;text-wrap:balance}
h2.sec{font-family:var(--display);font-variation-settings:'wdth' 88,'wght' 700;font-size:14px;letter-spacing:.1em;text-transform:uppercase;margin:0;color:var(--ink-2)}
.lede{color:var(--ink-2);margin:0;max-width:60ch}
.hint{font-size:13.5px;color:var(--muted);margin:0}
.stack{display:flex;flex-direction:column;gap:10px}
.divider{height:1px;background:var(--line-2);border:0;margin:2px 0}

.coach{display:flex;gap:10px;align-items:flex-start;padding:13px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.coach-mark{font-family:var(--display);font-variation-settings:'wdth' 75,'wght' 900;font-size:11px;letter-spacing:.08em;color:var(--hi);border:1.5px solid var(--hi);border-radius:5px;padding:2px 4px;line-height:1;margin-top:2px;flex:none}
.coach-lines{display:flex;flex-direction:column;gap:3px;font-size:15px;color:var(--ink)}
.coach-lines b{font-weight:700}

/* ============================================================
   THE ORB
   ============================================================ */
.orb-stage{
  --orb:min(88vw, 54vh, 460px);
  position:relative;width:calc(100% + 36px);margin:0 -18px;height:calc(var(--orb) + 62px);
  display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none;
}
.orb-wrap{position:relative;width:var(--orb);height:var(--orb);display:grid;place-items:center;transform:translateY(-16px)}
.orb-float{position:absolute;inset:0;animation:float 11s ease-in-out infinite;will-change:transform}
@keyframes float{0%,100%{transform:translateY(-5px)}50%{transform:translateY(6px)}}
.orb{
  position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(circle at 34% 24%, #FFDCB4 0%, #FFAE68 14%, #FF8236 34%, #F35D0C 58%, #B33403 84%, #7E2101 100%);
  box-shadow:0 34px 74px -26px var(--orb-glow), 0 0 0 1px rgba(120,32,0,.30),
             0 3px 1px rgba(255,255,255,.30) inset, 0 -30px 52px -24px rgba(84,18,0,.9) inset;
  transition:box-shadow .5s ease, background .6s ease;cursor:grab;touch-action:none;
}
.orb.grabbing{cursor:grabbing}
.orb.cool{
  background:radial-gradient(circle at 34% 24%, #EAEDFF 0%, #B9C2FF 15%, #8E9BF7 36%, #5C69DD 60%, #333C9C 86%, #212664 100%);
  box-shadow:0 34px 74px -26px rgba(78,91,209,.5), 0 0 0 1px rgba(30,34,90,.3),
             0 3px 1px rgba(255,255,255,.3) inset, 0 -30px 52px -24px rgba(20,24,70,.9) inset;
}
/* a clear location is a win, not a corpse — the sphere goes calm and green */
.orb.clear{
  background:radial-gradient(circle at 34% 24%, #EBFFF6 0%, #ABF2D3 15%, #63DCB0 36%, #22B686 60%, #0C7B57 86%, #07523A 100%);
  box-shadow:0 34px 74px -26px rgba(34,182,134,.45), 0 0 0 1px rgba(8,70,50,.3),
             0 3px 1px rgba(255,255,255,.32) inset, 0 -30px 52px -24px rgba(4,52,36,.9) inset;
}
.orb.clear .orb-face,.orb.clear .loc,.orb.clear .pick-item{color:#062E20}
.orb.clear .dial-mark{background:#062E20}
.orb.clear .orb-skin{
  background-image:
    radial-gradient(closest-side circle at 25% 42%, rgba(226,255,242,.9), rgba(226,255,242,0) 100%),
    radial-gradient(closest-side circle at 72% 66%, rgba(4,86,60,.8), rgba(4,86,60,0) 100%);
}

/* the press-and-hold task picker, spun through inside the sphere */
.orb-pick{position:absolute;left:11%;right:11%;top:50%;height:0;z-index:6}
.pick-item{
  position:absolute;left:50%;top:0;width:100%;
  appearance:none;border:0;background:transparent;color:#2B0C00;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px;
  transform-origin:50% 50%;will-change:transform,opacity;
}
.orb.cool .pick-item{color:#111436}
.pick-item b{
  font-family:var(--display);font-variation-settings:'wdth' 76,'wght' 900;
  font-size:clamp(.98rem,4.4vw,1.25rem);line-height:1;text-transform:uppercase;text-align:center;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.pick-item small{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.72}
.pick-item.on b{filter:url(#inkwarp)}
.orb.picking{cursor:ns-resize}
/* the living mass: two blurred bodies drifting on different cycles, shifted
   horizontally by the spin so the sphere reads as actually turning */
.orb-turn{position:absolute;inset:0;border-radius:50%;pointer-events:none;will-change:transform}
.orb-skin{
  position:absolute;inset:-14%;border-radius:50%;pointer-events:none;
  background-image:
    radial-gradient(closest-side circle at 25% 42%, rgba(255,226,190,.85), rgba(255,226,190,0) 100%),
    radial-gradient(closest-side circle at 72% 66%, rgba(158,44,0,.75), rgba(158,44,0,0) 100%);
  background-size:46% 46%, 38% 38%;
  background-repeat:repeat-x, repeat-x;
  background-position:calc(var(--spin,0) * 1px) 38%, calc(var(--spin,0) * -0.62px) 68%;
  filter:blur(15px);opacity:.62;mix-blend-mode:soft-light;
  animation:drift 17s ease-in-out infinite;
}
.orb.cool .orb-skin{
  background-image:
    radial-gradient(closest-side circle at 25% 42%, rgba(226,232,255,.9), rgba(226,232,255,0) 100%),
    radial-gradient(closest-side circle at 72% 66%, rgba(28,34,110,.8), rgba(28,34,110,0) 100%);
}
@keyframes drift{
  0%,100%{transform:translate3d(0,0,0) scale(1)}
  33%{transform:translate3d(-5%,3%,0) scale(1.06)}
  66%{transform:translate3d(4%,-4%,0) scale(.97)}
}
.orb-breath{position:absolute;inset:-3%;border-radius:50%;pointer-events:none;box-shadow:0 0 54px 4px var(--orb-glow);animation:breath 8.5s ease-in-out infinite}
@keyframes breath{0%,100%{opacity:.34;transform:scale(.97)}50%{opacity:.62;transform:scale(1.03)}}
.orb::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;background:radial-gradient(58% 40% at 31% 17%, rgba(255,255,255,.55), transparent 72%)}

.orb-face{
  position:relative;z-index:3;width:74%;text-align:center;color:#2B0C00;
  display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;
  transition:opacity .26s ease, transform .34s cubic-bezier(.2,.8,.25,1), filter .26s ease;
}
.orb.cool .orb-face{color:#111436}
.orb-stage.spinning .orb-face{opacity:0;transform:translateY(12px) scale(.92);filter:blur(10px)}
.orb-face.surfacing{animation:surface .68s cubic-bezier(.16,.84,.3,1) both}
@keyframes surface{
  0%{opacity:0;transform:translateY(26px) scale(.78);filter:blur(18px)}
  45%{opacity:.9;transform:translateY(4px) scale(1.03);filter:blur(3px)}
  70%{transform:translateY(0) scale(.995);filter:blur(0)}
  100%{opacity:1;transform:none;filter:blur(0)}
}
.orb-task{
  font-family:var(--display);font-variation-settings:'wdth' 74,'wght' 900;
  font-size:clamp(1.18rem,6vw,1.72rem);line-height:1.0;letter-spacing:-.008em;
  text-transform:uppercase;text-wrap:balance;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;
  text-shadow:0 1px 0 rgba(255,224,190,.28), 0 -1px 1px rgba(90,22,0,.30);
  filter:url(#inkwarp);
}
@media (prefers-reduced-motion:reduce){ .orb-task{filter:none} }
.orb-sub{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.74}
.orb-clock{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums;font-size:clamp(2.3rem,11.5vw,3rem);letter-spacing:-.03em;line-height:1}
.orb-count{font-family:var(--display);font-variation-settings:'wdth' 80,'wght' 900;font-size:clamp(3rem,15vw,4rem);line-height:.9;font-variant-numeric:tabular-nums}

/* one ring, two meanings: the day when idle, the countdown when running */
.orb-ring{position:absolute;inset:-15px;pointer-events:none;transform:rotate(-90deg);z-index:2}
.orb-ring circle{fill:none;stroke-width:3;stroke-linecap:round}
.orb-ring .t-track{stroke:var(--line)}
.orb-ring .t-prog{stroke:var(--ink-2);opacity:.5;transition:stroke-dashoffset .6s cubic-bezier(.3,.9,.4,1)}
.orb-ring.running .t-prog{stroke:var(--hi);opacity:1;stroke-width:4;transition:stroke-dashoffset .5s linear}
.orb-ring.over .t-prog{stroke:var(--cool)}

.swipe-hint{position:absolute;z-index:4;font-family:var(--display);font-variation-settings:'wdth' 90,'wght' 800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);opacity:0;transition:opacity .16s ease;pointer-events:none;white-space:nowrap}
.swipe-hint.on{opacity:1}
.swipe-hint.l{left:2px;top:46%;transform:translateY(-50%)}
.swipe-hint.r{right:2px;top:46%;transform:translateY(-50%);color:var(--good)}
.swipe-hint.u{top:4px;left:50%;transform:translateX(-50%);color:var(--cool)}
.swipe-hint.d{bottom:4px;left:50%;transform:translateX(-50%)}

/* the dial rides the sphere itself, like a safe or a thermostat: the live
   location sits at 12 o'clock, its neighbours fade away at 10 and 2 */
.orb-dial{position:absolute;inset:0;z-index:4;pointer-events:none}
.loc{
  position:absolute;left:50%;top:50%;
  font-family:var(--display);font-variation-settings:'wdth' 82,'wght' 800;
  font-size:12px;letter-spacing:.13em;text-transform:uppercase;
  color:#2B0C00;white-space:nowrap;max-width:52%;overflow:hidden;text-overflow:ellipsis;
  padding:3px 6px;border:0;background:transparent;cursor:pointer;pointer-events:auto;
  will-change:transform,opacity;transform-origin:50% 50%;
}
.orb.cool .loc{color:#111436}
.loc.sel{font-variation-settings:'wdth' 86,'wght' 900}
.dial-mark{
  position:absolute;left:50%;top:3.2%;width:2px;height:11px;margin-left:-1px;border-radius:2px;
  background:#2B0C00;opacity:.5;z-index:5;pointer-events:none;
}
.orb.cool .dial-mark{background:#111436}

.committed-note{
  margin:14px auto 0;max-width:34ch;text-align:center;
  display:flex;flex-direction:column;gap:4px;
  padding:12px 14px;border-radius:var(--r);
  border:1px solid color-mix(in srgb,var(--hi) 40%,transparent);background:var(--hi-soft);
}
.committed-note b{font-family:var(--display);font-variation-settings:'wdth' 90,'wght' 800;font-size:14px;letter-spacing:.02em;color:var(--hi)}
.committed-note span{font-size:13.5px;color:var(--ink-2);line-height:1.35}
.runway{text-align:center;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin:2px 0 0}
.dayline{text-align:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:8px 0 0}

.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:14px 16px;cursor:pointer;font-family:var(--display);font-variation-settings:'wdth' 92,'wght' 700;font-size:14px;letter-spacing:.09em;text-transform:uppercase;transition:transform .12s ease,background .16s ease,border-color .16s ease,filter .16s ease;min-height:50px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{border-color:var(--hi)}
.btn:active{transform:scale(.985)}
.btn.go{background:var(--ink);color:var(--bg);border-color:var(--ink);font-size:17px;letter-spacing:.12em;min-height:58px;font-variation-settings:'wdth' 88,'wght' 800}
.btn.go:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent}
.btn.quiet{font-family:var(--body);font-size:14px;letter-spacing:0;text-transform:none;font-variation-settings:normal;font-weight:600;color:var(--ink-2);min-height:46px}
.btn.wide{width:100%}
.btn.sm{min-height:38px;padding:8px 12px;font-size:12px}
.btn.danger:hover{border-color:var(--hi);color:var(--hi)}
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1}

.field{display:flex;flex-direction:column;gap:9px}
.field > label{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.choices{display:flex;gap:8px;flex-wrap:wrap}
.choice{appearance:none;cursor:pointer;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);padding:11px 13px;font-weight:600;font-size:14px;min-height:44px;transition:border-color .14s ease,color .14s ease,background .14s ease}
.choice:hover{border-color:var(--ink-2)}
.choice[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.choice.cool[aria-pressed="true"]{background:var(--cool);border-color:var(--cool);color:var(--surface)}
.choice small{display:block;font-weight:500;font-size:11.5px;opacity:.75;letter-spacing:0}
.grow{flex:1}
input[type="text"],input[type="time"],input[type="number"],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:11px;padding:13px 14px;min-height:48px}
input::placeholder,textarea::placeholder{color:var(--muted)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--hi)}
.inline{display:flex;gap:10px;align-items:center}

.mic{appearance:none;flex:none;width:50px;min-height:48px;border-radius:11px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);cursor:pointer;display:flex;align-items:center;justify-content:center}
.mic:hover{border-color:var(--hi);color:var(--hi)}
.mic svg{width:19px;height:19px;fill:currentColor}
.mic.on{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);animation:micpulse 1.5s ease-in-out infinite}
@keyframes micpulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--hi) 45%,transparent)}70%{box-shadow:0 0 0 12px transparent}}
.heard{font-size:13px;color:var(--cool);font-style:italic}
.heard:empty{display:none}
.stepper{display:flex;align-items:center;gap:8px}

.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);max-width:540px;margin:0 auto;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line-2);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}

.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:-14px;background:var(--surface);padding:6px 0 4px;margin-top:-6px;z-index:2}

</style>

<body>
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">

      <animate attributeName="baseFrequency" dur="26s" repeatCount="indefinite"
               values="0.013 0.021; 0.019 0.014; 0.011 0.024; 0.013 0.021"></animate>

<script>
(function(){
"use strict";

/* ============================================================
   1. STORAGE
   ============================================================ */
var KEY = "one.app.v1";
var CAN_STORE = (function(){
  try{ localStorage.setItem(KEY+".probe","1"); localStorage.removeItem(KEY+".probe"); return true; }catch(e){ return false; }
})();
var save = function(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };
var load = function(){ try{ return JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){ return null; } };
function pad(n){ return (n<10?"0":"")+n; }
var todayKey = function(d){ d = d || new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); };

var DEFAULT_LOCATIONS = [
  { id:"home", label:"Home",        kind:"place",   hue:150 },
  { id:"work", label:"Work",        kind:"place",   hue:215 },
  { id:"out",  label:"Out & About", kind:"transit", hue:285 }
];
var DEFAULT_SCHEDULE = [
  { from:"00:00", to:"08:00", loc:"home" },
  { from:"08:00", to:"09:00", loc:"out"  },
  { from:"09:00", to:"17:00", loc:"work" },
  { from:"17:00", to:"18:00", loc:"out"  },
  { from:"18:00", to:"23:59", loc:"home" }
];
var HUE_POOL = [35, 190, 320, 95, 260, 10];

var DEFAULTS = {
  version:3,
  profile:{ name:"", tone:"normal", sawGestures:false },
  settings:{
    lunchDuration:45, lunchFrom:"12:00", lunchTo:"13:00", lunchRequired:true,
    workUntil:"17:30", defaultDuration:30, autoLocation:true, warnMinutes:10, chime:true
  },
  locations: JSON.parse(JSON.stringify(DEFAULT_LOCATIONS)),
  schedule: JSON.parse(JSON.stringify(DEFAULT_SCHEDULE)),
  session:{
    date:null, started:false, motivation:"meh", location:"work", lastPlace:"work", segIndex:-1,
    lunchState:"pending", lunchEndsAt:null, workFinished:false, dayClosed:false, briefed:false, spun:false
  },
  tasks:[], focus:null, history:[],
  ui:{ tab:"now", arrival:null, pinnedId:null },
  log:[]
};

var S = load() || JSON.parse(JSON.stringify(DEFAULTS));
(function fill(){
  var d = DEFAULTS, k;
  for(k in d){ if(!(k in S)) S[k] = JSON.parse(JSON.stringify(d[k])); }
  ["session","settings","ui","profile"].forEach(function(g){
    for(var k2 in d[g]){ if(!(k2 in S[g])) S[g][k2] = d[g][k2]; }
  });
})();

(function migrate(){
  if(!Array.isArray(S.locations) || !S.locations.length) S.locations = JSON.parse(JSON.stringify(DEFAULT_LOCATIONS));
  if(!Array.isArray(S.schedule) || !S.schedule.length) S.schedule = JSON.parse(JSON.stringify(DEFAULT_SCHEDULE));
  var KNOWN_HUES = { home:150, work:215, out:285 };
  S.locations.forEach(function(l,i){
    if(typeof l.hue !== "number") l.hue = KNOWN_HUES[l.id] != null ? KNOWN_HUES[l.id] : HUE_POOL[i % HUE_POOL.length];
  });

  var legacy = { home:"home", work:"work", "else":"out", errand:"out" };
  if(legacy[S.session.location]) S.session.location = legacy[S.session.location];
  if(!locById(S.session.location)) S.session.location = (S.locations[0]||{}).id;

  ["lunchRequired","lunchFrom","lunchTo","lunchDuration","workUntil"].forEach(function(k){
    if(S.session[k] != null && S.settings[k] == null) S.settings[k] = S.session[k];
  });

  S.tasks.forEach(function(t){
    if(!Array.isArray(t.locations)){
      var one = t.location;
      if(legacy[one]) one = legacy[one];
      if(!one || (one !== "anywhere" && !locById(one))) one = "anywhere";
      t.locations = [one];
      delete t.location;
    }
    if(!("fixedStart" in t)) t.fixedStart = null;
    if(!("fixedEnd" in t)) t.fixedEnd = null;
    if(!("warned" in t)) t.warned = false;
    if(!("repeatEvery" in t)) t.repeatEvery = 0;
    if(!("nextDueAt" in t)) t.nextDueAt = null;
    if(!("checkCount" in t)) t.checkCount = 0;
    if(!("originalEstimate" in t)) t.originalEstimate = null;
    if(!("extensions" in t)) t.extensions = 0;
    if(!("commit" in t)) t.commit = null;
    if(!("safeStopped" in t)) t.safeStopped = false;
    if(!("unblocks" in t)) t.unblocks = null;
  });
  S.version = 3;
})();

(function rollover(){
  var t = todayKey();
  if(S.session.date !== t){
    var keep = locById(S.session.location) ? S.session.location : (S.locations[0]||{}).id;
    S.session = JSON.parse(JSON.stringify(DEFAULTS.session));
    S.session.date = t;
    S.session.location = keep;
    S.session.lastPlace = isTransit(keep) ? (((places()[0]||{}).id) || keep) : keep;
    S.focus = null; S.ui.arrival = null; S.ui.pinnedId = null;
    S.tasks.forEach(function(x){
      if(x.status === "done") x.archived = true;
      x.postponedToday = 0; x.lastPostponedAt = null; x.warned = false;
      x.nextDueAt = null; x.checkCount = 0;
      x.commit = null; x.safeStopped = false;
    });
    save();
  }
})();

/* ============================================================
   2. TIME
   ============================================================ */
function now(){ return new Date(); }
function minsOfDay(d){ d = d||now(); return d.getHours()*60 + d.getMinutes(); }
function hhmmToMins(s){ if(!s) return null; var p = String(s).split(":"); return (+p[0])*60 + (+p[1]); }
function minsToHHMM(m){ m = Math.max(0, Math.min(1439, Math.round(m))); return pad(Math.floor(m/60))+":"+pad(m%60); }
function fmtDur(mins){
  mins = Math.max(0, Math.round(mins));
  if(mins < 60) return mins+"m";
  var h = Math.floor(mins/60), m = mins%60;
  return h+"h"+(m? " "+m+"m":"");
}
function mmss(sec){
  var neg = sec < 0; sec = Math.abs(Math.round(sec));
  return (neg?"+":"")+pad(Math.floor(sec/60))+":"+pad(sec%60);
}

/* ============================================================
   3. LOCATIONS + DAY SHAPE
   ============================================================ */
function locById(id){
  if(!Array.isArray(S.locations)) return null;
  for(var i=0;i<S.locations.length;i++) if(S.locations[i].id === id) return S.locations[i];
  return null;
}
function isTransit(id){ var l = locById(id); return !!l && l.kind === "transit"; }
function locLabel(id){ if(id === "anywhere") return "Anywhere"; var l = locById(id); return l ? l.label : "Anywhere"; }
function locHue(id){ var l = locById(id); return l ? l.hue : 215; }
function places(){ return S.locations.filter(function(l){ return l.kind === "place"; }); }
function transitLocs(){ return S.locations.filter(function(l){ return l.kind === "transit"; }); }
function locIndex(id){ for(var i=0;i<S.locations.length;i++) if(S.locations[i].id===id) return i; return 0; }
function slug(s){
  var base = String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "place";
  var id = base, n = 2;
  while(locById(id)){ id = base+"-"+n; n++; }
  return id;
}
function sortedSchedule(){ return S.schedule.slice().sort(function(a,b){ return hhmmToMins(a.from) - hhmmToMins(b.from); }); }
function segmentAt(m){
  var seg = sortedSchedule();
  for(var i=0;i<seg.length;i++){
    var f = hhmmToMins(seg[i].from), t = hhmmToMins(seg[i].to);
    if(m >= f && m < (t <= f ? 1440 : t)) return { seg:seg[i], i:i };
  }
  return null;
}
/* the schedule drives location; a manual spin holds until the next change */
function applySchedule(){
  if(!S.settings.autoLocation) return false;
  var hit = segmentAt(minsOfDay());
  if(!hit || hit.i === S.session.segIndex) return false;
  S.session.segIndex = hit.i;
  if(locById(hit.seg.loc) && hit.seg.loc !== S.session.location){
    S.session.location = hit.seg.loc;
    if(!isTransit(hit.seg.loc)) S.session.lastPlace = hit.seg.loc;
    return true;
  }
  return false;
}
function applyHue(){ document.documentElement.style.setProperty("--loc-h", String(locHue(S.session.location))); }

/* ============================================================
   4. VOCABULARY
   ============================================================ */
var PRIORITY_ORDER = ["optional","normal","important","must"];
var PRIORITY = { must:"Must do today", important:"Important", normal:"Normal", optional:"Optional" };
var EFFORT_ORDER = ["easy","normal","deep"];
var EFFORT = { easy:"Easy win", normal:"Normal", deep:"Deep work" };
var TYPES = ["Admin","Email","Physical","Planning","Creative","Deep Work","Errand","Meeting","Personal Project"];
var BLOCK_REASONS = ["Waiting for someone","Need information","Need equipment/materials","Wrong location","Can't access it right now","Other"];
var HOUSEHOLD = /\b(bin|bins|rubbish|recycling|washing|laundry|dishes|dishwasher|kitchen|tidy|hoover|vacuum|garage|ironing|beds?)\b/i;
var ERRANDY = /\b(petrol|diesel|fuel|milk|bread|shop|shopping|groceries|chemist|pharmacy|post office|parcel|bank|collect|pick up|pickup|drop off|dry clean|car wash|cash)\b/i;

/* ============================================================
   5. COACH
   ============================================================ */
function who(){ return (S.profile.name||"").trim().toUpperCase(); }
function tone(){ return S.profile.tone || "normal"; }
function pickOne(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
var VOICE = {
  gentle:{

/* ============================================================
   6. TASKS
   ============================================================ */
function uid(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function makeTask(o){
  return {
    id:uid(), name:(o.name||"Untitled").trim(),
    category:o.category||"Work", priority:o.priority||"normal", effort:o.effort||"normal",
    duration:o.duration||S.settings.defaultDuration,
    locations:(o.locations && o.locations.length) ? o.locations.slice() : ["anywhere"],
    type:o.type||"Admin",
    fixedStart:o.fixedStart||null, fixedEnd:o.fixedEnd||null, warned:false,
    unblocks:o.unblocks||null,
    repeatEvery:o.repeatEvery||0, nextDueAt:null, checkCount:0,
    status:"open", blockedReason:null, postponedToday:0, lastPostponedAt:null,
    actualMinutes:0, createdAt:Date.now(), completedAt:null, archived:false

}
function liveTasks(){ return S.tasks.filter(function(t){ return !t.archived; }); }
function byId(id){ for(var i=0;i<S.tasks.length;i++) if(S.tasks[i].id===id) return S.tasks[i]; return null; }
function openTasks(){ return liveTasks().filter(function(t){ return t.status==="open"; }); }
function doneToday(){
  var d = todayKey();
  return S.tasks.filter(function(t){ return t.status==="done" && t.completedAt && todayKey(new Date(t.completedAt))===d; });
}
function transitTasks(){
  var ids = transitLocs().map(function(l){ return l.id; });
  return openTasks().filter(function(t){ return !t.fixedStart && !isCooling(t) && t.locations.some(function(l){ return ids.indexOf(l) > -1; }); });
}
/* ============================================================
   COMMITTED TASKS
   The ordinary timer exists to stop you drifting. This is the
   opposite case: the timer ran out but stopping now would cost
   more than carrying on. It is a conscious re-commitment, not a
   licence to ignore the clock — every extension is re-estimated.
   ============================================================ */
var COMMIT_REASONS = [
  "Work would be unsafe or incomplete",
  "Equipment or work area is dismantled",
  "I've reached a point of no return",
  "Stopping now would create more work",
  "Unexpected problems made it much bigger",
  "Other"
];
var COMMIT_MINUTES = [15, 30, 45, 60, 90];
function isCommitted(t){ return !!(t && t.commit && t.commit.on); }
function committedTask(){
  var f = S.focus; if(!f) return null;
  var t = byId(f.taskId);
  return isCommitted(t) ? t : null;
}
function spentOn(t){ return Math.round(t.actualMinutes || 0); }
/* everything worth learning from a run, kept beyond the task's own life */
function recordRun(t, outcome, extraMins){
  if(!t) return;
  var rec = {
    at: Date.now(), date: todayKey(), name: t.name, type: t.type,
    est: t.originalEstimate || t.duration,
    actual: (t.actualMinutes || 0) + (extraMins || 0),
    extensions: t.extensions || 0,
    committed: isCommitted(t),
    reasons: isCommitted(t) ? t.commit.reasons.slice() : [],
    added: isCommitted(t) ? t.commit.added.slice() : [],
    outcome: outcome
  };
  if(!Array.isArray(S.history)) S.history = [];
  S.history.push(rec);
  if(S.history.length > 400) S.history = S.history.slice(-400);
  return rec;
}
function isRecurring(t){ return !!(t.repeatEvery && t.repeatEvery > 0); }
/* how long a dodged task stays out of the way */
function dodgeRestMins(t){
  if(t.priority === "must") return 12;
  if(t.priority === "important") return 20;
  if(t.priority === "optional") return 120;
  return 35;
}
function isDodged(t){
  return !!(t.lastPostponedAt && (Date.now() - t.lastPostponedAt) < dodgeRestMins(t)*60000);
}
function isCooling(t){ return isRecurring(t) && t.nextDueAt && Date.now() < t.nextDueAt; }
function coolMins(t){ return isCooling(t) ? Math.max(1, Math.round((t.nextDueAt - Date.now())/60000)) : 0; }
function overdueMins(t){
  if(!isRecurring(t) || !t.nextDueAt) return 0;
  return Math.max(0, Math.round((Date.now() - t.nextDueAt)/60000));
}
/* a check-in doesn't finish the task — it restarts its clock */
function checkTask(t, mins){
  unpin();
  releaseNags();
  t.checkCount = (t.checkCount||0) + 1;
  t.nextDueAt = Date.now() + t.repeatEvery*60000;
  t.actualMinutes = (t.actualMinutes||0) + (mins || 0);
  t.postponedToday = 0; t.lastPostponedAt = null;
  S.log.push({ date:todayKey(), taskId:t.id, name:t.name, type:t.type, minutes:mins || 0, at:Date.now(), kind:"check" });
  save();
}
function finishRecurring(t){
  t.status = "done"; t.completedAt = Date.now(); t.nextDueAt = null;
  S.log.push({ date:todayKey(), taskId:t.id, name:t.name, type:t.type, minutes:0, at:Date.now(), kind:"done" });
  save();
}
function repeatLabel(mins){
  if(!mins) return "";
  return mins % 60 === 0 ? "every "+(mins/60)+"h" : "every "+mins+"m";
}
function taskEndMins(t){
  if(!t.fixedStart) return null;
  return t.fixedEnd ? hhmmToMins(t.fixedEnd) : hhmmToMins(t.fixedStart) + t.duration;
}
function fixedToday(){
  return openTasks().filter(function(t){ return !!t.fixedStart; })
    .sort(function(a,b){ return hhmmToMins(a.fixedStart) - hhmmToMins(b.fixedStart); });
}
/* An appointment still belongs to wherever you said it happens. Pinned to
   Work, it won't hijack the orb while you're at home — the topbar chip still
   warns you about it. */
function currentFixed(){
  var m = minsOfDay(), f = fixedToday();
  for(var i=0;i<f.length;i++){
    if(m >= hhmmToMins(f[i].fixedStart) && m < taskEndMins(f[i]) && locationOK(f[i])) return f[i];
  }
  return null;
}
function nextFixed(hereOnly){
  var m = minsOfDay(), f = fixedToday();
  for(var i=0;i<f.length;i++){
    if(hhmmToMins(f[i].fixedStart) > m && (!hereOnly || locationOK(f[i]))) return f[i];
  }
  return null;
}

/* ============================================================
   7. LUNCH + RUNWAY
   ============================================================ */
function lunchInfo(){
  var st = S.settings, from = hhmmToMins(st.lunchFrom), to = hhmmToMins(st.lunchTo), m = minsOfDay();
  var pending = st.lunchRequired && S.session.lunchState === "pending";
  return {
    required:st.lunchRequired, pending:pending, active:S.session.lunchState==="active",
    from:from, to:to,
    beforeWindow:pending && m < from, inWindow:pending && m >= from && m < to, overdue:pending && m >= to,
    minsToOpen:from - m, minsToForce:to - m
  };
}
/* the next wall you'll hit, and what it is */
function runway(){
  var m = minsOfDay(), L = lunchInfo(), end = hhmmToMins(S.settings.workUntil), nf = nextFixed(true), walls = [];
  if(nf) walls.push({ mins:hhmmToMins(nf.fixedStart) - m, what:nf.name+" at "+nf.fixedStart, kind:"fixed" });
  if(L.pending) walls.push({ mins:Math.max(0, L.to - m), what:"lunch", kind:"lunch" });
  if(!S.session.workFinished && end != null && end > m) walls.push({ mins:end - m, what:"the end of the day", kind:"day" });
  if(!walls.length) return { mins:600, what:"", kind:"none" };
  walls.sort(function(a,b){ return a.mins - b.mins; });
  return walls[0];
}
function workingHours(){
  if(S.session.workFinished) return false;
  var end = hhmmToMins(S.settings.workUntil);
  return end == null ? true : minsOfDay() < end;
}
function departureImminent(){
  if(isTransit(S.session.location)) return false;
  if(!transitTasks().length) return false;
  if(S.session.workFinished) return true;
  var left = hhmmToMins(S.settings.workUntil) - minsOfDay();
  return left <= 45 && left > -120;
}

/* ============================================================
   8. SELECTION ENGINE
   ============================================================ */
function locationOK(t){
  var here = S.session.location;
  if(isTransit(here)) return t.locations.indexOf(here) > -1;
  return t.locations.indexOf("anywhere") > -1 || t.locations.indexOf(here) > -1;
}
function recentDone(n){
  return doneToday().sort(function(a,b){ return b.completedAt - a.completedAt; }).slice(0,n);
}
function scoreTask(t, ctx){
  var s = 0, why = [];
  s += ({must:110, important:64, normal:32, optional:8})[t.priority];

  if(ctx.transit){ s += Math.max(0, 40 - t.duration); return { score:s, why:why }; }

  /* Work outranks personal during working hours — full stop. The single
     exception: you've just done heavy lifting, there is no quick work job
     going, and the personal one is a genuine easy win you can do here. */
  if(ctx.workingHours && t.category === "Personal"){
    var breather = ctx.heavy >= 2 && t.effort === "easy" && !ctx.workEasyWin;
    if(breather){ s += 26; why.push("No quick work job going. Take the easy one as a breather."); }
    else return { score:-999, why:[] };
  }

  /* check-ins are small wins that get louder the longer they're overdue */
  if(isRecurring(t)){
    s += 18 + Math.min(46, overdueMins(t) * 0.7);
    if(t.checkCount) why.push("Time for another look at this.");
  }

  var mot = S.session.motivation;
  if(mot === "motivated"){
    if(t.effort === "deep"){ s += 38; why.push("You're motivated. Don't waste that on easy wins."); }
    if(t.effort === "easy") s -= 22;
    if(t.duration >= 45) s += 10;
  } else if(mot === "meh"){
    if(t.effort === "easy") s += 14;
    if(t.effort === "deep") s -= 12;
  } else {
    if(t.effort === "easy"){ s += 52; why.push("We're starting small. Momentum first."); }
    if(t.duration <= 15) s += 26;
    if(t.effort === "deep") s -= 48;
    if(t.duration >= 60) s -= 26;
  }

  var rec = ctx.recent;
  if(ctx.heavy >= 2){
    if(t.effort === "easy"){ s += (mot==="motivated"?22:40); why.push("You've done enough heavy lifting for the moment. Quick win."); }
    if(t.effort === "deep") s -= 30;
  }
  if(rec.length >= 2 && rec[0].type === rec[1].type && t.type === rec[0].type) s -= 34;
  if(rec.length && t.type === rec[0].type && t.effort === rec[0].effort) s -= 12;

  if(t.postponedToday > 0){
    if(t.postponedToday >= 3){
      /* three dodges and it goes to the front of the queue, whatever it is */
      s += 110 + (t.postponedToday - 3) * 12;
      why.push("Dodged "+t.postponedToday+" times. It's not going anywhere.");
    } else if(t.priority === "must" || t.priority === "important"){
      s += t.postponedToday * 26;
      why.push("That's "+(t.postponedToday===2?"twice":t.postponedToday+" times")+" you've dodged this now.");
    } else if(t.priority === "optional"){ s -= t.postponedToday * 30; }
    else { s -= t.postponedToday * 10; }
  }

  var gap = ctx.runway.mins;
  if(t.duration > gap + 5){ s -= 150; why.push(""); }
  else if(gap < 25 && t.duration <= gap){ s += 30; why.push("It fits the gap you've got left."); }
  else if(gap - t.duration < 10){ s += 8; }
  if(ctx.runway.kind === "fixed" && gap <= 45 && t.duration <= gap - 3){
    why.push(fmtDur(gap)+" before "+ctx.runway.what+". This fits.");
  }
  var L = ctx.lunch;
  if(L && L.beforeWindow && L.minsToOpen <= 45){
    if(t.duration <= L.minsToOpen + 3){ s += 36; why.push(fmtDur(L.minsToOpen)+" before lunch. Knock out a quick one."); }
    else s -= (L.minsToOpen <= 30 ? 55 : 30);
  }
  if(ctx.minsLeftOfDay < 90 && t.duration >= 60 && t.priority !== "must") s -= 24;
  s += Math.min(10, (Date.now() - t.createdAt) / (1000*60*60) * 2);
  return { score:s, why:why };
}

function chooseTask(){
  var fx = currentFixed();
  if(fx) return { task:fx, fixed:true, why:[] };

  var L = lunchInfo(), transit = isTransit(S.session.location);
  if(!transit && (L.overdue || S.session.lunchState === "active")) return { lunch:true };

  var pool = openTasks().filter(function(t){ return !t.fixedStart && !isCooling(t); }).filter(locationOK);
  if(!transit && S.session.workFinished) pool = pool.filter(function(t){ return t.category !== "Work"; });
  if(!pool.length) return { task:null, reason:"none" };

  /* You can always pass on something, whatever it is. A dodged task steps out
     of the queue for a while — briefly if it matters, ages if it doesn't — and
     comes back near the top rather than at the bottom. It only reappears
     immediately if it's genuinely the last thing standing. */
  var eligible = pool.slice();
  var awake = pool.filter(function(t){ return !isDodged(t); });
  if(awake.length) pool = awake;

  var recent = recentDone(3);
  var ctx = {
    recent:recent, lunch:L, transit:transit,
    heavy: recent.filter(function(r){ return r.effort==="deep" || r.duration>=45; }).length,
    workingHours: workingHours(),
    workEasyWin: pool.some(function(t){
      return t.category === "Work" && (t.effort === "easy" || t.duration <= 15) &&
             !(t.lastPostponedAt && (Date.now() - t.lastPostponedAt) < 12*60000);
    }),
    runway: transit ? { mins:600, what:"", kind:"none" } : runway(),
    minsLeftOfDay: Math.max(0, hhmmToMins(S.settings.workUntil) - minsOfDay())
  };

  /* Once a task is on the orb it stays there until something actually changes.
     Without this the random tie-breaker could swap it out mid-glance. */
  if(S.ui.pinnedId){
    for(var pi=0; pi<eligible.length; pi++){
      if(eligible[pi].id === S.ui.pinnedId){
        if(!transit && eligible[pi].duration > ctx.runway.mins + 5) break;   /* wall moved — pick again */
        var kept = scoreTask(eligible[pi], ctx);
        return { task:eligible[pi], why:kept.why, pinned:true,
                 rest: pool.filter(function(x){ return x.id !== S.ui.pinnedId; }) };
      }
    }
    S.ui.pinnedId = null;
  }

  var ranked = pool.map(function(t){
    var r = scoreTask(t, ctx);
    return { task:t, score:r.score + Math.random()*4, why:r.why };
  }).sort(function(a,b){ return b.score - a.score; });

  var best = ranked[0];
  if(!transit && best.score < -60 && L.pending && L.inWindow) return { lunch:true, early:true };
  if(!transit && best.score < -60) return { task:null, reason:"nofit", gap:ctx.runway };
  best.rest = ranked.slice(1).filter(function(r){ return r.score > -900; }).map(function(r){ return r.task; });
  S.ui.pinnedId = best.task.id;
  return best;
}

var audioCtx = null;
function chime(low){
  if(!S.settings.chime) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state === "suspended") audioCtx.resume();
    [0, .18].forEach(function(delay, i){
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "sine";
      o.frequency.value = low ? (i? 392:294) : (i? 659:523);
      g.gain.setValueAtTime(0.0001, audioCtx.currentTime + delay);
      g.gain.exponentialRampToValueAtTime(0.13, audioCtx.currentTime + delay + .02);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + delay + .5);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(audioCtx.currentTime + delay); o.stop(audioCtx.currentTime + delay + .55);
    });
  }catch(e){}
}

    '<span class="swipe-hint r" id="hint-r">Done</span>'+
    '<span class="swipe-hint u" id="hint-u">Can\'t yet</span>'+
    '<span class="swipe-hint d" id="hint-d">Add task</span>'+
  '</div>';
}
function faceTask(t, sub){
  return '<div class="orb-task">'+esc(t.name)+'</div><div class="orb-sub">'+esc(sub || (t.duration+" min · "+t.type))+'</div>';
}
function orbMount(){
  var stage = document.getElementById("orbStage");
  Orb.stage = stage;
  if(!stage) return;
  Orb.labels = [].slice.call(stage.querySelectorAll(".loc"));
  Orb.n = Orb.labels.length;
  Orb.pos = locIndex(S.session.location);
  Orb.vel = 0; Orb.snapping = false; Orb.spinning = false; Orb.twoFinger = false;
  orbLayout();

  var orb = document.getElementById("orb");
  if(orb) orb.addEventListener("pointerdown", orbDown);

  stage.addEventListener("touchstart", function(e){
    if(e.touches.length >= 2){
      Orb.twoFinger = true; Orb.moved = false;
      Orb.lastTwist = twistAngle(e);
      Orb.lastT = performance.now(); Orb.vel = 0; Orb.snapping = false;
      if(Orb.swipe) cancelSwipe();
      if(Orb.bezel) endBezel();
    }
  }, { passive:true });
  stage.addEventListener("touchmove", function(e){
    if(!Orb.twoFinger || e.touches.length < 2) return;
    var a = twistAngle(e), twist = normAngle(a - Orb.lastTwist);
    Orb.lastTwist = a;
    applySpin(-twist / SPREAD, Math.abs(twist) > 0.004);   /* markings follow your fingers */
    e.preventDefault();
  }, { passive:false });
  stage.addEventListener("touchend", function(e){
    if(Orb.twoFinger && e.touches.length < 2){ Orb.twoFinger = false; orbRun(); }
  });

  Orb.labels.forEach(function(el){
    el.addEventListener("click", function(ev){
      ev.stopPropagation();
      if(Orb.moved && performance.now() - Orb.movedAt < 320) return;   /* that was a turn */
      orbStepTo(+el.dataset.locI);
    });
  });
}

/* ---------- dial geometry ----------
   Neighbours sit 60 degrees apart around the sphere. Whatever is at 12 o'clock
   is live; everything past about 88 degrees has faded out entirely, so you
   never see more than the active one and its two neighbours. */
var SPREAD = Math.PI/3;
var FADE_AT = Math.PI*0.49;
function cyc(x, n){
  var y = ((x % n) + n) % n;
  if(y > n/2) y -= n;
  return y;
}
function orbLayout(){
  if(!Orb.stage || !Orb.stage.isConnected) return;
  var orbEl = document.getElementById("orb");
  if(!orbEl) return;
  var R = orbEl.offsetWidth / 2;
  var rad = R * 0.735, n = Orb.n || 1, cMin = Math.cos(FADE_AT);
  var sel = ((Math.round(Orb.pos) % n) + n) % n;
  Orb.labels.forEach(function(el, i){
    var off = cyc(i - Orb.pos, n), th = off * SPREAD;
    if(Math.abs(th) >= FADE_AT){ el.style.opacity = "0"; el.style.visibility = "hidden"; return; }
    var c = Math.cos(th);
    var op = Math.max(0, (c - cMin) / (1 - cMin));
    var x = rad * Math.sin(th), y = -rad * c;
    el.style.visibility = "visible";
    el.style.transform = "translate(-50%,-50%) translate("+x.toFixed(1)+"px,"+y.toFixed(1)+"px) scale("+(0.82 + 0.18*op).toFixed(3)+")";
    el.style.opacity = (0.10 + 0.90*op*op).toFixed(3);
    el.classList.toggle("sel", !Orb.spinning && i === sel && Math.abs(off) < 0.03);
  });
  var skin = document.getElementById("orbSkin");
  if(skin) skin.style.setProperty("--spin", (Orb.pos * 96).toFixed(1));
  var turn = document.getElementById("orbTurn");
  if(turn) turn.style.transform = "rotate("+(Orb.pos * 26).toFixed(2)+"deg)";
}
function orbSetSpinning(on){
  if(Orb.spinning === on) return;
  Orb.spinning = on;
  if(Orb.stage) Orb.stage.classList.toggle("spinning", on);
}
function twistAngle(e){
  var dx = e.touches[1].clientX - e.touches[0].clientX;
  var dy = e.touches[1].clientY - e.touches[0].clientY;
  return Math.atan2(dy, dx);
}
function normAngle(a){
  while(a > Math.PI) a -= Math.PI*2;
  while(a < -Math.PI) a += Math.PI*2;
  return a;
}
/* dPos is in dial slots; positive brings the 2 o'clock label round to the top */
function applySpin(dPos, moved){
  var t = performance.now(), dt = Math.max(8, t - Orb.lastT);
  if(moved){ Orb.moved = true; Orb.movedAt = t; }
  Orb.pos += dPos;
  Orb.vel = Math.max(-0.08, Math.min(0.08, dPos / dt * 16));
  Orb.lastT = t;
  if(Orb.moved) orbSetSpinning(true);
  orbLayout();
}

/* ---------- one pointer, two zones: bezel turns, face responds ---------- */
function orbCentre(){
  var r = document.getElementById("orb").getBoundingClientRect();
  return { x:r.left + r.width/2, y:r.top + r.height/2, r:r.width/2 };
}
function bezelAngle(x, y, c){ return Math.atan2(x - c.x, -(y - c.y)); }
function orbDown(e){
  if(Orb.twoFinger) return;
  if(Pick.on) return;
  var c = orbCentre();
  var dist = Math.sqrt(Math.pow(e.clientX-c.x,2) + Math.pow(e.clientY-c.y,2)) / c.r;
  if(dist > 0.58) startBezel(e, c);
  else swipeDown(e);
}
function startBezel(e, c){
  Orb.bezel = { c:c };
  Orb.moved = false; Orb.snapping = false; Orb.vel = 0;
  Orb.lastBezel = bezelAngle(e.clientX, e.clientY, c);
  Orb.lastT = performance.now();
  document.getElementById("orb").classList.add("grabbing");
  window.addEventListener("pointermove", bezelMove);
  window.addEventListener("pointerup", bezelUp);
  window.addEventListener("pointercancel", bezelUp);
}
function bezelMove(e){
  if(!Orb.bezel) return;
  var a = bezelAngle(e.clientX, e.clientY, Orb.bezel.c);
  var d = normAngle(a - Orb.lastBezel);
  Orb.lastBezel = a;
  applySpin(-d / SPREAD, Math.abs(d) > 0.012);
  e.preventDefault();
}
function endBezel(){
  Orb.bezel = null;
  var o = document.getElementById("orb"); if(o) o.classList.remove("grabbing");
  window.removeEventListener("pointermove", bezelMove);
  window.removeEventListener("pointerup", bezelUp);
  window.removeEventListener("pointercancel", bezelUp);
}
function bezelUp(){
  var b = Orb.bezel; if(!b) return;
  var moved = Orb.moved;
  endBezel();
  if(!moved){ orbSetSpinning(false); orbLayout(); return; }   /* a tap is handled by the label's click */
  orbRun();
}
function orbStepTo(i){
  if(!Orb.n) return;
  Orb.settleTo = Orb.pos + cyc(i - Orb.pos, Orb.n);
  Orb.vel = 0; Orb.snapping = true;
  orbSetSpinning(Math.abs(Orb.settleTo - Orb.pos) > 0.03);
  orbRun();
}
function orbRun(){
  if(Orb.raf) return;
  var tick = function(){
    Orb.raf = null;
    if(Orb.bezel || Orb.twoFinger) return;
    if(!Orb.snapping){
      Orb.pos += Orb.vel; Orb.vel *= 0.82;
      if(Math.abs(Orb.vel) < 0.004){ Orb.snapping = true; Orb.settleTo = Math.round(Orb.pos); }
    } else {
      var diff = Orb.settleTo - Orb.pos;
      Orb.pos += diff * 0.26;
      if(Math.abs(diff) < 0.002){ Orb.pos = Orb.settleTo; orbLayout(); orbSettled(); return; }
    }
    orbLayout();
    Orb.raf = requestAnimationFrame(tick);
  };
  Orb.raf = requestAnimationFrame(tick);
}
function orbSettled(){
  var n = Orb.n, idx = ((Math.round(Orb.pos) % n) + n) % n;
  Orb.pos = idx; Orb.settleTo = idx;
  orbSetSpinning(false); orbLayout();
  var loc = S.locations[idx];
  if(!loc) return;
  if(loc.id === S.session.location){ revealFace(); return; }
  changeLocation(loc.id);
}
function revealFace(){
  var face = document.getElementById("orbFace");
  if(!face) return;
  face.classList.remove("surfacing");
  void face.offsetWidth;
  face.classList.add("surfacing");
}
function changeLocation(id){
  unpin();
  var prev = S.session.location, prevPlace = S.session.lastPlace;
  S.session.location = id;
  if(isTransit(id)){ S.session.briefed = true; }
  else {
    var outstanding = transitTasks();
    if(prevPlace && prevPlace !== id && outstanding.length && (isTransit(prev) || prev !== id)){
      S.ui.arrival = outstanding.slice(0,5).map(function(t){ return t.id; });
    }
    S.session.lastPlace = id; S.session.briefed = false;
  }
  save(); applyHue(); renderNow(true); renderChips();
}

/* ============================================================
   THE PICKER — press and hold to flick through what's here
   ============================================================ */
var Pick = { on:false, list:[], els:[], pos:0, vel:0, raf:null, drag:null, step:54 };

function pickerList(){
  var pool = openTasks().filter(function(t){ return !t.fixedStart && !isCooling(t); }).filter(locationOK);
  if(!isTransit(S.session.location) && S.session.workFinished) pool = pool.filter(function(t){ return t.category !== "Work"; });
  var recent = recentDone(3);
  var ctx = {
    recent:recent, lunch:lunchInfo(), transit:isTransit(S.session.location),
    heavy: recent.filter(function(r){ return r.effort==="deep" || r.duration>=45; }).length,
    workingHours: workingHours(),
    workEasyWin: pool.some(function(t){ return t.category === "Work" && (t.effort === "easy" || t.duration <= 15); }),
    runway: isTransit(S.session.location) ? { mins:600, what:"", kind:"none" } : runway(),
    minsLeftOfDay: Math.max(0, hhmmToMins(S.settings.workUntil) - minsOfDay())
  };
  return pool.map(function(t){ return { t:t, s:scoreTask(t, ctx).score }; })
             .sort(function(a,b){ return b.s - a.s; })
             .map(function(r){ return r.t; });
}
function canPick(){
  if(S.session.dayClosed || !S.session.started) return false;
  if(committedTask()) return false;      /* you committed — no browsing for something nicer */
  if(currentFixed()) return false;
  if(S.focus && !S.focus.paused) return false;      /* not while the clock is running */
  if(!isTransit(S.session.location) && S.session.lunchState === "active") return false;
  return true;
}
function openPicker(){
  if(!canPick()) return;
  var list = pickerList();
  if(list.length < 2){ toast(list.length ? "That's the only thing here." : "Nothing here to choose from."); return; }
  Pick.on = true; Pick.list = list; Pick.vel = 0;
  Pick.armed = false;      /* the release that opened this must not also choose */
  var cur = S.ui.pinnedId, idx = 0;
  for(var i=0;i<list.length;i++) if(list[i].id === cur) idx = i;
  Pick.pos = idx;
  var orb = document.getElementById("orb");
  var face = document.getElementById("orbFace"), dial = document.getElementById("orbDial");
  if(face) face.style.display = "none";
  if(dial) dial.style.display = "none";
  if(orb) orb.classList.add("picking");
  var el = document.getElementById("orbPick");
  if(!el){ el = document.createElement("div"); el.id = "orbPick"; el.className = "orb-pick"; orb.appendChild(el); }
  el.innerHTML = list.map(function(t,i){
    var note = t.duration+" min";
    if(t.postponedToday >= 3) note += " · dodged "+t.postponedToday+"×";
    else if(isRecurring(t)) note += " · "+repeatLabel(t.repeatEvery);
    return '<button class="pick-item" type="button" data-pi="'+i+'"><b>'+esc(t.name)+'</b><small>'+esc(note)+'</small></button>';
  }).join("");
  Pick.els = [].slice.call(el.querySelectorAll(".pick-item"));
  Pick.els.forEach(function(b){
    b.addEventListener("click", function(ev){
      ev.stopPropagation();
      if(!Pick.armed) return;
      if(Pick.moved && performance.now() - Pick.movedAt < 320) return;
      var i = +b.dataset.pi;
      if(Math.abs(cyc(i - Pick.pos, Pick.list.length)) < 0.5) choosePicked(i);
      else { Pick.settleTo = Pick.pos + cyc(i - Pick.pos, Pick.list.length); Pick.vel = 0; Pick.snapping = true; pickRun(); }
    });
  });
  layoutPicker();
  var rl = document.querySelector("#nowRoot .runway");
  if(rl){ rl.dataset.was = rl.textContent; rl.textContent = "Scroll · tap to pick"; }
  el.addEventListener("pointerdown", pickDown);
}
function layoutPicker(){
  var orb = document.getElementById("orb");
  if(!orb) return;
  var R = orb.offsetWidth/2, n = Pick.list.length;
  Pick.step = Math.max(48, R*0.29);
  Pick.els.forEach(function(el,i){
    var off = cyc(i - Pick.pos, n), ad = Math.abs(off);
    if(ad > 1.55){ el.style.opacity = "0"; el.style.visibility = "hidden"; return; }
    el.style.visibility = "visible";
    var op = Math.max(0, 1 - ad/1.45);
    el.style.transform = "translate(-50%,-50%) translateY("+(off*Pick.step).toFixed(1)+"px) scale("+(0.84+0.16*op).toFixed(3)+")";
    el.style.opacity = (0.06 + 0.94*op*op).toFixed(3);
    el.classList.toggle("on", ad < 0.04);
  });
}
function pickDown(e){
  Pick.armed = true;
  Pick.drag = { y:e.clientY, t:performance.now() };
  Pick.moved = false; Pick.snapping = false; Pick.vel = 0;
  window.addEventListener("pointermove", pickMove);
  window.addEventListener("pointerup", pickUp);
  window.addEventListener("pointercancel", pickUp);
}
function pickMove(e){
  if(!Pick.drag) return;
  var dy = e.clientY - Pick.drag.y, t = performance.now(), dt = Math.max(8, t - Pick.drag.t);
  if(Math.abs(dy) > 3){ Pick.moved = true; Pick.movedAt = t; }
  var d = -dy / Pick.step;
  Pick.pos += d;
  Pick.vel = Math.max(-0.12, Math.min(0.12, d / dt * 16));
  Pick.drag.y = e.clientY; Pick.drag.t = t;
  layoutPicker();
  e.preventDefault();
}
function pickUp(){
  if(!Pick.drag) return;
  Pick.drag = null;
  window.removeEventListener("pointermove", pickMove);
  window.removeEventListener("pointerup", pickUp);
  window.removeEventListener("pointercancel", pickUp);
  if(Pick.moved) pickRun();
}
function pickRun(){
  if(Pick.raf) return;
  var tick = function(){
    Pick.raf = null;
    if(Pick.drag) return;
    if(!Pick.snapping){
      Pick.pos += Pick.vel; Pick.vel *= 0.86;
      if(Math.abs(Pick.vel) < 0.005){ Pick.snapping = true; Pick.settleTo = Math.round(Pick.pos); }
    } else {
      var diff = Pick.settleTo - Pick.pos;
      Pick.pos += diff * 0.28;
      if(Math.abs(diff) < 0.002){ Pick.pos = Pick.settleTo; layoutPicker(); return; }
    }
    layoutPicker();
    Pick.raf = requestAnimationFrame(tick);
  };
  Pick.raf = requestAnimationFrame(tick);
}
function choosePicked(i){
  var n = Pick.list.length;
  var idx = ((Math.round(i) % n) + n) % n;
  var t = Pick.list[idx];
  closePicker();
  if(!t) return;
  S.ui.pinnedId = t.id;
  if(t.lastPostponedAt) t.lastPostponedAt = null;      /* you chose it, so it isn't resting any more */
  save(); renderNow(true);
  toast(voice("picked")[0]);
}
function closePicker(){
  if(!Pick.on) return;
  Pick.on = false;
  if(Pick.raf){ cancelAnimationFrame(Pick.raf); Pick.raf = null; }
  var el = document.getElementById("orbPick");
  if(el) el.remove();
  var face = document.getElementById("orbFace"), dial = document.getElementById("orbDial");
  if(face) face.style.display = "";
  if(dial) dial.style.display = "";
  var orb = document.getElementById("orb"); if(orb) orb.classList.remove("picking");
  var rl = document.querySelector("#nowRoot .runway");
  if(rl && rl.dataset.was){ rl.textContent = rl.dataset.was; delete rl.dataset.was; }
}

/* ---------- swipes on the sphere ---------- */
function swipeDown(e){
  if(Orb.twoFinger || Pick.on) return;
  Orb.swipe = { x:e.clientX, y:e.clientY, t:performance.now(), dir:null };
  clearTimeout(Orb.holdT);
  Orb.holdT = setTimeout(function(){
    if(Orb.swipe && !Orb.swipe.dir){ cancelSwipe(); openPicker(); }
  }, 480);
  e.currentTarget.classList.add("grabbing");
  window.addEventListener("pointermove", swipeMove);
  window.addEventListener("pointerup", swipeUp);
  window.addEventListener("pointercancel", cancelSwipe);
}
function swipeDir(dx, dy){
  if(Math.abs(dx) > Math.abs(dy)) return dx < 0 ? "l" : "r";
  return dy < 0 ? "u" : "d";
}
function swipeMove(e){
  var s = Orb.swipe; if(!s) return;
  if(Orb.twoFinger){ cancelSwipe(); return; }
  var dx = e.clientX - s.x, dy = e.clientY - s.y, dist = Math.sqrt(dx*dx + dy*dy);
  var float = document.getElementById("orbFloat");
  var damp = Math.min(46, dist * 0.55), ang = Math.atan2(dy, dx);
  if(float){
    float.style.animation = "none";
    float.style.transform = "translate("+(Math.cos(ang)*damp).toFixed(1)+"px,"+(Math.sin(ang)*damp).toFixed(1)+"px)";
  }
  if(dist > 10) clearTimeout(Orb.holdT);
  var dir = dist > 18 ? swipeDir(dx, dy) : null;
  if(dir !== s.dir){
    ["l","r","u","d"].forEach(function(k){
      var h = document.getElementById("hint-"+k);
      if(h) h.classList.toggle("on", k === dir);
    });
    s.dir = dir;
  }
}
function clearSwipeVisuals(){
  var f = document.getElementById("orbFloat");
  if(f){ f.style.transform = ""; f.style.animation = ""; }
  ["l","r","u","d"].forEach(function(k){ var h = document.getElementById("hint-"+k); if(h) h.classList.remove("on"); });
  var o = document.getElementById("orb"); if(o) o.classList.remove("grabbing");
}
function cancelSwipe(){
  clearTimeout(Orb.holdT);
  Orb.swipe = null;
  clearSwipeVisuals();
  window.removeEventListener("pointermove", swipeMove);
  window.removeEventListener("pointerup", swipeUp);
  window.removeEventListener("pointercancel", cancelSwipe);
}
function swipeUp(e){
  var s = Orb.swipe; if(!s) return;
  var dx = e.clientX - s.x, dy = e.clientY - s.y;
  var dist = Math.sqrt(dx*dx + dy*dy), dt = performance.now() - s.t;
  cancelSwipe();
  if(dist < 14 && dt < 500){ orbTap(); return; }
  if(dist < 44) return;
  orbSwipe(swipeDir(dx, dy));
}

/* ============================================================
   11. DASHBOARD
   ============================================================ */
/* What the dashboard should be showing, worked out before anything is drawn.
   If it matches what's already on screen the ink is left alone and only the
   time-sensitive lines are refreshed. */
function nowView(){
  var s = S.session;
  if(s.dayClosed) return { kind:"closed" };
  if(!s.started) return { kind:"start" };
  if(S.focus) return { kind:"focus", id:S.focus.taskId, paused:!!S.focus.paused, mins:S.focus.plannedMin + S.focus.addedMin };
  if(!isTransit(s.location) && s.lunchState === "active") return { kind:"lunchOn" };
  if(!openTasks().length) return { kind:"empty" };
  var choice = chooseTask();
  if(choice.lunch) return { kind:"lunchDue", early:!!choice.early, choice:choice };
  if(!choice.task) return { kind:"nothing", choice:choice };
  return { kind: isTransit(s.location) ? "transit" : "one", choice:choice, id:choice.task.id };
}
function viewSig(v){
  return [v.kind, v.id||"", v.paused?1:0, v.mins||"", S.session.location,
          v.choice && v.choice.rest ? v.choice.rest.length : 0].join("|");
}
var lastNowSig = null;
function refreshNowLines(){
  var rl = document.querySelector("#nowRoot .runway"), dl = document.querySelector("#nowRoot .dayline");
  if(rl && !S.focus && !isTransit(S.session.location) && !S.session.dayClosed){
    var w = runway();
    if(w.kind !== "none") rl.textContent = fmtDur(w.mins)+" until "+w.what;
  }
  if(dl){
    var p = dayProgress();
    if(/done/.test(dl.textContent)) dl.textContent = p.count+" done · "+fmtDur(p.done)+" on the clock";
  }
  paintDayRing();
}
function renderNow(force){
  var root = document.getElementById("nowRoot");
  applyHue();
  var v = nowView(), sig = viewSig(v);
  if(!force && sig === lastNowSig && document.getElementById("orbStage")){
    refreshNowLines();
    return;
  }
  lastNowSig = sig;
  if(v.kind === "closed"){ root.innerHTML = viewDayClosed(); orbMount(); revealFace(); return; }
  if(v.kind === "start"){ root.innerHTML = viewStart(); return; }
  if(v.kind === "focus"){ root.innerHTML = viewFocus(); orbMount(); startTicker(); return; }
  if(v.kind === "lunchOn"){ root.innerHTML = viewLunchActive(); orbMount(); return; }
  if(v.kind === "empty"){ root.innerHTML = viewEmpty(); orbMount(); return; }
  if(v.kind === "lunchDue"){ root.innerHTML = viewLunchDue(v.early); orbMount(); return; }
  if(v.kind === "nothing"){ root.innerHTML = viewNothing(v.choice); orbMount(); return; }
  root.innerHTML = v.kind === "transit" ? viewTransit(v.choice) : viewOne(v.choice);
  orbMount(); revealFace(); paintDayRing();
}
function todayLog(){ var d = todayKey(); return S.log.filter(function(l){ return l.date === d; }); }
function dayProgress(){
  var entries = todayLog();
  var done = entries.reduce(function(a,l){ return a + (l.minutes||0); }, 0);
  var leftCount = openTasks().filter(function(t){ return !t.locations.some(isTransit) && !isCooling(t); }).length;
  var total = entries.length + leftCount;
  return { done:done, leftCount:leftCount, frac: total ? entries.length/total : 0, count:entries.length,
           checks: entries.filter(function(l){ return l.kind === "check"; }).length };
}
function paintDayRing(){
  var p = dayProgress(), el = document.getElementById("tprog");
  if(el) el.setAttribute("stroke-dashoffset", (351.9 * (1 - p.frac)).toFixed(1));
}
function viewStart(){
  var seg = segmentAt(minsOfDay());
  var here = seg && locById(seg.seg.loc) ? seg.seg.loc : S.session.location;
  return ''+
  '<div class="stack" style="gap:22px;padding:20px 0">'+
    '<div class="stack" style="gap:8px">'+
      '<p class="eyebrow left">'+esc(locLabel(here))+' · '+minsToHHMM(minsOfDay())+'</p>'+
      '<h1 class="big">Right<br>then</h1>'+
      '<p class="lede">Dump everything you\'re carrying. I\'ll work out the order, the timing and what fits where.</p>'+
    '</div>'+
    '<button class="btn go wide" id="dump-open">Brain dump</button>'+
    '<button class="btn wide" data-act="start-day">Start with what\'s already there</button>'+
    '<p class="hint">Lunch, working hours and where you\'ll be live in Setup and Day — set once, forget.</p>'+
  '</div>';
}
function viewEmpty(){
  return orbHTML('<div class="orb-task">Nothing<br>in here</div><div class="orb-sub">the ball is empty</div>', { clear:true })+
    '<p class="runway">'+esc(voice("empty")[0])+'</p>'+
    '<p class="dayline">Swipe down to add'+(micSupported() ? ' · or hold the mic and say it' : '')+'</p>';
}
function viewNothing(choice){
  var here = locLabel(S.session.location);
  if(choice.reason === "nofit"){

/* the orb's verbs */
function orbTap(){
  var s = S.session;
  if(s.dayClosed) return;
  if(S.focus){
    var f = S.focus;
    if(f.paused){ f.startedAt += (Date.now() - f.pausedAt); f.paused = false; f.pausedAt = null; }
    else { f.paused = true; f.pausedAt = Date.now(); }
    save(); renderNow(true);
    return;
  }
  if(!isTransit(s.location) && s.lunchState === "active"){
    S.session.lunchState = "done"; save(); renderNow(true); toast("Right. Back to it."); return;
  }
  var choice = chooseTask();
  if(choice.lunch){
    S.session.lunchState = "active";
    S.session.lunchEndsAt = Date.now() + S.settings.lunchDuration*60000;
    save(); renderNow(true); return;
  }
  if(!choice.task) return;
  if(isTransit(s.location)){ settleTask(choice.task, 0); renderNow(true); return; }
  if(choice.fixed){ beginFocus(choice.task, Math.max(1, taskEndMins(choice.task) - minsOfDay())); return; }
  beginFocus(choice.task);
}
function orbSwipe(dir){
  var s = S.session;
  if(dir === "d"){ draft = draft || newDraft(); openSheet(sheetAddTask(), bindAddTask); return; }
  if(s.dayClosed) return;
  if(S.focus){
    var ct = committedTask();
    if(ct){
      /* no walking away from a committed job by accident — reassess instead */
      if(dir === "r"){ openSheet(sheetCommitCheck()); return; }
      openSheet(sheetCommitCheck());
      return;
    }
    if(dir === "r"){ finishFocus(); return; }
    if(dir === "l"){ abandonFocus(); return; }
    if(dir === "u"){ abandonFocus(true); return; }
    return;
  }
  var choice = chooseTask(), t = choice.task;
  if(!t) return;
  if(dir === "r"){ settleTask(t, 0); renderNow(true); return; }
  if(dir === "l"){
    if(choice.fixed){ toast("That one's happening whether you like it or not."); return; }
    t.postponedToday++; t.lastPostponedAt = Date.now();
    unpin(); save();
    toast(t.postponedToday === 1 ? voice("dodge1")[0]
        : (t.postponedToday === 2 ? voice("dodge2")[0] : voice("dodge3")[0]));
    renderNow(true);
    return;
  }
  if(dir === "u"){ openSheet(sheetBlocked(t.id)); return; }
}
function flashDone(t){
  toast("✓ "+t.name, function(){ t.status = "open"; t.completedAt = null; save(); render(); });
}
/* completing a check-in cycles it; the toast is where you close it off for good */
function settleTask(t, mins){
  var parent = t.unblocks ? byId(t.unblocks) : null;
  if(parent && parent.status === "blocked"){
    completeTask(t, mins);
    toast(parent.name+" was waiting on that", function(){
      parent.status = "open"; parent.blockedReason = null; parent.lastPostponedAt = null;
      unpin(); save(); render(); toast("Back in play.");
    }, "put it back");
    return;
  }
  if(isRecurring(t)){
    checkTask(t, mins);
    toast("✓ "+t.name+" · back in "+repeatLabel(t.repeatEvery).replace("every ",""),
      function(){ finishRecurring(t); render(); toast("Closed off for today."); }, "finish for today");
  } else {
    completeTask(t, mins);
    flashDone(t);
  }
}

   12. TIMER
   ============================================================ */
var ticker = null;
function startTicker(){ stopTicker(); tick(); ticker = setInterval(tick, 500); }
function stopTicker(){ if(ticker){ clearInterval(ticker); ticker = null; } }
function tick(){
  var f = S.focus;
  if(!f) return stopTicker();
  var clock = document.getElementById("clock");
  if(!clock) return;
  var total = (f.plannedMin + f.addedMin)*60;
  var elapsed = f.paused ? (f.pausedAt - f.startedAt)/1000 : (Date.now() - f.startedAt)/1000;
  var left = total - elapsed;
  clock.textContent = mmss(left);
  var prog = document.getElementById("tprog"), ring = document.getElementById("orbRing");
  if(prog){
    var frac = Math.max(0, Math.min(1, elapsed/total));
    prog.setAttribute("stroke-dashoffset", (351.9*(1-frac)).toFixed(1));
    if(ring) ring.classList.toggle("over", left < 0);
  }
  var rl = document.getElementById("runwayLine");
  if(rl && !isCommitted(byId(f.taskId))){
    var w = runway();
    rl.textContent = f.paused ? "Paused" : (w.kind==="none" ? "" : fmtDur(w.mins)+" until "+w.what);
  }
  if(left <= 0 && !f.rang && !f.paused){
    f.rang = true; save(); stopTicker(); chime();
    if(f.makingSafe){
      var mt = byId(f.taskId), mm = endFocus();
      if(mt){
        mt.actualMinutes = (mt.actualMinutes||0) + mm;
        recordRun(mt, "rabbit");
        mt.commit = null; mt.safeStopped = true; mt.lastPostponedAt = Date.now();
      }
      unpin(); save(); renderNow(true);
      toast("Down tools. That's enough of that one.");
      return;
    }
    openSheet(committedTask() ? sheetCommitCheck() : sheetTimeUp());
  }
}
/* Minutes already spent on a task belong to that task. Come back to something
   you parked and the clock carries on from where you left it, rather than
   handing you the full estimate all over again. Check-ins are the exception:
   every cycle is its own fresh session. */
function timeLeftOn(t){
  if(isRecurring(t)) return t.duration;
  var spent = Math.round(t.actualMinutes || 0);
  if(spent <= 0) return t.duration;
  return t.duration - spent;
}
function beginFocus(t, forcedMins){
  if(!t.originalEstimate) t.originalEstimate = t.duration;
  var spent = isRecurring(t) ? 0 : Math.round(t.actualMinutes || 0);
  var left = timeLeftOn(t);
  var planned = forcedMins || (spent > 0 ? Math.max(5, left) : t.duration);
  S.focus = { taskId:t.id, startedAt:Date.now(), plannedMin:planned, addedMin:0, extensions:0,
              paused:false, pausedAt:null, rang:false, resumedFrom: spent > 0 ? spent : 0 };
  save(); renderNow(true);
  if(spent > 0 && !forcedMins){
    toast(left > 0 ? "Picking up where you left off — "+fmtDur(spent)+" already in."
                   : "You're already past the estimate. "+planned+" minutes to see it off.");
  } else {
    toast(voice("start", { mins: planned })[0]);
  }
}
function endFocus(){
  var f = S.focus; if(!f) return 0;
  var mins = Math.round(((f.paused? f.pausedAt : Date.now()) - f.startedAt)/60000);
  S.focus = null; stopTicker();
  return Math.max(1, mins);
}
function finishFocus(){
  var t = byId(S.focus && S.focus.taskId), mins = endFocus();
  if(t){ recordRun(t, "finished", mins); t.commit = null; }
  if(t) settleTask(t, mins);
  closeSheet(); save(); renderNow(true);
}
function abandonFocus(block){
  var t = byId(S.focus && S.focus.taskId), mins = endFocus();
  if(t){
    t.actualMinutes = (t.actualMinutes||0) + mins;
    if(block){ save(); closeSheet(); renderNow(true); openSheet(sheetBlocked(t.id)); return; }
    t.postponedToday++; t.lastPostponedAt = Date.now();
  }
  save(); closeSheet(); renderNow(true); toast("Fine. Something else then.");
}
